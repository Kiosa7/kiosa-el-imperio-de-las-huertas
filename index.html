<script>
"use strict";
/* =========================================================================
   KIOSA: EL IMPERIO DE LAS HUERTAS
   Juego arcade idle 2D — HTML5 canvas + JS vanilla, un solo archivo.
   Secciones: CONFIG · FRUITS · CHALLENGES · Estado · Save · SFX · Entidades
              (Plant, Player, Helper) · Zonas y círculos · Retos · Partículas
              · Input · Render · Loop
   ========================================================================= */

/* ============================== 1. CONFIG =============================== */
const CONFIG = {
  // Mundo y cámara
  WORLD_W: 720,
  WORLD_H: 1280,
  VIEW_W: 460,          // ancho lógico deseado de la vista
  VIEW_H: 900,          // alto lógico deseado de la vista
  CAM_LERP: 6,
  MAX_DT: 0.05,

  // Jugador
  PLAYER_SPEED: 180,           // px/s
  SPEED_PENALTY_PER_FRUIT: 0.01,
  SPEED_MIN_FACTOR: 0.60,
  CAP_START: 10,
  CAP_MAX: 40,

  // Recolección
  HARVEST_RADIUS: 60,
  HARVEST_INTERVAL: 0.15,
  PLANT_MAX_FRUIT: 3,
  PLANT_REGEN: 2.0,

  // Venta
  SELL_INTERVAL: 0.12,

  // Mejoras
  PAY_TIME: 1.5,               // segundos para pagar el precio completo
  ARBOL_COSTO: 50,  ARBOL_MULT: 1.35,
  MOCHILA_COSTO: 80, MOCHILA_MULT: 1.60, MOCHILA_PASO: 5,
  AYUDANTE_COSTOS: [250, 500],
  AYUDANTE_MAX: 2,
  HELPER_SPEED_FACTOR: 0.70,
  HELPER_CAP: 6,
  HELPER_HARVEST_INTERVAL: 0.30,
  HELPER_SELL_INTERVAL: 0.18,
  HELPER_COLORS: ['#e0568f', '#7b5cd6'],

  // Guardado
  SAVE_KEY: 'kiosaImperio.v1',
  SAVE_VERSION: 1,
  SAVE_INTERVAL: 3.0
};

const WORLD_W = CONFIG.WORLD_W, WORLD_H = CONFIG.WORLD_H;

// Zona de venta (mostrador + área pisable)
const SELL = { x: 250, y: 852, w: 220, h: 118, cx: 360, cy: 911 };
const COUNTER = { x: 258, y: 772, w: 204, h: 66 };

/* ============================== 2. FRUITS ===============================
   Para añadir una fruta nueva (papaya, guayaba, piña…) basta con agregar
   un objeto a este arreglo: nada de lógica cambia. Si `desbloqueadaInicio`
   es false, se desbloquea cuando un reto la referencie en `desbloquea`.
   ======================================================================== */
const FRUITS = [
  {
    id: 'mango',
    nombre: 'Mango',
    plural: 'mangos',
    precio: 6,
    tipoPlanta: 'arbol',
    desbloqueadaInicio: true,
    colores: {
      fruta: '#ffc233', frutaSombra: '#e8901d',
      copa: '#46b05a', copaOscura: '#2f8b41', tronco: '#8a5a2b'
    },
    zona: { x: 50, y: 48, w: 620, h: 366, nombre: 'HUERTA DE MANGOS' },
    posiciones: [[150,158],[360,124],[572,162],[236,306],[494,312]],
    posicionesExtra: [[84,258],[644,266],[360,252],[136,382],[598,384]]
  },
  {
    id: 'naranja',
    nombre: 'Naranja',
    plural: 'naranjas',
    precio: 11,
    tipoPlanta: 'arbol',
    desbloqueadaInicio: false,
    colores: {
      fruta: '#ff8c1a', frutaSombra: '#d96504',
      copa: '#5cbf5f', copaOscura: '#37974a', tronco: '#7d5327'
    },
    zona: { x: 44, y: 440, w: 292, h: 292, nombre: 'HUERTA DE NARANJAS' },
    posiciones: [[112,534],[268,512],[188,654]],
    posicionesExtra: [[96,694],[300,664],[240,594],[142,474]]
  },
  {
    id: 'sandia',
    nombre: 'Sandía',
    plural: 'sandías',
    precio: 20,
    tipoPlanta: 'rastrera',
    desbloqueadaInicio: false,
    colores: {
      fruta: '#4aa53f', frutaSombra: '#2d7a2a',
      copa: '#3f9d46', copaOscura: '#2c7a34', tronco: '#2c7a34'
    },
    zona: { x: 384, y: 440, w: 292, h: 292, nombre: 'PARCHE DE SANDÍAS' },
    posiciones: [[452,536],[612,522],[532,656]],
    posicionesExtra: [[424,668],[650,664],[542,472],[470,600]]
  }
];
const FRUIT_BY_ID = {};
FRUITS.forEach(f => { FRUIT_BY_ID[f.id] = f; f._fade = 1; });

/* ============================= 3. CHALLENGES ============================ */
const CHALLENGES = [
  { id: 'v25mango', texto: 'Vende 25 mangos', meta: 25,
    progreso: s => s.ventasPorFruta.mango || 0, desbloquea: 'naranja' },
  { id: 'gana500', texto: 'Gana $500 en total', meta: 500,
    progreso: s => Math.floor(s.dineroTotal), desbloquea: 'sandia' },
  { id: 'ayudante', texto: 'Contrata un ayudante', meta: 1,
    progreso: s => s.ayudantes },
  { id: 'v150', texto: 'Vende 150 frutas en total', meta: 150,
    progreso: s => s.ventasTotales, final: true }
];

/* ============================== 4. ESTADO =============================== */
function estadoNuevo() {
  return {
    dinero: 0,
    dineroTotal: 0,
    ventasTotales: 0,
    ventasPorFruta: {},
    recolectadas: 0,
    capacidad: CONFIG.CAP_START,
    compras: { arbol: 0, mochila: 0 },
    extras: {},                 // { fruitId: nPlantasExtra }
    ayudantes: 0,
    retoIdx: 0,
    pagos: { arbol: 0, mochila: 0, ayudante: 0 },
    hints: { caminar: false, vender: false, mejorar: false },
    mute: false,
    desbloqueadas: FRUITS.filter(f => f.desbloqueadaInicio).map(f => f.id)
  };
}
let state = estadoNuevo();

const plants = [];
const helpers = [];
const confetti = [];
const floats = [];
let bigMsg = null;      // { txt, t }
let saveTimer = 0;

/* ============================== 5. SAVE ================================= */
const Save = {
  disponible: (function () {
    try {
      const k = '__kiosa_test__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  })(),

  guardar() {
    if (!this.disponible) return;
    try {
      const data = {
        v: CONFIG.SAVE_VERSION,
        dinero: state.dinero,
        dineroTotal: state.dineroTotal,
        ventasTotales: state.ventasTotales,
        ventasPorFruta: state.ventasPorFruta,
        recolectadas: state.recolectadas,
        capacidad: state.capacidad,
        compras: state.compras,
        extras: state.extras,
        ayudantes: state.ayudantes,
        retoIdx: state.retoIdx,
        pagos: state.pagos,
        hints: state.hints,
        mute: state.mute,
        desbloqueadas: state.desbloqueadas
      };
      window.localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(data));
    } catch (e) { /* cuota llena o modo privado: seguimos sin guardar */ }
  },

  cargar() {
    if (!this.disponible) return false;
    let raw = null;
    try { raw = window.localStorage.getItem(CONFIG.SAVE_KEY); } catch (e) { return false; }
    if (!raw) return false;
    let d = null;
    try { d = JSON.parse(raw); } catch (e) { d = null; }
    if (!d || typeof d !== 'object' || d.v !== CONFIG.SAVE_VERSION) {
      this.borrar();
      return false;
    }
    try {
      const s = estadoNuevo();
      s.dinero = num(d.dinero, 0);
      s.dineroTotal = num(d.dineroTotal, 0);
      s.ventasTotales = num(d.ventasTotales, 0) | 0;
      s.recolectadas = num(d.recolectadas, 0) | 0;
      s.capacidad = clamp(num(d.capacidad, CONFIG.CAP_START) | 0, CONFIG.CAP_START, CONFIG.CAP_MAX);
      s.ayudantes = clamp(num(d.ayudantes, 0) | 0, 0, CONFIG.AYUDANTE_MAX);
      s.retoIdx = clamp(num(d.retoIdx, 0) | 0, 0, CHALLENGES.length);
      s.mute = !!d.mute;
      if (d.ventasPorFruta && typeof d.ventasPorFruta === 'object') {
        for (const f of FRUITS) s.ventasPorFruta[f.id] = num(d.ventasPorFruta[f.id], 0) | 0;
      }
      if (d.compras && typeof d.compras === 'object') {
        s.compras.arbol = num(d.compras.arbol, 0) | 0;
        s.compras.mochila = num(d.compras.mochila, 0) | 0;
      }
      if (d.extras && typeof d.extras === 'object') {
        for (const f of FRUITS) {
          s.extras[f.id] = clamp(num(d.extras[f.id], 0) | 0, 0, f.posicionesExtra.length);
        }
      }
      if (d.pagos && typeof d.pagos === 'object') {
        s.pagos.arbol = Math.max(0, num(d.pagos.arbol, 0));
        s.pagos.mochila = Math.max(0, num(d.pagos.mochila, 0));
        s.pagos.ayudante = Math.max(0, num(d.pagos.ayudante, 0));
      }
      if (d.hints && typeof d.hints === 'object') {
        s.hints.caminar = !!d.hints.caminar;
        s.hints.vender = !!d.hints.vender;
        s.hints.mejorar = !!d.hints.mejorar;
      }
      if (Array.isArray(d.desbloqueadas)) {
        const val = d.desbloqueadas.filter(id => !!FRUIT_BY_ID[id]);
        s.desbloqueadas = val.length ? val : estadoNuevo().desbloqueadas;
      }
      state = s;
      return true;
    } catch (e) {
      this.borrar();
      return false;
    }
  },

  borrar() {
    if (!this.disponible) return;
    try { window.localStorage.removeItem(CONFIG.SAVE_KEY); } catch (e) {}
  }
};

function num(v, def) { return (typeof v === 'number' && isFinite(v)) ? v : def; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }

/* =============================== 6. SFX ================================= */
const SFX = {
  ac: null,
  init() {
    if (this.ac) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ac = new AC();
    } catch (e) { this.ac = null; }
  },
  resume() {
    this.init();
    if (this.ac && this.ac.state === 'suspended') {
      try { this.ac.resume(); } catch (e) {}
    }
  },
  tono(freq, dur, tipo, vol, delay) {
    if (!this.ac || state.mute) return;
    try {
      const t0 = this.ac.currentTime + (delay || 0);
      const o = this.ac.createOscillator();
      const g = this.ac.createGain();
      o.type = tipo || 'triangle';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol || 0.16, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(this.ac.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e) {}
  },
  pop() { this.tono(500 + Math.random() * 280, 0.11, 'triangle', 0.15); },
  chaching() {
    this.tono(988, 0.09, 'square', 0.09);
    this.tono(1319, 0.22, 'square', 0.09, 0.07);
  },
  fanfarria() {
    [523, 659, 784, 1047].forEach((f, i) => this.tono(f, 0.24, 'triangle', 0.13, i * 0.095));
  }
};

/* ============================ 7. ENTIDADES ============================== */
class Plant {
  constructor(fruit, x, y, popInicial) {
    this.fruit = fruit;
    this.x = x; this.y = y;
    this.frutas = CONFIG.PLANT_MAX_FRUIT;
    this.regen = 0;
    this.pop = popInicial ? 1 : 0;
    this.seed = Math.random() * Math.PI * 2;
  }
  update(dt) {
    if (this.frutas < CONFIG.PLANT_MAX_FRUIT) {
      this.regen += dt;
      if (this.regen >= CONFIG.PLANT_REGEN) { this.regen = 0; this.frutas++; this.pop = 0.6; }
    } else this.regen = 0;
    if (this.pop > 0) this.pop = Math.max(0, this.pop - dt * 3.2);
  }
  tomar() {
    if (this.frutas <= 0) return null;
    this.frutas--;
    this.pop = 1;
    return this.fruit.id;
  }
}

class Player {
  constructor() {
    this.x = 360; this.y = 700;
    this.carga = [];
    this.facing = 1;
    this.phase = 0;
    this.moving = false;
    this.harvestT = 0;
    this.sellT = 0;
    this.swayT = 0;
    this.fullT = 0;
  }
  get factorVel() {
    return Math.max(CONFIG.SPEED_MIN_FACTOR,
      1 - CONFIG.SPEED_PENALTY_PER_FRUIT * this.carga.length);
  }
  update(dt, ix, iy) {
    const mag = Math.hypot(ix, iy);
    this.moving = mag > 0.06;
    if (this.moving) {
      const nx = ix / mag, ny = iy / mag;
      const sp = CONFIG.PLAYER_SPEED * this.factorVel * Math.min(1, mag);
      this.x += nx * sp * dt;
      this.y += ny * sp * dt;
      if (Math.abs(nx) > 0.15) this.facing = nx > 0 ? 1 : -1;
      this.phase += dt * (7 + sp * 0.03);
      this.swayT += dt * 6;
    } else {
      this.phase = lerp(this.phase, Math.round(this.phase / Math.PI) * Math.PI, Math.min(1, dt * 10));
      this.swayT += dt * 2;
    }
    this.x = clamp(this.x, 22, WORLD_W - 22);
    this.y = clamp(this.y, 30, WORLD_H - 24);

    // ---- Cosecha por proximidad ----
    if (this.carga.length < state.capacidad) {
      this.fullT = 0;
      this.harvestT += dt;
      if (this.harvestT >= CONFIG.HARVEST_INTERVAL) {
        const p = plantaCercanaConFruta(this.x, this.y, CONFIG.HARVEST_RADIUS);
        if (p) {
          this.harvestT = 0;
          const id = p.tomar();
          if (id) {
            this.carga.push(id);
            state.recolectadas++;
            state.hints.caminar = true;
            SFX.pop();
          }
        } else {
          this.harvestT = CONFIG.HARVEST_INTERVAL;
        }
      }
    } else {
      this.harvestT = 0;
      this.fullT += dt;
    }

    // ---- Venta por proximidad ----
    if (enVenta(this.x, this.y) && this.carga.length > 0) {
      this.sellT += dt;
      while (this.sellT >= CONFIG.SELL_INTERVAL && this.carga.length > 0) {
        this.sellT -= CONFIG.SELL_INTERVAL;
        venderUna(this.carga.pop(), this.x, this.y - 10);
      }
    } else this.sellT = 0;
  }
}

class Helper {
  constructor(idx) {
    this.idx = idx;
    this.color = CONFIG.HELPER_COLORS[idx % CONFIG.HELPER_COLORS.length];
    this.x = SELL.cx + (idx === 0 ? -56 : 56);
    this.y = SELL.cy + 30;
    this.carga = [];
    this.modo = 'cosechar';
    this.t = 0;
    this.phase = Math.random() * 6.28;
    this.facing = 1;
    this.moving = false;
    this.target = null;
    this.swayT = Math.random() * 6.28;
  }
  irHacia(tx, ty, dt) {
    const dx = tx - this.x, dy = ty - this.y;
    const d = Math.hypot(dx, dy);
    const sp = CONFIG.PLAYER_SPEED * CONFIG.HELPER_SPEED_FACTOR;
    if (d > 3) {
      const f = Math.min(1, sp * dt / d);
      this.x += dx * f; this.y += dy * f;
      if (Math.abs(dx) > 0.6) this.facing = dx > 0 ? 1 : -1;
      this.phase += dt * 8;
      this.moving = true;
    } else this.moving = false;
    return d;
  }
  update(dt) {
    this.swayT += dt * (this.moving ? 6 : 2);
    if (this.modo === 'cosechar') {
      if (this.carga.length >= CONFIG.HELPER_CAP) { this.modo = 'vender'; this.t = 0; return; }
      if (!this.target || this.target.frutas <= 0 || plants.indexOf(this.target) < 0) {
        this.target = plantaCercanaConFruta(this.x, this.y, Infinity);
      }
      if (!this.target) {
        this.moving = false;
        if (this.carga.length > 0) { this.modo = 'vender'; this.t = 0; }
        return;
      }
      const d = this.irHacia(this.target.x, this.target.y + 6, dt);
      if (d < CONFIG.HARVEST_RADIUS * 0.75) {
        this.t += dt;
        if (this.t >= CONFIG.HELPER_HARVEST_INTERVAL) {
          this.t = 0;
          const id = this.target.tomar();
          if (id) { this.carga.push(id); SFX.pop(); }
          else this.target = null;
        }
      }
    } else {
      this.irHacia(SELL.cx, SELL.cy, dt);
      if (enVenta(this.x, this.y)) {
        this.moving = false;
        this.t += dt;
        if (this.t >= CONFIG.HELPER_SELL_INTERVAL) {
          this.t = 0;
          const id = this.carga.pop();
          if (id) venderUna(id, this.x, this.y - 10);
          if (this.carga.length === 0) { this.modo = 'cosechar'; this.target = null; }
        }
      }
    }
  }
}

const player = new Player();

/* ====================== 8. ZONAS, PLANTAS Y COMPRAS ===================== */
function desbloqueada(id) { return state.desbloqueadas.indexOf(id) >= 0; }

function frutaReciente() {
  for (let i = state.desbloqueadas.length - 1; i >= 0; i--) {
    const f = FRUIT_BY_ID[state.desbloqueadas[i]];
    if (f) return f;
  }
  return null;
}

function agregarPlantasZona(f, conPop) {
  const extras = clamp(state.extras[f.id] || 0, 0, f.posicionesExtra.length);
  const pos = f.posiciones.concat(f.posicionesExtra.slice(0, extras));
  for (const p of pos) plants.push(new Plant(f, p[0], p[1], conPop));
}

function reconstruirMundo() {
  plants.length = 0;
  for (const f of FRUITS) {
    f._fade = desbloqueada(f.id) ? 0 : 1;
    if (desbloqueada(f.id)) agregarPlantasZona(f, false);
  }
  helpers.length = 0;
  for (let i = 0; i < state.ayudantes; i++) helpers.push(new Helper(i));
}

function plantaCercanaConFruta(x, y, radio) {
  let best = null, bd = radio * radio;
  for (const p of plants) {
    if (p.frutas <= 0) continue;
    const dx = p.x - x, dy = p.y - y;
    const d = dx * dx + dy * dy;
    if (d <= bd) { bd = d; best = p; }
  }
  return best;
}
function plantaCercana(x, y) {
  let best = null, bd = Infinity;
  for (const p of plants) {
    const dx = p.x - x, dy = p.y - y, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

function enVenta(x, y) {
  return x > SELL.x && x < SELL.x + SELL.w && y > SELL.y && y < SELL.y + SELL.h;
}

function venderUna(id, x, y) {
  const f = FRUIT_BY_ID[id];
  if (!f) return;
  state.dinero += f.precio;
  state.dineroTotal += f.precio;
  state.ventasTotales++;
  state.ventasPorFruta[id] = (state.ventasPorFruta[id] || 0) + 1;
  state.hints.vender = true;
  floats.push({ x: x + rand(-14, 14), y: y - 20, t: 0, txt: '+$' + f.precio });
  SFX.chaching();
}

/* --------------------------- Círculos de mejora ------------------------- */
const circles = [
  {
    id: 'arbol', icono: '🌳', titulo: '+1 ÁRBOL',
    x: 128, y: 1132, r: 58,
    precio() { return Math.round(CONFIG.ARBOL_COSTO * Math.pow(CONFIG.ARBOL_MULT, state.compras.arbol)); },
    max() {
      const f = frutaReciente();
      if (!f) return true;
      return (state.extras[f.id] || 0) >= f.posicionesExtra.length;
    },
    comprar() {
      const f = frutaReciente();
      if (!f) return;
      const n = (state.extras[f.id] || 0);
      if (n >= f.posicionesExtra.length) return;
      state.extras[f.id] = n + 1;
      state.compras.arbol++;
      const p = f.posicionesExtra[n];
      plants.push(new Plant(f, p[0], p[1], true));
      lanzarConfeti(p[0], p[1] - 30, 26);
    }
  },
  {
    id: 'mochila', icono: '🎒', titulo: 'MOCHILA +5',
    x: 360, y: 1132, r: 58,
    precio() { return Math.round(CONFIG.MOCHILA_COSTO * Math.pow(CONFIG.MOCHILA_MULT, state.compras.mochila)); },
    max() { return state.capacidad >= CONFIG.CAP_MAX; },
    comprar() {
      state.capacidad = Math.min(CONFIG.CAP_MAX, state.capacidad + CONFIG.MOCHILA_PASO);
      state.compras.mochila++;
    }
  },
  {
    id: 'ayudante', icono: '🧑‍🌾', titulo: 'AYUDANTE',
    x: 592, y: 1132, r: 58,
    precio() { return CONFIG.AYUDANTE_COSTOS[Math.min(state.ayudantes, CONFIG.AYUDANTE_COSTOS.length - 1)]; },
    max() { return state.ayudantes >= CONFIG.AYUDANTE_MAX; },
    comprar() {
      helpers.push(new Helper(state.ayudantes));
      state.ayudantes++;
    }
  }
];

function totalCompras() {
  return state.compras.arbol + state.compras.mochila + state.ayudantes;
}

function actualizarCirculos(dt) {
  for (const c of circles) {
    const dentro = Math.hypot(player.x - c.x, player.y - c.y) <= c.r;
    c._hover = dentro;
    if (c.max()) { state.pagos[c.id] = 0; continue; }
    if (!dentro) continue;
    const precio = c.precio();
    const falta = precio - state.pagos[c.id];
    if (falta <= 0) continue;
    const rate = precio / CONFIG.PAY_TIME;
    const cobro = Math.min(rate * dt, falta, state.dinero);
    if (cobro > 0) {
      state.dinero -= cobro;
      state.pagos[c.id] += cobro;
    }
    if (state.pagos[c.id] >= precio - 0.001) {
      state.pagos[c.id] = 0;
      c.comprar();
      state.hints.mejorar = true;
      lanzarConfeti(c.x, c.y - 20, 34);
      SFX.fanfarria();
      Save.guardar();
    }
  }
}

/* ============================== 9. RETOS ================================ */
function retoActual() {
  return state.retoIdx < CHALLENGES.length ? CHALLENGES[state.retoIdx] : null;
}

function desbloquearZona(fruitId, conFiesta) {
  const f = FRUIT_BY_ID[fruitId];
  if (!f || desbloqueada(fruitId)) return;
  state.desbloqueadas.push(fruitId);
  agregarPlantasZona(f, true);
  if (conFiesta) {
    const z = f.zona;
    for (let i = 0; i < 46; i++) {
      lanzarConfeti(z.x + rand(30, z.w - 30), z.y + rand(30, z.h - 30), 1);
    }
  } else {
    f._fade = 0;
  }
}

function actualizarRetos(conFiesta) {
  let guard = 0;
  while (state.retoIdx < CHALLENGES.length && guard++ < 10) {
    const r = CHALLENGES[state.retoIdx];
    if (r.progreso(state) < r.meta) break;
    state.retoIdx++;
    if (r.desbloquea) desbloquearZona(r.desbloquea, conFiesta);
    if (conFiesta) {
      SFX.fanfarria();
      cam.shake = 0.45;
      if (r.final) {
        bigMsg = { txt: '¡Huerta completa!', t: 0 };
        for (let i = 0; i < 160; i++) {
          lanzarConfeti(rand(40, WORLD_W - 40), rand(cam.y + 60, cam.y + view.h - 120), 1);
        }
      } else {
        bigMsg = { txt: '¡Reto completado!', t: 0 };
        for (let i = 0; i < 50; i++) lanzarConfeti(player.x + rand(-90, 90), player.y + rand(-90, 30), 1);
      }
    }
    Save.guardar();
  }
}

const CONFETI_COLORES = ['#ff5d5d', '#ffd166', '#4ecdc4', '#8affc1', '#ff9f1c', '#c77dff', '#ffffff'];
function lanzarConfeti(x, y, n) {
  for (let i = 0; i < n; i++) {
    confetti.push({
      x: x, y: y,
      vx: rand(-140, 140), vy: rand(-260, -70),
      rot: rand(0, 6.28), vr: rand(-9, 9),
      w: rand(5, 10), h: rand(7, 13),
      c: CONFETI_COLORES[(Math.random() * CONFETI_COLORES.length) | 0],
      t: 0, vida: rand(0.9, 1.7)
    });
  }
}
function actualizarParticulas(dt) {
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i];
    p.t += dt;
    p.vy += 620 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vr * dt;
    if (p.t >= p.vida) confetti.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.t += dt;
    f.y -= 46 * dt;
    if (f.t >= 1.0) floats.splice(i, 1);
  }
  if (bigMsg) { bigMsg.t += dt; if (bigMsg.t > 2.6) bigMsg = null; }
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let cw = 320, ch = 640, dpr = 1;
const view = { scale: 1, w: CONFIG.VIEW_W, h: CONFIG.VIEW_H };
const cam = { x: 0, y: 0, shake: 0 };

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const winW = Math.max(240, window.innerWidth);
  const winH = Math.max(320, window.innerHeight);
  ch = winH;
  cw = Math.min(winW, Math.round(winH * 0.62));
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  view.scale = Math.max(cw / CONFIG.VIEW_W, ch / CONFIG.VIEW_H);
  view.w = cw / view.scale;
  view.h = ch / view.scale;
  layoutHUD();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

function actualizarCamara(dt) {
  let tx, ty;
  if (view.w >= WORLD_W) tx = (WORLD_W - view.w) / 2;
  else tx = clamp(player.x - view.w / 2, 0, WORLD_W - view.w);
  if (view.h >= WORLD_H) ty = (WORLD_H - view.h) / 2;
  else ty = clamp(player.y - view.h / 2, 0, WORLD_H - view.h);
  const k = Math.min(1, dt * CONFIG.CAM_LERP);
  cam.x = lerp(cam.x, tx, k);
  cam.y = lerp(cam.y, ty, k);
  if (cam.shake > 0) cam.shake = Math.max(0, cam.shake - dt);
}

const keys = Object.create(null);
const joy = { activo: false, id: null, bx: 0, by: 0, kx: 0, ky: 0, dx: 0, dy: 0 };
const HUD_BTN = { mute: { x: 0, y: 0, s: 38 }, reset: { x: 0, y: 0, s: 38 } };

function layoutHUD() {
  const top = 14;
  HUD_BTN.mute.x = cw - 48; HUD_BTN.mute.y = top + 52;
  HUD_BTN.reset.x = cw - 48; HUD_BTN.reset.y = top + 98;
}

function puntoEnBtn(b, x, y) {
  return x >= b.x && x <= b.x + b.s && y >= b.y && y <= b.y + b.s;
}

function posCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('pointerdown', e => {
  SFX.resume();
  const p = posCanvas(e);
  if (puntoEnBtn(HUD_BTN.mute, p.x, p.y)) {
    state.mute = !state.mute;
    if (!state.mute) SFX.pop();
    Save.guardar();
    return;
  }
  if (puntoEnBtn(HUD_BTN.reset, p.x, p.y)) {
    if (window.confirm('¿Reiniciar el juego? Se borrará todo tu progreso.')) {
      Save.borrar();
      window.location.reload();
    }
    return;
  }
  if (joy.activo) return;
  joy.activo = true; joy.id = e.pointerId;
  joy.bx = p.x; joy.by = p.y; joy.kx = p.x; joy.ky = p.y;
  joy.dx = 0; joy.dy = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  if (!joy.activo || e.pointerId !== joy.id) return;
  const p = posCanvas(e);
  let dx = p.x - joy.bx, dy = p.y - joy.by;
  const d = Math.hypot(dx, dy);
  const R = 52;
  if (d > R) { dx = dx / d * R; dy = dy / d * R; }
  joy.kx = joy.bx + dx; joy.ky = joy.by + dy;
  const m = Math.min(1, d / R);
  if (d > 0.001) { joy.dx = (dx / (d > R ? R : Math.max(d, 0.001))) * m; joy.dy = (dy / (d > R ? R : Math.max(d, 0.001))) * m; }
  else { joy.dx = 0; joy.dy = 0; }
  e.preventDefault();
}, { passive: false });

function soltarJoystick(e) {
  if (!joy.activo || (e && e.pointerId !== joy.id)) return;
  joy.activo = false; joy.id = null; joy.dx = 0; joy.dy = 0;
}
canvas.addEventListener('pointerup', soltarJoystick);
canvas.addEventListener('pointercancel', soltarJoystick);
canvas.addEventListener('lostpointercapture', soltarJoystick);
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (!e.key) return;
  const k = e.key.toLowerCase();
  keys[k] = true;
  SFX.resume();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(k) >= 0) e.preventDefault();
}, { passive: false });
window.addEventListener('keyup', e => { if (e.key) keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; soltarJoystick(null); });

function inputVector() {
  let ix = 0, iy = 0;
  if (keys['a'] || keys['arrowleft']) ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;
  if (keys['w'] || keys['arrowup']) iy -= 1;
  if (keys['s'] || keys['arrowdown']) iy += 1;
  if (ix !== 0 || iy !== 0) {
    const m = Math.hypot(ix, iy);
    return { x: ix / m, y: iy / m };
  }
  if (joy.activo) return { x: joy.dx, y: joy.dy };
  return { x: 0, y: 0 };
}

/* ============================== 14. RENDER ============================== */
function rr(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function circulo(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.closePath(); }
function elipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 6.2832); ctx.closePath(); }

function texto(txt, x, y, size, color, align, bold, outline, outlineColor) {
  ctx.font = (bold ? '700 ' : '600 ') + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (outline) {
    ctx.lineWidth = outline;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = outlineColor || '#ffffff';
    ctx.strokeText(txt, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(txt, x, y);
}

function dibujarCerca(x, y, w, h, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineWidth = 5;
  rr(x, y, w, h, 18); ctx.stroke();
  ctx.lineWidth = 4;
  rr(x + 7, y + 7, w - 14, h - 14, 14); ctx.stroke();
  ctx.fillStyle = color;
  const paso = 62;
  for (let px = x; px <= x + w + 1; px += paso) {
    const cx = Math.min(px, x + w);
    ctx.fillRect(cx - 4, y - 9, 8, 24);
    ctx.fillRect(cx - 4, y + h - 15, 8, 24);
  }
  for (let py = y + paso; py < y + h - 10; py += paso) {
    ctx.fillRect(x - 4, py - 10, 8, 24);
    ctx.fillRect(x + w - 4, py - 10, 8, 24);
  }
  ctx.restore();
}

function dibujarZona(f) {
  const z = f.zona;
  const bloqueada = f._fade > 0.001;
  ctx.save();
  ctx.fillStyle = '#8ad168';
  rr(z.x, z.y, z.w, z.h, 18); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.04)';
  for (let y = z.y + 10; y < z.y + z.h; y += 40) {
    ctx.fillRect(z.x + 8, y, z.w - 16, 14);
  }
  if (bloqueada) {
    ctx.globalAlpha = f._fade;
    ctx.fillStyle = '#9aa39c';
    rr(z.x, z.y, z.w, z.h, 18); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    for (let y = z.y + 10; y < z.y + z.h; y += 40) ctx.fillRect(z.x + 8, y, z.w - 16, 14);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  const colorCerca = bloqueada ? mezclaGris('#8a5a2b', f._fade) : '#8a5a2b';
  dibujarCerca(z.x, z.y, z.w, z.h, colorCerca, 1);
  // Rótulo de la zona
  ctx.save();
  ctx.globalAlpha = 0.55;
  texto(z.nombre, z.x + z.w / 2, z.y + 16, 15, '#2f5b28', 'center', true);
  ctx.restore();
  if (bloqueada) {
    ctx.save();
    ctx.globalAlpha = f._fade;
    const cx = z.x + z.w / 2, cy = z.y + z.h / 2;
    ctx.font = '58px system-ui, "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🔒', cx, cy - 16);
    ctx.fillStyle = 'rgba(20,24,20,0.72)';
    rr(cx - 92, cy + 26, 184, 34, 17); ctx.fill();
    texto('Cumple el reto', cx, cy + 43, 16, '#ffffff', 'center', true);
    ctx.restore();
  }
}

function mezclaGris(hex, t) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const gr = 130;
  const m = (c) => Math.round(lerp(c, gr, t));
  return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')';
}

/* ------------------------------- Plantas -------------------------------- */
const FRUIT_OFFSETS = [[-16, -8], [14, -14], [0, 10]];
const VINE_OFFSETS = [[-20, 4], [18, -2], [-2, 16]];

function dibujarPlanta(p) {

function dibujarArbol(p) {
  const c = p.fruit.colores;

  elipse(p.x, p.y + 4, 28, 10); ctx.fill();

  rr(p.x - 7, p.y - 40, 14, 44, 5); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  rr(p.x + 1, p.y - 40, 6, 44, 3); ctx.fill();
  ctx.translate(p.x, p.y - 58);
  ctx.scale(s, s);
  ctx.fillStyle = c.copaOscura;
  circulo(-16, 2, 28); ctx.fill();
  circulo(18, 4, 26); ctx.fill();
  circulo(0, -16, 30); ctx.fill();
  ctx.fillStyle = c.copa;
  circulo(-12, -4, 24); ctx.fill();
  circulo(14, -6, 22); ctx.fill();
  circulo(0, -22, 24); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  circulo(-10, -24, 12); ctx.fill();
  for (let i = 0; i < p.frutas; i++) {
    const o = FRUIT_OFFSETS[i];
    ctx.fillStyle = c.frutaSombra;
    circulo(o[0], o[1] + 2, 8.5); ctx.fill();
    ctx.fillStyle = c.fruta;

    ctx.fillStyle = 'rgba(255,255,255,0.5)';

function dibujarRastrera(p) {
  const c = p.fruit.colores;
  const s = 1 + p.pop * 0.14;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  elipse(0, 6, 42, 18); ctx.fill();
  ctx.fillStyle = '#2f8b3a';
  elipse(0, 0, 40, 20); ctx.fill();
  ctx.fillStyle = '#3fa34d';
  for (let i = 0; i < 6; i++) {
    const a = i * 1.047 + p.seed;
    elipse(Math.cos(a) * 24, Math.sin(a) * 12, 13, 9); ctx.fill();
  }
  ctx.strokeStyle = '#2a7a33'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-26, 2); ctx.quadraticCurveTo(0, -10, 26, 3); ctx.stroke();
  for (let i = 0; i < p.frutas; i++) {
    const o = VINE_OFFSETS[i];
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    elipse(o[0], o[1] + 7, 12, 6); ctx.fill();
    ctx.fillStyle = c.frutaSombra;
    circulo(o[0], o[1], 12); ctx.fill();
    ctx.fillStyle = c.fruta;
    circulo(o[0], o[1] - 1, 11); ctx.fill();
    ctx.strokeStyle = 'rgba(20,80,20,0.75)'; ctx.lineWidth = 2;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(o[0] + k * 5, o[1] - 11);
      ctx.quadraticCurveTo(o[0] + k * 7.5, o[1] - 1, o[0] + k * 5, o[1] + 9);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    elipse(o[0] - 4, o[1] - 6, 3.4, 2.2); ctx.fill();
  }
  ctx.restore();
}

/* --------------------------- Círculos de mejora -------------------------- */
function dibujarCirculo(c) {
  const max = c.max();
  const precio = c.precio();
  const prog = max ? 0 : clamp(state.pagos[c.id] / precio, 0, 1);
  const alcanza = state.dinero >= 1;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  elipse(c.x, c.y + 6, c.r * 0.95, c.r * 0.42); ctx.fill();
  ctx.fillStyle = max ? 'rgba(160,168,160,0.75)' : (c._hover ? 'rgba(255,247,190,0.92)' : 'rgba(255,255,255,0.78)');
  circulo(c.x, c.y, c.r); ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = max ? '#7d857d' : '#3aa14a';
  circulo(c.x, c.y, c.r); ctx.stroke();
  // Anillo de progreso
  if (!max && prog > 0) {
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#ffb01f';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r + 7, -Math.PI / 2, -Math.PI / 2 + prog * 6.2832);
    ctx.stroke();
  }
  ctx.font = '34px system-ui, "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(c.icono, c.x, c.y - 16);
  texto(c.titulo, c.x, c.y + 14, 14, '#264a22', 'center', true);
  if (max) {
    texto('MÁX', c.x, c.y + 36, 17, '#5a625a', 'center', true);
  } else {
    ctx.fillStyle = 'rgba(20,30,20,0.82)';
    rr(c.x - 42, c.y + 26, 84, 24, 12); ctx.fill();
    texto('$' + precio, c.x, c.y + 38, 16, alcanza ? '#ffe27a' : '#ff9a9a', 'center', true);
  }
  ctx.restore();
}

/* -------------------------------- Kiosa ---------------------------------- */
function dibujarPersonaje(e, opts) {
  const camisa = opts.camisa;
  const gorra = opts.gorra;
  const conLogo = opts.logo;
  const paso = Math.sin(e.phase) * (e.moving ? 1 : 0);
  ctx.save();
  ctx.translate(e.x, e.y);
  // sombra
  ctx.fillStyle = 'rgba(0,0,0,0.20)';
  elipse(0, 3, 17, 7); ctx.fill();
  const bob = e.moving ? Math.abs(Math.sin(e.phase)) * 2 : 0;
  ctx.translate(0, -bob);
  // piernas
  ctx.fillStyle = '#3a5fa8';
  rr(-9, -16, 8, 17 + paso * 3, 4); ctx.fill();
  rr(1, -16, 8, 17 - paso * 3, 4); ctx.fill();
  ctx.fillStyle = '#5a3d1e';
  rr(-10, -1 + Math.max(0, paso * 3), 10, 5, 2.5); ctx.fill();
  rr(0, -1 + Math.max(0, -paso * 3), 10, 5, 2.5); ctx.fill();
  // cuerpo
  ctx.fillStyle = camisa;
  rr(-13, -40, 26, 26, 9); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  rr(3, -40, 10, 26, 8); ctx.fill();
  // brazos
  ctx.fillStyle = camisa;
  rr(-19, -38 + paso * 2.5, 7, 18, 3.5); ctx.fill();
  rr(12, -38 - paso * 2.5, 7, 18, 3.5); ctx.fill();
  ctx.fillStyle = '#f2c08a';
  circulo(-15.5, -21 + paso * 2.5, 4); ctx.fill();
  circulo(15.5, -21 - paso * 2.5, 4); ctx.fill();
  // cabeza
  ctx.fillStyle = '#f2c08a';
  circulo(0, -50, 12.5); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  circulo(3, -50, 11); ctx.fill();
  // ojos + sonrisa
  ctx.fillStyle = '#2b2b2b';
  circulo(e.facing * 4.2 - 2.4, -50.5, 1.8); ctx.fill();
  circulo(e.facing * 4.2 + 2.6, -50.5, 1.8); ctx.fill();
  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(e.facing * 3.4, -45.5, 3.6, 0.25, Math.PI - 0.25);
  ctx.stroke();
  // gorra
  ctx.fillStyle = gorra;
  ctx.beginPath();
  ctx.arc(0, -58, 13, Math.PI, 0);
  ctx.lineTo(13, -56); ctx.lineTo(-13, -56);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = gorra;
  rr(e.facing > 0 ? 8 : -22, -59.5, 14, 5, 2.5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath();
  ctx.arc(0, -58, 13, Math.PI, Math.PI * 1.5);
  ctx.lineTo(0, -58); ctx.closePath(); ctx.fill();
  if (conLogo) {
    // logotipo de mango: óvalo naranja + hojita verde
    ctx.save();
    ctx.translate(e.facing * 1.5, -63);
    ctx.fillStyle = '#ff9f1c';
    elipse(0, 1.5, 5.2, 4.1); ctx.fill();
    ctx.fillStyle = '#e07a00';
    elipse(1.4, 2.4, 2.4, 2.0); ctx.fill();
    ctx.fillStyle = '#3fa34d';
    ctx.save();
    ctx.translate(2.2, -2.4); ctx.rotate(-0.6);
    elipse(0, 0, 3.4, 1.7); ctx.fill();
    ctx.restore();
    ctx.restore();
  }
  // pila de frutas sobre la espalda
  const n = e.carga.length;
  if (n > 0) {
    const bx = -e.facing * 7;
    for (let i = 0; i < n; i++) {
      const f = FRUIT_BY_ID[e.carga[i]];
      if (!f) continue;
      const alturaRel = (i + 1) / Math.max(4, n);
      const sway = Math.sin(e.swayT - i * 0.32) * 3.2 * alturaRel * (e.moving ? 1 : 0.35);
      const y = -44 - i * 9.5;
      const r = f.tipoPlanta === 'rastrera' ? 7.5 : 7;
      ctx.fillStyle = f.colores.frutaSombra;
      circulo(bx + sway, y + 1.6, r); ctx.fill();
      ctx.fillStyle = f.colores.fruta;
      circulo(bx + sway, y, r * 0.92); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.42)';
      circulo(bx + sway - 2.2, y - 2.2, r * 0.28); ctx.fill();
    }
  }
  ctx.restore();
}

function dibujarJugador() {
  dibujarPersonaje(player, { camisa: '#3fb0e8', gorra: '#e63946', logo: true });
  if (player.carga.length >= state.capacidad) {
    const yy = player.y - 66 - Math.min(player.carga.length, 12) * 9.5;
    const bob = Math.sin(tiempo * 6) * 2;
    ctx.save();
    ctx.fillStyle = 'rgba(214,40,40,0.92)';
    rr(player.x - 42, yy + bob - 15, 84, 28, 13); ctx.fill();
    texto('¡LLENO!', player.x, yy + bob - 1, 17, '#fff', 'center', true);
    ctx.restore();
  }
}

/* ------------------------------ Partículas ------------------------------- */
function dibujarParticulas() {
  for (const p of confetti) {
    const a = clamp(1 - p.t / p.vida, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
  for (const f of floats) {
    const a = clamp(1 - (f.t - 0.55) / 0.45, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    const s = 1 + Math.max(0, 0.25 - f.t) * 1.2;
    ctx.translate(f.x, f.y);
    ctx.scale(s, s);
    texto(f.txt, 0, 0, 22, '#2ecc55', 'center', true, 5, '#ffffff');
    ctx.restore();
  }
}

/* --------------------------------- Hints --------------------------------- */
function dibujarHint() {
  const h = hintActivo();
  if (!h) return;
  const obj = h.objetivo();
  if (obj) {
    const dx = obj.x - player.x, dy = obj.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d > 40) {
      const ux = dx / d, uy = dy / d;
      const pulso = (Math.sin(tiempo * 4) + 1) * 0.5;
      const dist = 52 + pulso * 12;
      const ax = player.x + ux * dist, ay = player.y - 34 + uy * dist;
      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(Math.atan2(uy, ux));
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = '#ffd166';
      ctx.strokeStyle = '#8a5a10';
      ctx.lineWidth = 3; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(16, 0); ctx.lineTo(-8, -11); ctx.lineTo(-3, 0); ctx.lineTo(-8, 11);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
  ctx.save();
  const y = player.y - 92 - Math.min(player.carga.length, 12) * 9.5;
  ctx.font = '700 17px system-ui, sans-serif';
  const w = ctx.measureText(h.texto).width + 30;
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = 'rgba(20,28,20,0.82)';
  rr(player.x - w / 2, y - 16, w, 32, 15); ctx.fill();
  texto(h.texto, player.x, y + 1, 17, '#ffffff', 'center', true);
  ctx.restore();
}

/* ---------------------------------- HUD ---------------------------------- */
function pill(x, y, w, h, r, alpha) {
  ctx.fillStyle = 'rgba(16,26,18,' + (alpha === undefined ? 0.72 : alpha) + ')';
  rr(x, y, w, h, r); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 2;
  rr(x, y, w, h, r); ctx.stroke();
}

function dibujarHUD() {
  const top = 14;
  const H = 40;
  // Dinero
  const txtDinero = '$' + Math.floor(state.dinero);
  ctx.font = '700 20px system-ui, sans-serif';
  const wD = Math.max(104, ctx.measureText(txtDinero).width + 58);
  pill(12, top, wD, H, 20);
  ctx.font = '20px system-ui, "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('💰', 22, top + H / 2 + 1);
  texto(txtDinero, 50, top + H / 2, 20, '#ffe27a', 'left', true);

  // Carga
  const txtBag = player.carga.length + '/' + state.capacidad;
  ctx.font = '700 20px system-ui, sans-serif';
  const wB = Math.max(96, ctx.measureText(txtBag).width + 56);
  pill(cw - 12 - wB, top, wB, H, 20);
  ctx.font = '20px system-ui, "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('🎒', cw - 12 - wB + 12, top + H / 2 + 1);
  const lleno = player.carga.length >= state.capacidad;
  texto(txtBag, cw - 12 - wB + 40, top + H / 2, 20, lleno ? '#ff8a8a' : '#ffffff', 'left', true);

  // Banner de reto
  const bw = Math.min(cw - 130, 300);
  const bx = (cw - bw) / 2, by = top + H + 10, bh = 52;
  pill(bx, by, bw, bh, 16, 0.78);
  const r = retoActual();
  if (r) {
    const prog = clamp(r.progreso(state) / r.meta, 0, 1);
    texto('🎯 ' + r.texto, bx + bw / 2, by + 16, 15, '#ffffff', 'center', true);
    const barX = bx + 14, barY = by + 30, barW = bw - 28, barH = 14;
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    rr(barX, barY, barW, barH, 7); ctx.fill();
    ctx.fillStyle = '#5ee06a';
    rr(barX, barY, Math.max(6, barW * prog), barH, 7); ctx.fill();
    texto(Math.min(r.progreso(state), r.meta) + ' / ' + r.meta, bx + bw / 2, barY + barH / 2 + 0.5, 11, '#123c16', 'center', true);
  } else {
    texto('🏆 Modo libre', bx + bw / 2, by + 16, 16, '#ffe27a', 'center', true);
    texto('Frutas vendidas: ' + state.ventasTotales, bx + bw / 2, by + 33, 12, 'rgba(255,255,255,0.85)', 'center', true);
  }

  // Botones
  botonHUD(HUD_BTN.mute, state.mute ? '🔇' : '🔊');
  botonHUD(HUD_BTN.reset, '↺');

  // Joystick
  if (joy.activo) {
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, 52, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, 52, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(joy.kx, joy.ky, 24, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  // Mensaje grande
  if (bigMsg) {
    const t = bigMsg.t;
    const a = t < 0.25 ? t / 0.25 : (t > 2.1 ? clamp((2.6 - t) / 0.5, 0, 1) : 1);
    const s = t < 0.35 ? 0.6 + (t / 0.35) * 0.45 : 1 + Math.sin(Math.min(t, 1.4) * 6) * 0.015;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(cw / 2, ch * 0.36);
    ctx.scale(s, s);
    ctx.fillStyle = 'rgba(16,26,18,0.82)';
    ctx.font = '800 34px system-ui, sans-serif';
    const w = ctx.measureText(bigMsg.txt).width + 56;
    rr(-w / 2, -34, w, 68, 20); ctx.fill();
    texto(bigMsg.txt, 0, 0, 34, '#ffe27a', 'center', true, 6, 'rgba(0,0,0,0.35)');
    ctx.restore();
  }
}

function botonHUD(b, icono) {
  pill(b.x, b.y, b.s, b.s, 12, 0.66);
  ctx.font = '19px system-ui, "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(icono, b.x + b.s / 2, b.y + b.s / 2 + 1);
}

/* ------------------------------ Render total ----------------------------- */
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#16241a';
  ctx.fillRect(0, 0, cw, ch);

  ctx.save();
  ctx.scale(view.scale, view.scale);
  let sx = 0, sy = 0;
  if (cam.shake > 0) {
    const m = cam.shake * 14;
    sx = rand(-m, m); sy = rand(-m, m);
  }
  ctx.translate(-cam.x + sx, -cam.y + sy);

  dibujarPasto();
  dibujarCaminos();
  for (const f of FRUITS) dibujarZona(f);
  dibujarVenta();
  for (const c of circles) dibujarCirculo(c);

  // Orden por profundidad
  const drawables = [];
  for (const p of plants) drawables.push({ y: p.y, d: 0, o: p });
  for (const h of helpers) drawables.push({ y: h.y, d: 1, o: h });
  drawables.push({ y: player.y, d: 2, o: player });
  drawables.sort((a, b) => a.y - b.y);
  for (const it of drawables) {
    if (it.d === 0) dibujarPlanta(it.o);
    else if (it.d === 1) dibujarPersonaje(it.o, { camisa: it.o.color, gorra: '#e63946', logo: true });
    else dibujarJugador();
  }

  dibujarParticulas();
  dibujarHint();
  ctx.restore();

  dibujarHUD();
}

/* =============================== 15. LOOP =============================== */
let tiempo = 0;
let last = 0;

function paso(ts) {
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, CONFIG.MAX_DT);
  tiempo += dt;

  const inp = inputVector();
  player.update(dt, inp.x, inp.y);
  for (const p of plants) p.update(dt);
  for (const h of helpers) h.update(dt);
  actualizarCirculos(dt);
  actualizarRetos(true);
  actualizarParticulas(dt);
  actualizarCamara(dt);

  for (const f of FRUITS) {
    if (desbloqueada(f.id) && f._fade > 0) f._fade = Math.max(0, f._fade - dt * 1.4);
  }

  saveTimer += dt;
  if (saveTimer >= CONFIG.SAVE_INTERVAL) { saveTimer = 0; Save.guardar(); }

  render();
  window.requestAnimationFrame(paso);
}

/* ============================== 16. ARRANQUE ============================= */
function iniciar() {
  Save.cargar();
  reconstruirMundo();
  actualizarRetos(false);   // por si el save quedó con retos ya cumplidos
  reconstruirFades();
  resize();
  // Cámara sin salto inicial
  cam.x = view.w >= WORLD_W ? (WORLD_W - view.w) / 2 : clamp(player.x - view.w / 2, 0, WORLD_W - view.w);
  cam.y = view.h >= WORLD_H ? (WORLD_H - view.h) / 2 : clamp(player.y - view.h / 2, 0, WORLD_H - view.h);
  window.requestAnimationFrame(paso);
}

function reconstruirFades() {
  for (const f of FRUITS) f._fade = desbloqueada(f.id) ? 0 : 1;
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') Save.guardar();
});
window.addEventListener('pagehide', () => Save.guardar());
window.addEventListener('pointerdown', () => SFX.resume(), { once: true });

/* ============================ 17. API DE CONSOLA ========================= */
const game = {
  get state() { return state; },
  get player() { return player; },
  get plants() { return plants; },
  get helpers() { return helpers; },
  CONFIG, FRUITS, CHALLENGES, circles,
  dinero(n) {
    const v = Number(n) || 0;
    state.dinero += v;
    if (v > 0) state.dineroTotal += v;
    Save.guardar();
    return Math.floor(state.dinero);
  },
  desbloquear(id) { desbloquearZona(id, true); Save.guardar(); },
  guardar() { Save.guardar(); },
  reiniciar() { Save.borrar(); window.location.reload(); }
};
window.game = game;

iniciar();
</script>
