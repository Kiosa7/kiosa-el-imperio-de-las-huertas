  toast(url, '');
}

/* -------------------- Caja de nombre para el récord ---------------------
   Es un <input> real de HTML superpuesto al modal dibujado en canvas: así
   se abre el teclado nativo del teléfono en vez de tener que dibujar uno.
   JS lo coloca cada frame usando las mismas coordenadas que dibujarModal(),
   que son píxeles CSS relativos al canvas (sin la escala del mundo). */
let mostrarCajaRecord = false;
let recordGuardadoYa = false;

function cajaRecordEl() { return document.getElementById('recordBox'); }

function mostrarRecordBox() {
  mostrarCajaRecord = true;
  recordGuardadoYa = false;
  layoutModal();
  const caja = cajaRecordEl();
  if (!caja) return;
  const input = document.getElementById('recordInput');
  const btn = document.getElementById('recordBtn');
  if (input) { input.value = nombreGuardado(); input.placeholder = t('placeholderNombre'); }
  if (btn) btn.textContent = t('guardarRecord');
  caja.style.display = 'flex';
  sincronizarRecordBox();
  setTimeout(() => { try { input && input.focus(); } catch (e) {} }, 50);
}

function ocultarRecordBox() {
  mostrarCajaRecord = false;
  const caja = cajaRecordEl();
  if (caja) caja.style.display = 'none';
  if (modal.abierto && modal.festejo) layoutModal();
}

function sincronizarRecordBox() {
  if (!mostrarCajaRecord) return;
  const caja = cajaRecordEl();
  if (!caja || !modal.abierto || modal.recordY == null) return;
  const r = canvas.getBoundingClientRect();
  const escala = r.width / cw;               // por si el CSS reescala el canvas
  caja.style.left = (r.left + (modal.x + 16) * escala) + 'px';
  caja.style.top = (r.top + (modal.recordY - 16) * escala) + 'px';
  caja.style.width = ((modal.w - 32) * escala) + 'px';
}

// Guarda lo que haya escrito (o "Jugador" si lo dejó vacío) y avisa el puesto
function guardarRecordDesdeInput() {
  if (recordGuardadoYa) return;
  const input = document.getElementById('recordInput');
  const nombre = input ? input.value : '';
  const r = agregarRecord(nombre, state.tiempoJuego);
  recordGuardadoYa = true;
  if (r.puesto >= 0) toast(t('nuevoRecord', { n: r.puesto + 1 }), formatoTiempo(state.tiempoJuego));
  else toast(t('recordGuardado'), formatoTiempo(state.tiempoJuego));
}

function tocarPanel(p) {
  if (puntoEnRect(panel.cerrar, p.x, p.y)) { panel.abierto = false; return true; }
  const tw = panel.w / 3;
  if (p.y >= panel.tabsY && p.y <= panel.tabsY + panel.tabH && p.x >= panel.x && p.x <= panel.x + panel.w) {
    panel.tab = clamp(Math.floor((p.x - panel.x) / tw), 0, 2);
    panel.scroll = 0;
    return true;
  }
  if (p.x < panel.x || p.x > panel.x + panel.w || p.y < panel.y || p.y > panel.y + panel.h) {
    panel.abierto = false;                   // toque fuera de la tarjeta
    return true;
  }
  return false;
}

canvas.addEventListener('pointerdown', e => {
  SFX.resume();
  const p = posCanvas(e);

  if (intro.activo) {
    if (intro.t > 0.3) {
      if (intro.pagina === 0) {
        if (puntoEnRect(intro.btn, p.x, p.y)) { SFX.pop(); comenzarJuego(); }
        else if (puntoEnRect(intro.btn2, p.x, p.y)) { SFX.pop(); intro.pagina = 1; intro.tp = 0; }
      } else {
        if (puntoEnRect(intro.btn, p.x, p.y)) { SFX.pop(); comenzarJuego(); }
        else if (puntoEnRect(intro.volver, p.x, p.y)) { SFX.pop(); intro.pagina = 0; intro.tp = 0; }
      }
    }
    e.preventDefault();
    return;
  }
  if (modal.abierto) {
    if (puntoEnRect(modal.btnSi, p.x, p.y)) { SFX.pop(); confirmarModal(); }
    else if (modal.no && puntoEnRect(modal.btnNo, p.x, p.y)) {
      SFX.pop();
      if (modal.onNo) modal.onNo(); else cerrarModal();
    }
    else if (p.x < modal.x || p.x > modal.x + modal.w || p.y < modal.y || p.y > modal.y + modal.h) cerrarModal();
    e.preventDefault();
    return;
  }
  if (panel.abierto) {
    if (!tocarPanel(p)) { panel.dragId = e.pointerId; panel.dragY = p.y; panel.movido = false; }
    e.preventDefault();
    return;
  }
  if (puntoEnRect(HUD.btn.mute, p.x, p.y)) {
    state.mute = !state.mute;
    if (!state.mute) SFX.pop();
    Save.guardar(); e.preventDefault(); return;
  }
  if (puntoEnRect(HUD.btn.idioma, p.x, p.y)) { ciclarIdioma(); e.preventDefault(); return; }
  if (puntoEnRect(HUD.btn.share, p.x, p.y)) { compartir(); e.preventDefault(); return; }
  if (puntoEnRect(HUD.btn.reset, p.x, p.y)) {
    abrirModal({
      tit: t('reiniciarTit'), txt: t('reiniciar'),
      si: t('btnSi'), no: t('btnNo'), peligro: true,
      onSi: function () { reiniciando = true; Save.borrar(); window.location.reload(); }
    });
    e.preventDefault(); return;
  }
  // En la tarjeta principal: la flecha pliega, el resto abre el panel
  if (puntoEnRect(HUD.banner, p.x, p.y)) {
    if (p.x > HUD.banner.x + HUD.banner.w - 42 * HUD.k) {
      state.hudExp = !state.hudExp;
      layoutHUD();
      SFX.pop();
      Save.guardar();
    } else { panel.abierto = true; panel.scroll = 0; }
    e.preventDefault(); return;
  }
  if (hudExpandido() && puntoEnRect(HUD.lista, p.x, p.y)) {
    panel.abierto = true; panel.scroll = 0; e.preventDefault(); return;
  }

  if (joy.activo) return;
  joy.activo = true; joy.id = e.pointerId;
  joy.bx = p.x; joy.by = p.y; joy.kx = p.x; joy.ky = p.y;
  joy.dx = 0; joy.dy = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  const p = posCanvas(e);
  if (modal.abierto) {
    modal.hover = puntoEnRect(modal.btnSi, p.x, p.y) ? 'si'
                : (modal.no && puntoEnRect(modal.btnNo, p.x, p.y) ? 'no' : null);
    e.preventDefault();
    return;
  }
  if (panel.abierto) {
    if (panel.dragId === e.pointerId) {
      panel.scroll = clamp(panel.scroll - (p.y - panel.dragY), 0, panel.maxScroll);
      if (Math.abs(p.y - panel.dragY) > 3) panel.movido = true;
      panel.dragY = p.y;
    }
    e.preventDefault();
    return;
  }
  if (!joy.activo || e.pointerId !== joy.id) return;
  let dx = p.x - joy.bx, dy = p.y - joy.by;
  const d = Math.hypot(dx, dy);
  const R = 52;
  if (d > R) { dx = dx / d * R; dy = dy / d * R; }
  joy.kx = joy.bx + dx; joy.ky = joy.by + dy;
  const m = Math.min(1, d / R);
  if (d > 0.001) { joy.dx = (dx / (d > R ? R : Math.max(d, 0.001))) * m; joy.dy = (dy / (d > R ? R : Math.max(d, 0.001))) * m; }
  else { joy.dx = 0; joy.dy = 0; }
  e.preventDefault();
}, { passive: false });

function soltarJoystick(e) {
  if (panel.dragId !== null && (!e || e.pointerId === panel.dragId)) panel.dragId = null;
  if (!joy.activo || (e && e.pointerId !== joy.id)) return;
  joy.activo = false; joy.id = null; joy.dx = 0; joy.dy = 0;
}
canvas.addEventListener('pointerup', soltarJoystick);
canvas.addEventListener('pointercancel', soltarJoystick);
canvas.addEventListener('lostpointercapture', soltarJoystick);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  if (!panel.abierto) return;
  panel.scroll = clamp(panel.scroll + e.deltaY, 0, panel.maxScroll);
  e.preventDefault();
}, { passive: false });

window.addEventListener('keydown', e => {
  if (!e.key) return;
  const k = e.key.toLowerCase();
  keys[k] = true;
  SFX.resume();
  if (intro.activo) {
    if ((k === 'enter' || k === ' ') && intro.t > 0.3) comenzarJuego();
    if (k === 'escape') { intro.pagina = 0; intro.tp = 0; }
    e.preventDefault();
    return;
  }
  if (modal.abierto) {
    if (k === 'escape') cerrarModal();
    if (k === 'enter') confirmarModal();
    e.preventDefault();
    return;
  }
  if (k === 'escape' && panel.abierto) panel.abierto = false;
  if (k === 'tab') { panel.abierto = !panel.abierto; e.preventDefault(); }
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(k) >= 0) e.preventDefault();
}, { passive: false });
window.addEventListener('keyup', e => { if (e.key) keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; soltarJoystick(null); });

function inputVector() {
  if (panel.abierto || modal.abierto || intro.activo) return { x: 0, y: 0 };
  let ix = 0, iy = 0;
  if (keys['a'] || keys['arrowleft']) ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;
  if (keys['w'] || keys['arrowup']) iy -= 1;
  if (keys['s'] || keys['arrowdown']) iy += 1;
  if (ix !== 0 || iy !== 0) {
    const m = Math.hypot(ix, iy);
    return { x: ix / m, y: iy / m };
  }
  if (joy.activo) return { x: joy.dx, y: joy.dy };
  return { x: 0, y: 0 };
}

/* ============================== 15. RENDER ============================== */
function rr(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function circulo(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.closePath(); }
function elipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 6.2832); ctx.closePath(); }

function fuente(size, bold) {
  return (bold ? '700 ' : '600 ') + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
}
function anchoTexto(txt, size, bold) {
  const f = fuente(size, bold);
  const key = f + '|' + txt;
  let w = anchosCache[key];
  if (w === undefined) { ctx.font = f; w = ctx.measureText(txt).width; anchosCache[key] = w; }
  return w;
}
function texto(txt, x, y, size, color, align, bold, outline, outlineColor) {
  ctx.font = fuente(size, bold);
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (outline) {
    ctx.lineWidth = outline; ctx.lineJoin = 'round';
    ctx.strokeStyle = outlineColor || '#ffffff';
    ctx.strokeText(txt, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(txt, x, y);
}
// Recorta con "…" si no cabe
function textoCorto(txt, max, size, bold) {
  if (anchoTexto(txt, size, bold) <= max) return txt;
  let s = txt;
  while (s.length > 2 && anchoTexto(s + '…', size, bold) > max) s = s.slice(0, -1);
  return s + '…';
}
// El color importa: si el sistema no tiene emoji a color, el glifo se pinta
// con fillStyle, y antes heredaba el último color usado (casi siempre oscuro).
function emoji(e, x, y, size, align, color) {
  ctx.font = size + 'px system-ui, "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color || '#ffffff';
  ctx.fillText(e, x, y);
}
function mezclaGris(hex, t) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const m = c => Math.round(lerp(c, 130, t));
  return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')';
}

/* ------------------------------ Zonas ----------------------------------- */
function dibujarCerca(x, y, w, h, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineWidth = 5;
  rr(x, y, w, h, 18); ctx.stroke();
  ctx.lineWidth = 4;
  rr(x + 7, y + 7, w - 14, h - 14, 14); ctx.stroke();
  ctx.fillStyle = color;
  for (let px = x; px <= x + w + 1; px += 62) {
    const cx2 = Math.min(px, x + w);
    ctx.fillRect(cx2 - 4, y - 9, 8, 24);
    ctx.fillRect(cx2 - 4, y + h - 15, 8, 24);
  }
  for (let py = y + 62; py < y + h - 10; py += 62) {
    ctx.fillRect(x - 4, py - 10, 8, 24);
    ctx.fillRect(x + w - 4, py - 10, 8, 24);
  }
  ctx.restore();
}

function dibujarZona(f) {
  const z = f.zona;
  const bloqueada = f._fade > 0.001;
  if (bloqueada) {
    ctx.save();
    ctx.globalAlpha = f._fade * 0.86;
    ctx.fillStyle = '#9aa89a';
    rr(z.x, z.y, z.w, z.h, 18); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    for (let y = z.y + 10; y < z.y + z.h; y += 40) ctx.fillRect(z.x + 8, y, z.w - 16, 14);
    ctx.restore();
  }
  dibujarCerca(z.x, z.y, z.w, z.h, bloqueada ? mezclaGris('#8a5a2b', f._fade) : '#8a5a2b');
  ctx.save();
  ctx.globalAlpha = 0.55;
  texto(t(z.key), z.x + z.w / 2, z.y + 16, 15, '#2f5b28', 'center', true);
  ctx.restore();
}

/* ------------------------------- Plantas -------------------------------- */
const FRUIT_OFFSETS = [[-16, -8], [14, -14], [0, 10]];
const VINE_OFFSETS = [[-20, 4], [18, -2], [-2, 16]];

function dibujarPlanta(p) {
  if (p.fruit.tipoPlanta === 'rastrera') dibujarRastrera(p);
  else dibujarArbol(p);
  if (p.marchita > 0) {
    ctx.save();
    ctx.globalAlpha = 0.62;
    emoji('🥀', p.x + 26, p.y - (p.fruit.tipoPlanta === 'rastrera' ? 26 : 60), 20);
    ctx.restore();
  }
}

// Cupo vacío (árbol muerto o nunca comprado): un tocón que invita a replantar
function dibujarTocon(o) {
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  elipse(o.x, o.y + 4, 22, 9); ctx.fill();
  ctx.fillStyle = '#7a5a35';
  elipse(o.x, o.y - 2, 13, 8); ctx.fill();
  ctx.fillStyle = '#5c4226';
  circulo(o.x, o.y - 4, 6); ctx.fill();
  ctx.globalAlpha = 0.45 + 0.25 * Math.sin(tiempo * 2 + o.x);
  emoji('➕', o.x, o.y - 26, 16);
  ctx.restore();
}

// Anillo de progreso mientras curas una planta marchita
function dibujarCura() {
  const p = player.curando;
  if (!p || player.curaT <= 0) return;
  const pr = clamp(player.curaT / CONFIG.CURA_TIEMPO, 0, 1);
  ctx.save();
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.30)';
  ctx.beginPath(); ctx.arc(p.x, p.y - 18, 34, 0, 6.2832); ctx.stroke();
  ctx.strokeStyle = '#7dffa0';
  ctx.beginPath(); ctx.arc(p.x, p.y - 18, 34, -Math.PI / 2, -Math.PI / 2 + pr * 6.2832); ctx.stroke();
  ctx.restore();
}

function dibujarArbol(p) {
  const c = p.fruit.colores;
  const marchita = p.marchita > 0;
  const g = marchita ? clamp(p.marchita / CONFIG.PLAGA_MARCHITA, 0, 1) * 0.75 : 0;
  const copa = marchita ? mezclaGris(c.copa, g) : c.copa;
  const copaO = marchita ? mezclaGris(c.copaOscura, g) : c.copaOscura;
  const s = 1 + p.pop * 0.20;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  elipse(p.x, p.y + 4, 28, 10); ctx.fill();
  ctx.fillStyle = marchita ? mezclaGris(c.tronco, g) : c.tronco;
  rr(p.x - 7, p.y - 40, 14, 44, 5); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  rr(p.x + 1, p.y - 40, 6, 44, 3); ctx.fill();
  ctx.translate(p.x, p.y - 58);
  if (marchita) ctx.rotate(Math.sin(tiempo * 1.4 + p.seed) * 0.05 - 0.06);
  ctx.scale(s, marchita ? s * 0.86 : s);
  ctx.fillStyle = copaO;
  circulo(-16, 2, 28); ctx.fill();
  circulo(18, 4, 26); ctx.fill();
  circulo(0, -16, 30); ctx.fill();
  ctx.fillStyle = copa;
  circulo(-12, -4, 24); ctx.fill();
  circulo(14, -6, 22); ctx.fill();
  circulo(0, -22, 24); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  circulo(-10, -24, 12); ctx.fill();
  for (let i = 0; i < p.frutas; i++) {
    const o = FRUIT_OFFSETS[i];
    ctx.fillStyle = c.frutaSombra;
    circulo(o[0], o[1] + 2, 8.5); ctx.fill();
    ctx.fillStyle = c.fruta;
    circulo(o[0], o[1], 8); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    circulo(o[0] - 2.6, o[1] - 2.6, 2.4); ctx.fill();
  }
  ctx.restore();
}

function dibujarRastrera(p) {
  const c = p.fruit.colores;
  const marchita = p.marchita > 0;
  const g = marchita ? clamp(p.marchita / CONFIG.PLAGA_MARCHITA, 0, 1) * 0.75 : 0;
  const s = 1 + p.pop * 0.14;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  elipse(0, 6, 42, 18); ctx.fill();
  ctx.fillStyle = marchita ? mezclaGris('#2f8b3a', g) : '#2f8b3a';
  elipse(0, 0, 40, 20); ctx.fill();
  ctx.fillStyle = marchita ? mezclaGris('#3fa34d', g) : '#3fa34d';
  for (let i = 0; i < 6; i++) {
    const a = i * 1.047 + p.seed;
    elipse(Math.cos(a) * 24, Math.sin(a) * 12, 13, 9); ctx.fill();
  }
  ctx.strokeStyle = '#2a7a33'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-26, 2); ctx.quadraticCurveTo(0, -10, 26, 3); ctx.stroke();
  for (let i = 0; i < p.frutas; i++) {
    const o = VINE_OFFSETS[i];
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    elipse(o[0], o[1] + 7, 12, 6); ctx.fill();
    ctx.fillStyle = c.frutaSombra;
    circulo(o[0], o[1], 12); ctx.fill();
    ctx.fillStyle = c.fruta;
    circulo(o[0], o[1] - 1, 11); ctx.fill();
    if (p.fruit.id === 'pina') {
      ctx.strokeStyle = 'rgba(120,80,10,0.55)'; ctx.lineWidth = 1.4;
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath(); ctx.moveTo(o[0] - 8, o[1] - 1 + k * 4); ctx.lineTo(o[0] + 8, o[1] - 5 + k * 4); ctx.stroke();
      }
      ctx.fillStyle = '#3fa34d';
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(o[0] + k * 4, o[1] - 10);
        ctx.lineTo(o[0] + k * 6, o[1] - 22);
        ctx.lineTo(o[0] + k * 4 + 4, o[1] - 10);
        ctx.closePath(); ctx.fill();
      }
    } else {
      ctx.strokeStyle = 'rgba(20,80,20,0.75)'; ctx.lineWidth = 2;
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(o[0] + k * 5, o[1] - 11);
        ctx.quadraticCurveTo(o[0] + k * 7.5, o[1] - 1, o[0] + k * 5, o[1] + 9);
        ctx.stroke();
      }
    }
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    elipse(o[0] - 4, o[1] - 6, 3.4, 2.2); ctx.fill();
  }
  ctx.restore();
}

/* ------------------------- Mostrador y mejoras --------------------------- */
/* El puesto crece con la mejora: cada nivel le suma algo visible, para que
   se note en qué te gastaste el dinero. */
function dibujarEstructuraPuesto() {
  const n = nivelPuesto();
  const cx2 = COUNTER.x + COUNTER.w / 2;
  const ext = n * 9;                                  // se ensancha al mejorar
  const x0 = COUNTER.x - ext, w = COUNTER.w + ext * 2;

  // Toldo desde el nivel 2
  if (n >= 2) {
    const ty = COUNTER.y - 84;
    ctx.fillStyle = '#8a5a2b';
    ctx.fillRect(x0 + 6, ty + 10, 9, COUNTER.y - ty - 6);
    ctx.fillRect(x0 + w - 15, ty + 10, 9, COUNTER.y - ty - 6);
    const franjas = 7;
    for (let i = 0; i < franjas; i++) {
      ctx.fillStyle = i % 2 ? '#f6f1e2' : (n >= 5 ? '#c9412f' : '#d9573f');
      const fw = w / franjas;
      ctx.beginPath();
      ctx.moveTo(x0 + i * fw, ty);
      ctx.lineTo(x0 + (i + 1) * fw, ty);
      ctx.lineTo(x0 + (i + 1) * fw, ty + 24);
      ctx.quadraticCurveTo(x0 + (i + 0.5) * fw, ty + 34, x0 + i * fw, ty + 24);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    rr(x0, ty - 5, w, 8, 4); ctx.fill();
  } else if (n >= 1) {
    // Nivel 1: solo los postes y una viga
    ctx.fillStyle = '#8a5a2b';
    ctx.fillRect(x0 + 6, COUNTER.y - 64, 9, 66);
    ctx.fillRect(x0 + w - 15, COUNTER.y - 64, 9, 66);
    rr(x0 + 2, COUNTER.y - 70, w - 4, 10, 4); ctx.fill();
  }

  // Cajas de fruta a los lados desde el nivel 3
  if (n >= 3) {
    for (const lado of [-1, 1]) {
      const bx = cx2 + lado * (w / 2 + 16) - 14;
      ctx.fillStyle = '#9a6a34'; rr(bx, COUNTER.y + 26, 28, 24, 4); ctx.fill();
      ctx.fillStyle = '#b98446'; rr(bx + 3, COUNTER.y + 29, 22, 8, 2); ctx.fill();
      const f = FRUITS[lado > 0 ? 1 : 0];
      ctx.fillStyle = f.colores.fruta;
      circulo(bx + 9, COUNTER.y + 24, 6); ctx.fill();
      circulo(bx + 20, COUNTER.y + 25, 6); ctx.fill();
    }
  }

  // Sombra y cuerpo del mostrador
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  rr(x0 + 6, COUNTER.y + COUNTER.h - 6, w, 16, 8); ctx.fill();
  ctx.fillStyle = n >= 4 ? '#96612a' : '#a9702f';
  rr(x0, COUNTER.y, w, COUNTER.h, 10); ctx.fill();
  ctx.fillStyle = n >= 4 ? '#d09a4c' : '#c78a41';
  rr(x0 + 6, COUNTER.y + 6, w - 12, COUNTER.h - 20, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(90,55,20,0.45)'; ctx.lineWidth = 2;
  for (let i = 1; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(x0 + i * (w / 5), COUNTER.y + 8);
    ctx.lineTo(x0 + i * (w / 5), COUNTER.y + COUNTER.h - 14);
    ctx.stroke();
  }

  // Banderines desde el nivel 3
  if (n >= 3) {
    const by = COUNTER.y - (n >= 2 ? 48 : 26);
    const nb = 9;
    for (let i = 0; i < nb; i++) {
      const bx = x0 + 10 + i * ((w - 20) / (nb - 1));
      const cae = Math.sin(i * 0.9) * 3;
      ctx.fillStyle = ['#ffd166', '#5ee06a', '#7ec8ff', '#ff8a8a'][i % 4];
      ctx.beginPath();
      ctx.moveTo(bx - 6, by + cae); ctx.lineTo(bx + 6, by + cae); ctx.lineTo(bx, by + cae + 13);
      ctx.closePath(); ctx.fill();
    }
  }

  // Filo dorado y macetas en el nivel 5
  if (n >= 5) {
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3;
    rr(x0 + 3, COUNTER.y + 3, w - 6, COUNTER.h - 6, 9); ctx.stroke();
    for (const lado of [-1, 1]) {
      const px = cx2 + lado * (w / 2 - 6);
      ctx.fillStyle = '#b5643c'; rr(px - 11, COUNTER.y - 16, 22, 16, 4); ctx.fill();
      ctx.fillStyle = '#3fa34d'; circulo(px - 5, COUNTER.y - 20, 6); ctx.fill();
      circulo(px + 5, COUNTER.y - 19, 5); ctx.fill();
      ctx.fillStyle = '#ff8ac0'; circulo(px - 6, COUNTER.y - 24, 3); ctx.fill();
      ctx.fillStyle = '#ffd166'; circulo(px + 6, COUNTER.y - 23, 3); ctx.fill();
    }
  }
}

function dibujarVenta() {
  const activo = enVenta(player.x, player.y);
  const pulso = 0.5 + 0.5 * Math.sin(tiempo * 3.2);
  ctx.save();
  ctx.fillStyle = activo ? 'rgba(255,236,140,0.55)' : 'rgba(255,255,255,0.20)';
  rr(SELL.x, SELL.y, SELL.w, SELL.h, 22); ctx.fill();
  ctx.setLineDash([12, 9]); ctx.lineWidth = 4;
  ctx.strokeStyle = activo ? '#ffd54a' : 'rgba(255,255,255,0.75)';
  rr(SELL.x, SELL.y, SELL.w, SELL.h, 22); ctx.stroke();
  ctx.setLineDash([]);
  // La etiqueta va en el suelo, donde te paras: el espacio de encima del
  // mostrador queda libre para que se formen los clientes.
  ctx.globalAlpha = 0.92;
  texto(t('vender'), SELL.cx, SELL.cy + 8, 30, activo ? '#2f7d3a' : 'rgba(255,255,255,0.92)',
        'center', true, 5, 'rgba(0,0,0,0.2)');
  ctx.globalAlpha = 1;
  dibujarEstructuraPuesto();
  // Bandejas: una franja por fruta desbloqueada, cada una con SU cupo propio.
  // Ninguna fruta puede ocupar el hueco de otra, así que una bandeja vacía
  // se ve vacía aunque el resto del puesto esté lleno.
  const ext = nivelPuesto() * 9;
  const x0 = COUNTER.x - ext, wTotal = COUNTER.w + ext * 2;
  const frutasPuesto = state.desbloqueadas;
  const nF = frutasPuesto.length;
  if (nF > 0) {
    const wCol = wTotal / nF;
    for (let c = 0; c < nF; c++) {
      const id = frutasPuesto[c];
      const f = FRUIT_BY_ID[id];
      if (!f) continue;
      const cap = trayCap(id), cnt = trayCount(id);
      const cx0 = x0 + c * wCol;
      if (c > 0) {
        ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(cx0, COUNTER.y + 6); ctx.lineTo(cx0, COUNTER.y + COUNTER.h - 4); ctx.stroke();
      }
      if (cnt === 0 && clientesActivos()) {          // bandeja vacía: aviso propio
        ctx.save();
        ctx.globalAlpha = 0.35 + 0.25 * pulso;
        ctx.fillStyle = 'rgba(200,50,50,0.5)';
        rr(cx0 + 2, COUNTER.y + 4, wCol - 4, COUNTER.h - 10, 5); ctx.fill();
        ctx.restore();
      }
      const porFila = Math.max(1, Math.floor((wCol - 6) / 15));
      const visibles = Math.min(cnt, porFila * 3);
      for (let i = 0; i < visibles; i++) {
        const fila = (i / porFila) | 0, col = i % porFila;
        const filas = Math.min(3, Math.ceil(cap / porFila)) || 1;
        const fx = cx0 + wCol / 2 - (Math.min(porFila, cap) - 1) * 7.5 + col * 15;
        const fy = COUNTER.y + 16 + fila * 16 - (filas - 1) * 6;
        ctx.fillStyle = 'rgba(0,0,0,0.18)'; elipse(fx, fy + 8, 7, 3); ctx.fill();
        ctx.fillStyle = f.colores.frutaSombra; circulo(fx, fy + 1.5, 7); ctx.fill();
        ctx.fillStyle = f.colores.fruta; circulo(fx, fy, 6.3); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.45)'; circulo(fx - 2, fy - 2, 1.9); ctx.fill();
      }
      // conteo pequeño bajo la bandeja, solo si el puesto ya tiene banderines (nivel 3+)
      if (nivelPuesto() >= 1) {
        texto(cnt + '/' + cap, cx0 + wCol / 2, COUNTER.y + COUNTER.h + 9, 9,
              cnt === 0 ? '#ff8a8a' : 'rgba(255,255,255,0.75)', 'center', true, 2.5, 'rgba(0,0,0,0.5)');
      }
    }
  }
  // Aviso de puesto vacío del todo: es la señal de que vas a perder cualquier cliente
  const n = estanteTotal();
  if (n === 0 && clientesActivos()) {
    const txt = t('puestoVacio');
    const w = anchoTexto(txt, 15, true) + 30;
    const yy = COUNTER.y + COUNTER.h + 20;
    ctx.save();
    ctx.globalAlpha = 0.72 + 0.28 * pulso;
    ctx.fillStyle = 'rgba(190,40,40,0.9)';
    rr(SELL.cx - w / 2, yy - 14, w, 28, 13); ctx.fill();
    texto(txt, SELL.cx, yy, 15, '#ffffff', 'center', true);
    ctx.restore();
    SIGNOS.push({ x: SELL.cx - w / 2, y: yy - 14, w: w, h: 28 });
  }

  if (activo) {
    ctx.globalAlpha = 0.25 + 0.25 * pulso;
    ctx.fillStyle = '#fff7c2';
    rr(SELL.x - 4, SELL.y - 4, SELL.w + 8, SELL.h + 8, 24); ctx.fill();
  }
  ctx.restore();
}

function dibujarCirculo(c) {
  const max = c.max();
  const precio = c.precio();
  const prog = max ? 0 : clamp(state.pagos[c.id] / precio, 0, 1);
  const alcanza = state.dinero >= 1;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  elipse(c.x, c.y + 6, c.r * 0.95, c.r * 0.42); ctx.fill();
  ctx.fillStyle = max ? 'rgba(160,168,160,0.75)' : (c._hover ? 'rgba(255,247,190,0.92)' : 'rgba(255,255,255,0.78)');
  circulo(c.x, c.y, c.r); ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = max ? '#7d857d' : '#3aa14a';
  circulo(c.x, c.y, c.r); ctx.stroke();
  if (!max && prog > 0) {
    ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.strokeStyle = '#ffb01f';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r + 7, -Math.PI / 2, -Math.PI / 2 + prog * 6.2832);
    ctx.stroke();
  }
  emoji(c.icono, c.x, c.y - 18, 30);
  texto(textoCorto(t(c.k), c.r * 2 - 6, 12, true), c.x, c.y + 12, 12, '#264a22', 'center', true);
  if (max) texto(t('max'), c.x, c.y + 32, 16, '#5a625a', 'center', true);
  else {
    ctx.fillStyle = 'rgba(20,30,20,0.82)';
    rr(c.x - 40, c.y + 22, 80, 23, 11); ctx.fill();
    texto('$' + precio, c.x, c.y + 34, 15, alcanza ? '#ffe27a' : '#ff9a9a', 'center', true);
  }
  ctx.restore();
  SIGNOS.push({ x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 + 26 });
}

function dibujarEspantapajaros(e) {
  const sw = Math.sin(tiempo * 1.6 + e.phase) * 0.06;
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  elipse(0, 2, 14, 5); ctx.fill();
  ctx.rotate(sw);
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(-3, -46, 6, 46);
  ctx.fillRect(-20, -34, 40, 5);
  ctx.fillStyle = '#e2683f';
  rr(-13, -40, 26, 22, 6); ctx.fill();
  ctx.fillStyle = '#f2d7a0';
  circulo(0, -50, 10); ctx.fill();
  ctx.fillStyle = '#2b2b2b';
  circulo(-3.5, -51, 1.6); ctx.fill();
  circulo(3.5, -51, 1.6); ctx.fill();
  ctx.fillStyle = '#c9a227';
  ctx.beginPath();
  ctx.moveTo(-15, -57); ctx.lineTo(15, -57); ctx.lineTo(9, -63); ctx.lineTo(-9, -63);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(-16, -58, 32, 4);
  ctx.restore();
}

/* ------------------- Baches, fruta caída y ladrones ---------------------- */
// Refugio alrededor del puesto: los ladrones no entran ahí
function dibujarZonaSegura() {
  const r = CONFIG.ZONA_SEGURA_R;
  const pulso = 0.5 + 0.5 * Math.sin(tiempo * 1.6);
  const hayLadron = mapaches.some(m => m.estado !== 'huyendo');
  ctx.save();
  ctx.fillStyle = 'rgba(120,220,150,' + (0.05 + (hayLadron ? 0.05 * pulso : 0)).toFixed(3) + ')';
  circulo(SELL.cx, SELL.cy, r); ctx.fill();
  ctx.setLineDash([14, 12]);
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(150,240,175,' + (hayLadron ? 0.45 + 0.3 * pulso : 0.28).toFixed(3) + ')';
  ctx.beginPath();
  ctx.arc(SELL.cx, SELL.cy, r, 0, 6.2832);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = hayLadron ? 0.7 + 0.3 * pulso : 0.4;
  emoji('🛡️', SELL.cx, SELL.cy - r + 2, 20);
  ctx.restore();
}

function dibujarBaches() {
  for (const b of baches) {
    if (b.a <= 0.01) continue;
    const r = CONFIG.BACHE_RADIO * (0.55 + 0.45 * b.a);
    ctx.save();
    ctx.globalAlpha = b.a;
    ctx.fillStyle = 'rgba(120,88,48,0.55)';
    elipse(b.x, b.y + 3, r + 3, (r + 3) / 1.5); ctx.fill();
    ctx.fillStyle = '#6b4b23';
    elipse(b.x, b.y, r, r / 1.5); ctx.fill();
    ctx.fillStyle = '#4a3216';
    elipse(b.x, b.y + 1.5, r * 0.78, r / 1.5 * 0.72); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    elipse(b.x - r * 0.25, b.y - r * 0.22, r * 0.32, r * 0.16); ctx.fill();
    ctx.restore();
  }
}

function dibujarSuelo() {
  for (const f of sueloFrutas) {
    const fr = FRUIT_BY_ID[f.id];
    if (!fr) continue;
    const s = 1 + f.pop * 0.35;
    const parpadeo = f.t > CONFIG.FRUTA_SUELO_VIDA - 3 ? (Math.sin(f.t * 14) > 0 ? 0.35 : 1) : 1;
    ctx.save();
    ctx.globalAlpha = parpadeo;
    ctx.translate(f.x, f.y);
    ctx.scale(s, s);
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    elipse(0, 7, 10, 4); ctx.fill();
    ctx.fillStyle = fr.colores.frutaSombra; circulo(0, 0, 8.5); ctx.fill();
    ctx.fillStyle = fr.colores.fruta; circulo(0, -1.4, 7.6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; circulo(-2.4, -3.6, 2.3); ctx.fill();
    ctx.restore();
  }
}

function dibujarMapache(m) {
  const T = m.tipo || LADRONES[0];
  const paso = Math.sin(m.phase) * (m.estado === 'huyendo' ? 1 : 0.8);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  elipse(m.x, m.y + 4, 20 * T.tam, 7 * T.tam); ctx.fill();
  ctx.translate(m.x, m.y);
  ctx.scale(m.facing * T.tam, T.tam);
  // Cola distinta según el animal
  ctx.save();
  ctx.rotate(Math.sin(m.phase * 0.6) * 0.18);
  if (T.cola === 'anillada') {
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = i % 2 ? T.cuerpo : T.osc;
      circulo(-20 - i * 7, -8 - i * 3, 7 - i * 0.6); ctx.fill();
    }
  } else if (T.cola === 'esponjada') {
    ctx.fillStyle = T.cuerpo;
    for (let i = 0; i < 5; i++) circulo(-18 - i * 4, -12 - i * 6, 9 - i * 0.8);
    ctx.fill();
    ctx.fillStyle = T.cara;
    circulo(-26, -30, 7); ctx.fill();
  } else {
    ctx.strokeStyle = '#e0a9a9'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-16, -6);
    ctx.quadraticCurveTo(-34, -12, -38, -26);
    ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = T.cuerpo;
  elipse(0, -8, 17, 11); ctx.fill();
  ctx.fillStyle = T.osc;
  rr(-9, -2 + Math.max(0, paso * 3), 6, 8, 3); ctx.fill();
  rr(4, -2 + Math.max(0, -paso * 3), 6, 8, 3); ctx.fill();
  ctx.fillStyle = T.cara;
  circulo(14, -14, 10); ctx.fill();
  ctx.fillStyle = T.osc;
  circulo(9, -22, 4); ctx.fill();
  circulo(19, -22, 4); ctx.fill();
  // antifaz solo el mapache
  if (T.id === 'mapache') { ctx.fillStyle = T.osc; rr(8, -17, 14, 6, 3); ctx.fill(); }
  ctx.fillStyle = '#ffffff';
  circulo(12, -14.5, 2); ctx.fill();
  circulo(19, -14.5, 2); ctx.fill();
  ctx.fillStyle = '#1b1b1b';
  circulo(12.6, -14.5, 1.1); ctx.fill();
  circulo(19.6, -14.5, 1.1); ctx.fill();
  ctx.fillStyle = T.osc;
  circulo(24, -12, 2.4); ctx.fill();
  ctx.restore();
  // lo que lleva robado
  for (let i = 0; i < m.carga.length && i < 4; i++) {
    const fr = FRUIT_BY_ID[m.carga[i]];
    if (!fr) continue;
    ctx.fillStyle = fr.colores.fruta;
    circulo(m.x - m.facing * 6, m.y - 24 - i * 8, 5.5); ctx.fill();
  }
  if (m.emo && m.emoT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(m.emoT / 0.6, 0, 1);
    emoji(m.emo, m.x, m.y - 40, 20);
    ctx.restore();
  }
}

/* ------------------------------ Compradores ------------------------------ */
function dibujarCliente(c) {
  dibujarPersonaje(c, { camisa: c.color, gorra: '#6b5236' });
  if (c.estado === 'esperando') {
    const pr = clamp(c.paciencia / CONFIG.CLIENTE_PACIENCIA, 0, 1);
    const by = c.y - 80;
    const f = FRUIT_BY_ID[c.fruta];
    const hay = hayEnEstante(c.fruta);
    ctx.save();
    ctx.fillStyle = 'rgba(20,28,20,0.82)';
    circulo(c.x, by, 21); ctx.fill();
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.arc(c.x, by, 21, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = pr > 0.4 ? '#5ee06a' : (pr > 0.18 ? '#ffd166' : '#ff6b6b');
    ctx.beginPath(); ctx.arc(c.x, by, 21, -Math.PI / 2, -Math.PI / 2 + pr * 6.2832); ctx.stroke();
    // la fruta que pide, para que sepas qué surtir
    if (f) {
      ctx.fillStyle = f.colores.frutaSombra; circulo(c.x - 4, by - 1, 9); ctx.fill();
      ctx.fillStyle = f.colores.fruta; circulo(c.x - 4, by - 2.5, 8); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; circulo(c.x - 6.4, by - 5, 2.4); ctx.fill();
    }
    texto('×' + (c.quiere - c.compradas), c.x + 10, by + 6, 12,
          hay ? '#ffffff' : '#ff9a9a', 'center', true);
    ctx.restore();
  }
  if (c.emo && c.emoT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(c.emoT / 0.7, 0, 1);
    emoji(c.emo, c.x, c.y - 80, 26);
    ctx.restore();
  }
}

/* -------------------------------- Plagas --------------------------------- */
function dibujarPlaga(p) {
  const flap = Math.sin(p.ala) * (p.estado === 'comiendo' ? 0.25 : 1);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  elipse(p.x, p.y + 34, 12, 5); ctx.fill();
  ctx.translate(p.x, p.y);
  ctx.scale(p.facing, 1);
  ctx.fillStyle = '#4a4a55';
  elipse(0, 0, 14, 10); ctx.fill();
  ctx.fillStyle = '#3a3a44';
  ctx.save();
  ctx.rotate(flap * 0.6);
  elipse(-2, -6, 11, 5); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#5b5b68';
  ctx.beginPath();
  ctx.moveTo(-12, 0); ctx.lineTo(-24, -6 + flap * 3); ctx.lineTo(-13, 5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#4a4a55';
  circulo(11, -6, 7); ctx.fill();
  ctx.fillStyle = '#ffb01f';
  ctx.beginPath();
  ctx.moveTo(17, -6); ctx.lineTo(25, -4); ctx.lineTo(17, -2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffffff';
  circulo(13, -8, 2.4); ctx.fill();
  ctx.fillStyle = '#1b1b1b';
  circulo(13.6, -8, 1.3); ctx.fill();
  ctx.restore();
  if (p.estado === 'comiendo') {
    const bob = Math.abs(Math.sin(tiempo * 5)) * 4;
    ctx.save();
    ctx.fillStyle = 'rgba(220,50,50,0.92)';
    circulo(p.x + 20, p.y - 26 - bob, 12); ctx.fill();
    texto('!', p.x + 20, p.y - 26 - bob, 20, '#ffffff', 'center', true);
    ctx.restore();
  }
}

/* -------------------------------- Kiosa ---------------------------------- */
function dibujarPersonaje(e, opts) {
  const camisa = opts.camisa, gorra = opts.gorra;
  const paso = Math.sin(e.phase) * (e.moving ? 1 : 0);
  ctx.save();
  ctx.translate(e.x, e.y);
  const bob = e.moving ? Math.abs(Math.sin(e.phase)) * 3 : 0;
  // La sombra se encoge cuando el cuerpo sube: da peso y quita la sensación de flotar
  const enc = 1 - bob * 0.055;
  ctx.fillStyle = 'rgba(0,0,0,' + (0.22 - bob * 0.02).toFixed(3) + ')';
  elipse(0, 3, 17 * enc, 7 * enc); ctx.fill();
  ctx.translate(0, -bob);
  if (e.inclina) ctx.rotate(e.inclina);
  ctx.fillStyle = '#3a5fa8';
  rr(-9, -16, 8, 17 + paso * 3, 4); ctx.fill();
  rr(1, -16, 8, 17 - paso * 3, 4); ctx.fill();
  ctx.fillStyle = '#5a3d1e';
  rr(-10, -1 + Math.max(0, paso * 3), 10, 5, 2.5); ctx.fill();
  rr(0, -1 + Math.max(0, -paso * 3), 10, 5, 2.5); ctx.fill();
  ctx.fillStyle = camisa;
  rr(-13, -40, 26, 26, 9); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  rr(3, -40, 10, 26, 8); ctx.fill();
  ctx.fillStyle = camisa;
  rr(-19, -38 + paso * 2.5, 7, 18, 3.5); ctx.fill();
  rr(12, -38 - paso * 2.5, 7, 18, 3.5); ctx.fill();
  ctx.fillStyle = '#f2c08a';
  circulo(-15.5, -21 + paso * 2.5, 4); ctx.fill();
  circulo(15.5, -21 - paso * 2.5, 4); ctx.fill();
  // Sin rostro: solo el volumen de la cabeza, para que nadie se lea como
  // "personaje con nombre" y todo el reconocimiento venga de la silueta.
  ctx.fillStyle = '#f2c08a';
  circulo(0, -50, 12.5); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  circulo(3, -50, 11); ctx.fill();
  ctx.fillStyle = gorra;
  ctx.beginPath();
  ctx.arc(0, -58, 13, Math.PI, 0);
  ctx.lineTo(13, -56); ctx.lineTo(-13, -56);
  ctx.closePath(); ctx.fill();
  // La visera va del lado contrario a hacia dónde camina cuando la gorra
  // está al revés (solo Kiosa); de frente, apunta con la marcha como siempre.
  const viseraDer = opts.atras ? e.facing < 0 : e.facing > 0;
  rr(viseraDer ? 8 : -22, -59.5, 14, 5, 2.5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath();
  ctx.arc(0, -58, 13, Math.PI, Math.PI * 1.5);
  ctx.lineTo(0, -58); ctx.closePath(); ctx.fill();
  // La pila se corta a PILA_VISIBLE: antes crecía sin tope y a mochila llena
  // atravesaba el HUD y se salía de la pantalla. El total sigue en la píldora 🎒.
  const n = Math.min(e.carga.length, CONFIG.PILA_VISIBLE);
  if (n > 0) {
    const desde = e.carga.length - n;
    const bx = -e.facing * 7;
    for (let i = 0; i < n; i++) {
      const f = FRUIT_BY_ID[e.carga[desde + i]];
      if (!f) continue;
      const alturaRel = (i + 1) / Math.max(4, n);
      const sway = Math.sin(e.swayT - i * 0.32) * 3.2 * alturaRel * (e.moving ? 1 : 0.35);
      const y = -44 - i * CONFIG.PILA_PASO;
      const r = f.tipoPlanta === 'rastrera' ? 7.5 : 7;
      ctx.fillStyle = f.colores.frutaSombra;
      circulo(bx + sway, y + 1.6, r); ctx.fill();
      ctx.fillStyle = f.colores.fruta;
      circulo(bx + sway, y, r * 0.92); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.42)';
      circulo(bx + sway - 2.2, y - 2.2, r * 0.28); ctx.fill();
    }
  }
  ctx.restore();
}

function alturaPila(n) { return Math.min(n, CONFIG.PILA_VISIBLE) * CONFIG.PILA_PASO; }

function dibujarJugador() {
  dibujarPersonaje(player, { camisa: '#3fb0e8', gorra: '#e63946', atras: true });
  if (player.carga.length >= state.capacidad) {
    let yy = player.y - 66 - alturaPila(player.carga.length);
    // si quedaría bajo el HUD, se pone a los pies en vez de encimarse
    if ((yy - 15 - cam.y) * view.scale < HUD.lista.y + HUD.lista.h + 12) yy = player.y + 46;
    const bob = Math.sin(tiempo * 6) * 2;
    const txt = t('lleno');
    const w = anchoTexto(txt, 17, true) + 30;
    ctx.save();
    ctx.fillStyle = 'rgba(214,40,40,0.92)';
    rr(player.x - w / 2, yy + bob - 15, w, 28, 13); ctx.fill();
    texto(txt, player.x, yy + bob - 1, 17, '#fff', 'center', true);
    ctx.restore();
    SIGNOS.push({ x: player.x - w / 2, y: yy + bob - 15, w: w, h: 28 });
  }
}

/* ------------------------------ Partículas ------------------------------- */
function dibujarParticulas() {
  for (const p of confetti) {
    const a = clamp(1 - p.t / p.vida, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
  for (const f of floats) {
    const a = clamp(1 - (f.t - 0.55) / 0.45, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    const s = 1 + Math.max(0, 0.25 - f.t) * 1.2;
    ctx.translate(f.x, f.y);
    ctx.scale(s, s);
    texto(f.txt, 0, 0, 22, f.color || '#2ecc55', 'center', true, 5, '#ffffff');
    ctx.restore();
  }
}

/* --------------------------------- Hints --------------------------------- */
const SIGNOS = [];   // rectángulos de letreros del mundo, para no encimar globos

function dibujarHint() {
  if (bigMsg) return;              // en la celebración el globo estorba
  const h = hintActivo();
  if (!h) return;
  const obj = h.objetivo();
  if (obj) {
    const dx = obj.x - player.x, dy = obj.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d > 40) {
      const ux = dx / d, uy = dy / d;
      const pulso = (Math.sin(tiempo * 4) + 1) * 0.5;
      const dist = 52 + pulso * 12;
      ctx.save();
      ctx.translate(player.x + ux * dist, player.y - 34 + uy * dist);
      ctx.rotate(Math.atan2(uy, ux));
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = h.id === 'plaga' ? '#ff6b6b' : '#ffd166';
      ctx.strokeStyle = '#8a5a10';
      ctx.lineWidth = 3; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(16, 0); ctx.lineTo(-8, -11); ctx.lineTo(-3, 0); ctx.lineTo(-8, 11);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
  const txt = t(h.k);
  const w = anchoTexto(txt, 17, true) + 30;
  let y = player.y - 92 - alturaPila(player.carga.length);
  const x0 = player.x - w / 2;
  // 1) no encimar letreros del mundo
  for (let i = 0; i < 4; i++) {
    let choca = false;
    for (const s of SIGNOS) {
      if (x0 < s.x + s.w && x0 + w > s.x && y - 16 < s.y + s.h && y + 16 > s.y) { choca = true; break; }
    }
    if (!choca) break;
    y -= 40;
  }
  // 2) no quedar debajo del HUD: si sube demasiado, va bajo los pies
  const hudAbajo = HUD.lista.y + HUD.lista.h + 12;
  if ((y - 16 - cam.y) * view.scale < hudAbajo) y = player.y + 52;
  ctx.save();
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = 'rgba(20,28,20,0.82)';
  rr(x0, y - 16, w, 32, 15); ctx.fill();
  texto(txt, player.x, y + 1, 17, '#ffffff', 'center', true);
  ctx.restore();
}

/* ---------------------------------- HUD ---------------------------------- */
function pill(x, y, w, h, r, alpha) {
  ctx.fillStyle = 'rgba(16,26,18,' + (alpha === undefined ? 0.72 : alpha) + ')';
  rr(x, y, w, h, r); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 2;
  rr(x, y, w, h, r); ctx.stroke();
}

function botonHUD(b, icono) {
  pill(b.x, b.y, b.s, b.s, 12, 0.66);
  emoji(icono, b.x + b.s / 2, b.y + b.s / 2 + 1, Math.round(b.s * 0.5));
}

const COLOR_RETO = { c: '#ffd166', o: '#c9a0ff', d: '#7ec8ff' };

// Tarjeta del HUD: degradado suave, borde fino y franja de acento a la izquierda
function tarjetaHUD(x, y, w, h, r, acento) {
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(28,44,30,0.90)');
  g.addColorStop(1, 'rgba(14,26,16,0.90)');
  ctx.fillStyle = g;
  rr(x, y, w, h, r); ctx.fill();
  ctx.save();
  rr(x, y, w, h, r); ctx.clip();
  ctx.fillStyle = acento;
  ctx.fillRect(x, y, 3.5, h);
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.13)';
  ctx.lineWidth = 1.5;
  rr(x, y, w, h, r); ctx.stroke();
}

/* El avance va en un anillo alrededor del ícono, no en una barra larga: es
   el mismo lenguaje que los círculos de mejora, la paciencia del cliente y
   la cura de plantas, y con poco avance se sigue viendo un arco. */
function anilloReto(cx, cy, r, prog, col, casi, k) {
  ctx.save();
  ctx.lineWidth = 3.4 * k;
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.stroke();
  if (prog > 0) {
    ctx.strokeStyle = (casi && Math.sin(tiempo * 8) > 0) ? '#e8fff0' : col;
    ctx.beginPath();
    ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.max(0.14, prog * 6.2832));
    ctx.stroke();
  }
  ctx.restore();
}

function iconoConAnillo(cx, cy, r, prog, col, icono, tam, k) {
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  circulo(cx, cy, r - 2 * k); ctx.fill();
  anilloReto(cx, cy, r, prog, col, prog >= 0.9 && prog < 1, k);
  if (prog >= 1) texto('✓', cx, cy + 0.5 * k, tam, col, 'center', true);
  else emoji(icono, cx, cy, tam, 'center', col);
}

function dibujarFilaReto(fila, item) {
  const k = HUD.k, r = item.r;
  const val = r.prog(state);
  const prog = clamp(val / r.meta, 0, 1);
  const col = COLOR_RETO[item.tipo] || '#5ee06a';
  tarjetaHUD(fila.x, fila.y, fila.w, fila.h, 10 * k, col);
  const icono = item.tipo === 'c' ? '🎯' : (item.tipo === 'o' ? '⭐' : '📅');
  const cy = fila.y + fila.h / 2;
  iconoConAnillo(fila.x + 20 * k, cy, 10.5 * k, prog, col, icono, 11 * k, k);
  const cnt = Math.min(Math.floor(val), r.meta) + '/' + r.meta;
  const wCnt = anchoTexto(cnt, 10.5 * k, true);
  const tx = fila.x + 38 * k;
  texto(textoCorto(textoReto(r), fila.w - 38 * k - wCnt - 16 * k, 11.5 * k, true), tx, cy,
        11.5 * k, 'rgba(255,255,255,0.94)', 'left', true);
  texto(cnt, fila.x + fila.w - 10 * k, cy, 10.5 * k, 'rgba(255,255,255,0.68)', 'right', true);
}

function dibujarHUD() {
  const k = HUD.k, top = HUD.top, H = HUD.h;

  // Dinero, con el cronómetro de la partida como segunda línea chica: así
  // se puede medir en qué tiempo se termina el juego sin sumar otra píldora.
  const txtDinero = '$' + Math.floor(state.dinero);
  const txtTiempo = '⏱ ' + formatoTiempo(state.tiempoJuego);
  const wD = Math.max(100 * k, anchoTexto(txtDinero, 20 * k, true) + 56 * k,
                       anchoTexto(txtTiempo, 10 * k, true) + 40 * k);
  pill(12, top, wD, H, 20 * k);
  emoji('💰', 22, top + H / 2 + 1 - 4 * k, 20 * k, 'left');
  texto(txtDinero, 48 * k, top + H / 2 - 4 * k, 20 * k, '#ffe27a', 'left', true);
  texto(txtTiempo, 48 * k, top + H - 8 * k, 10 * k, 'rgba(255,255,255,0.62)', 'left', true);

  // Racha de venta: ficha naranja junto al dinero + barra de gracia
  const mult = comboMult();
  if (combo.n > 0 && mult > 1) {
    const tx = '×' + mult;
    const wc = anchoTexto(tx, 16 * k, true) + 20 * k;
    const cx2 = 12 + wD + 6;
    const late = 1 + Math.max(0, 0.14 - combo.t) * 1.1;
    ctx.save();
    ctx.translate(cx2 + wc / 2, top + H / 2);
    ctx.scale(late, late);
    ctx.fillStyle = 'rgba(255,176,31,0.96)';
    rr(-wc / 2, -(H - 8 * k) / 2, wc, H - 8 * k, 12 * k); ctx.fill();
    texto(tx, 0, -2 * k, 16 * k, '#3a2a05', 'center', true);
    const g = 1 - clamp(combo.t / CONFIG.COMBO_GRACIA, 0, 1);
    ctx.fillStyle = 'rgba(60,40,5,0.55)';
    rr(-wc / 2 + 5, (H - 8 * k) / 2 - 7 * k, wc - 10, 3.5 * k, 2); ctx.fill();
    ctx.fillStyle = '#fff6d8';
    rr(-wc / 2 + 5, (H - 8 * k) / 2 - 7 * k, (wc - 10) * g, 3.5 * k, 2); ctx.fill();
    ctx.restore();
  }

  // Reputación, en el hueco entre las dos píldoras
  const rep = Math.floor(state.reputacion);
  const rango = rangoRep();
  const colRep = ['#ff8a8a', '#ffc86b', '#a8e6a0', '#8fe3ff'][rango];
  const txtRep = String(rep);
  const wR = anchoTexto(txtRep, 17 * k, true) + 44 * k;
  // Pegada a la mochila, no al centro: ahí chocaba con la ficha de racha
  const wBag = Math.max(92 * k, anchoTexto(player.carga.length + '/' + state.capacidad, 20 * k, true) + 54 * k);
  const xR = cw - 12 - wBag - 6 - wR;
  pill(xR, top, wR, H, 20 * k);
  emoji('⭐', xR + 15 * k, top + H / 2 + 1, 15 * k);
  texto(txtRep, xR + wR - 12 * k, top + H / 2 - 4 * k, 17 * k, colRep, 'right', true);
  texto(textoCorto(t('rango' + rango), wR - 12 * k, 8.5 * k, true), xR + wR / 2, top + H - 8 * k,
        8.5 * k, 'rgba(255,255,255,0.6)', 'center', true);

  // Carga
  const txtBag = player.carga.length + '/' + state.capacidad;
  const wB = Math.max(92 * k, anchoTexto(txtBag, 20 * k, true) + 54 * k);
  pill(cw - 12 - wB, top, wB, H, 20 * k);
  emoji('🎒', cw - 12 - wB + 12, top + H / 2 + 1, 20 * k, 'left');
  const lleno = player.carga.length >= state.capacidad;
  texto(txtBag, cw - 12 - wB + 38 * k, top + H / 2, 20 * k, lleno ? '#ff8a8a' : '#ffffff', 'left', true);

  // Banner: durante una oleada manda la oleada
  const b = HUD.banner;
  if (oleada) {
    const urg = 0.5 + 0.5 * Math.sin(tiempo * 6);
    ctx.fillStyle = 'rgba(126,22,22,0.9)';
    rr(b.x, b.y, b.w, b.h, 9 * k); ctx.fill();
    ctx.strokeStyle = 'rgba(255,120,120,' + (0.5 + 0.4 * urg).toFixed(2) + ')';
    ctx.lineWidth = 2;
    rr(b.x, b.y, b.w, b.h, 9 * k); ctx.stroke();
    const seg = Math.max(0, Math.ceil(CONFIG.OLEADA_DURACION - Math.max(0, oleada.t)));
    const izq = oleada.t < 0
      ? t('intento', { a: oleada.intento, b: CONFIG.OLEADA_INTENTOS })
      : t('oleadaHUD', { s: seg });
    const der = t('perdidas', { a: oleada.perdidas, b: CONFIG.OLEADA_MAX_PERDIDAS });
    const wDer2 = anchoTexto(der, 11 * k, true);
    texto(textoCorto(izq, b.w - wDer2 - 24 * k, 12 * k, true), b.x + 10 * k, b.y + b.h / 2,
          12 * k, '#ffd7d7', 'left', true);
    texto(der, b.x + b.w - 10 * k, b.y + b.h / 2, 11 * k,
          oleada.perdidas > CONFIG.OLEADA_MAX_PERDIDAS ? '#ff9a9a' : 'rgba(255,255,255,0.9)', 'right', true);
  } else {
    // Tarjeta principal: capítulo arriba, reto en curso con su barra abajo
    const r = retoActual();
    tarjetaHUD(b.x, b.y, b.w, b.h, 12 * k, '#ffd166');
    const cap = r ? t('capitulo', { n: r.cap + 1 }) + ' · ' + t(CAP_NOMBRES[r.cap]) : t('modoLibre');
    const der2 = r ? t('retoDeN', { a: state.retoIdx + 1, b: CAMPANA.length })
                   : t('frutasVendidas', { n: state.ventasTotales });
    const wDer = anchoTexto(der2, 10 * k, true);
    texto(textoCorto(cap, b.w - wDer - 40 * k, 10.5 * k, true), b.x + 12 * k, b.y + 13 * k,
          10.5 * k, 'rgba(255,226,122,0.95)', 'left', true);
    texto(der2, b.x + b.w - 26 * k, b.y + 13 * k, 10 * k, 'rgba(255,255,255,0.6)', 'right', true);
    // Flecha de plegar/desplegar
    texto(hudExpandido() ? '▴' : '▾', b.x + b.w - 12 * k, b.y + 13 * k, 12 * k,
          'rgba(255,255,255,0.75)', 'center', true);
    const cy = b.y + 32 * k;
    if (r) {
      const val = r.prog(state), prog = clamp(val / r.meta, 0, 1);
      const cnt = Math.min(Math.floor(val), r.meta) + '/' + r.meta;
      const wCnt = anchoTexto(cnt, 11 * k, true);
      iconoConAnillo(b.x + 24 * k, cy, 13 * k, prog, '#5ee06a', '🎯', 13 * k, k);
      texto(textoCorto(textoReto(r), b.w - 44 * k - wCnt - 16 * k, 12.5 * k, true), b.x + 44 * k, cy,
            12.5 * k, '#ffffff', 'left', true);
      texto(cnt, b.x + b.w - 12 * k, cy, 11 * k, 'rgba(255,255,255,0.72)', 'right', true);
    } else {
      iconoConAnillo(b.x + 24 * k, cy, 13 * k, 1, '#ffd166', '🏆', 13 * k, k);
      texto(t('modoLibre').replace('🏆 ', ''), b.x + 44 * k, cy, 12.5 * k, '#ffe27a', 'left', true);
    }
  }

  // Filas extra solo si está desplegada
  if (hudExpandido()) {
    const vis = retosVisibles();
    let n = 0;
    for (let i = 0; i < vis.length && n < HUD.filas.length; i++) {
      if (vis[i].tipo === 'c') continue;                 // ya va en la tarjeta
      dibujarFilaReto(HUD.filas[n], vis[i]);
      n++;
    }
  }

  // Botones
  botonHUD(HUD.btn.mute, state.mute ? '🔇' : '🔊');
  botonHUD(HUD.btn.idioma, '🌐');
  botonHUD(HUD.btn.share, '📤');
  botonHUD(HUD.btn.reset, '↺');
  texto(LANG.toUpperCase(), HUD.btn.idioma.x + HUD.btn.idioma.s / 2, HUD.btn.idioma.y + HUD.btn.idioma.s - 4,
        9 * k, 'rgba(255,255,255,0.85)', 'center', true);

  // Marco rojo mientras una plaga esté comiendo
  if (hayPlagaComiendo()) {
    const a = 0.16 + 0.14 * (0.5 + 0.5 * Math.sin(tiempo * 5));
    ctx.save();
    ctx.strokeStyle = 'rgba(232,64,64,' + a.toFixed(3) + ')';
    ctx.lineWidth = 10;
    ctx.strokeRect(5, 5, cw - 10, ch - 10);
    ctx.restore();
  }

  dibujarMarcadoresPlaga();

  // Joystick
  if (joy.activo && !panel.abierto) {
    ctx.save();
    ctx.globalAlpha = 0.28; ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, 52, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 0.5; ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, 52, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(joy.kx, joy.ky, 24, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  // Toasts: justo debajo de la lista de retos, nunca sobre las mejoras
  const toastY0 = HUD.lista.y + HUD.lista.h + 6;
  for (let i = 0; i < toasts.length; i++) {
    const to = toasts[i];
    const a = to.t < 0.2 ? to.t / 0.2 : (to.t > 1.9 ? clamp((2.4 - to.t) / 0.5, 0, 1) : 1);
    const w = Math.min(cw - 40, Math.max(anchoTexto(to.txt, 14, true), anchoTexto(to.sub, 13, true)) + 44);
    const y = toastY0 + i * 50;
    ctx.save();
    ctx.globalAlpha = a;
    pill((cw - w) / 2, y, w, 44, 14, 0.86);
    texto(textoCorto(to.txt, w - 24, 14, true), cw / 2, y + (to.sub ? 15 : 22), 14, '#ffffff', 'center', true);
    if (to.sub) texto(to.sub, cw / 2, y + 32, 13, '#7dffa0', 'center', true);
    ctx.restore();
  }

  // Mensaje grande
  if (bigMsg) {
    const tt = bigMsg.t;
    const a = tt < 0.25 ? tt / 0.25 : (tt > 2.1 ? clamp((2.6 - tt) / 0.5, 0, 1) : 1);
    const s = tt < 0.35 ? 0.6 + (tt / 0.35) * 0.45 : 1 + Math.sin(Math.min(tt, 1.4) * 6) * 0.015;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(cw / 2, ch * 0.58);   // bajo los toasts, no encima de ellos
    ctx.scale(s, s);
    const w = Math.min(cw - 20, anchoTexto(bigMsg.txt, 32, true) + 56);
    ctx.fillStyle = 'rgba(16,26,18,0.82)';
    rr(-w / 2, -34, w, 68, 20); ctx.fill();
    texto(bigMsg.txt, 0, 0, 32, '#ffe27a', 'center', true, 6, 'rgba(0,0,0,0.35)');
    ctx.restore();
  }
}

// Flechas en el borde apuntando a plagas fuera de pantalla
function dibujarMarcadoresPlaga() {
  const m = 30;
  for (const p of plagas) {
    if (p.estado === 'huyendo') continue;
    const s = mundoAPantalla(p.x, p.y);
    if (s.x >= 0 && s.x <= cw && s.y >= 0 && s.y <= ch) continue;
    const cx2 = cw / 2, cy2 = ch / 2;
    let dx = s.x - cx2, dy = s.y - cy2;
    const d = Math.hypot(dx, dy) || 1;
    dx /= d; dy /= d;
    const tx = Math.abs(dx) < 1e-4 ? Infinity : Math.abs((cw / 2 - m) / dx);
    const ty = Math.abs(dy) < 1e-4 ? Infinity : Math.abs((ch / 2 - m) / dy);
    const tt = Math.min(tx, ty);
    const ax = cx2 + dx * tt, ay = cy2 + dy * tt;
    const pulso = 0.5 + 0.5 * Math.sin(tiempo * 6);
    ctx.save();
    ctx.translate(ax, ay);
    ctx.globalAlpha = 0.75 + 0.25 * pulso;
    ctx.fillStyle = 'rgba(20,20,24,0.7)';
    circulo(0, 0, 19); ctx.fill();
    ctx.save();
    ctx.rotate(Math.atan2(dy, dx));
    ctx.fillStyle = '#ff5a5a';
    ctx.beginPath();
    ctx.moveTo(24, 0); ctx.lineTo(12, -9); ctx.lineTo(12, 9);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    emoji('🐦', 0, 1, 20);
    ctx.restore();
  }
}

/* ============================== 16. PANEL =============================== */
const CARD_H = 58, CAP_H = 30, NOTA_H = 34;

function itemsPanel() {
  const out = [];
  if (panel.tab === 0) {
    let capAct = -1;
    for (let i = 0; i < CAMPANA.length; i++) {
      const r = CAMPANA[i];
      if (r.cap !== capAct) {
        capAct = r.cap;
        out.push({ tipo: 'cap', txt: t('capitulo', { n: r.cap + 1 }) + ' · ' + t(CAP_NOMBRES[r.cap]) });
      }
      out.push({ tipo: 'reto', r: r, hecho: i < state.retoIdx, actual: i === state.retoIdx, premio: r.premio });
    }
  } else if (panel.tab === 1) {
    for (const r of OPCIONALES) out.push({ tipo: 'reto', r: r, hecho: cumplido(r.id), premio: r.premio });
  } else {
    out.push({ tipo: 'cap', txt: state.diarios.fecha });
    for (let i = 0; i < state.diarios.ids.length; i++) {
      const r = RETO_BY_ID[state.diarios.ids[i]];
      if (r) out.push({ tipo: 'reto', r: r, hecho: diarioCobrado(r.id), premio: PREMIO_DIARIO[i] });
    }
    out.push({ tipo: 'nota', txt: t('sinDiarios') });
  }
  return out;
}

function dibujarPanel() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.fillRect(0, 0, cw, ch);

  ctx.fillStyle = 'rgba(22,34,24,0.98)';
  rr(panel.x, panel.y, panel.w, panel.h, 20); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 2;
  rr(panel.x, panel.y, panel.w, panel.h, 20); ctx.stroke();

  texto(t('retos'), panel.x + 18, panel.y + 26, 19, '#ffe27a', 'left', true);
  pill(panel.cerrar.x, panel.cerrar.y, panel.cerrar.s, panel.cerrar.s, 10, 0.5);
  texto('✕', panel.cerrar.x + panel.cerrar.s / 2, panel.cerrar.y + panel.cerrar.s / 2, 17, '#ffffff', 'center', true);

  // Pestañas
  const tw = panel.w / 3;
  const nombres = [t('campana'), t('opcionales'), t('diarios')];
  for (let i = 0; i < 3; i++) {
    const tx = panel.x + i * tw;
    const act = panel.tab === i;
    ctx.fillStyle = act ? 'rgba(94,224,106,0.22)' : 'rgba(255,255,255,0.05)';
    rr(tx + 3, panel.tabsY, tw - 6, panel.tabH, 10); ctx.fill();
    if (act) {
      ctx.strokeStyle = '#5ee06a'; ctx.lineWidth = 2;
      rr(tx + 3, panel.tabsY, tw - 6, panel.tabH, 10); ctx.stroke();
    }
    texto(textoCorto(nombres[i], tw - 14, 13, true), tx + tw / 2, panel.tabsY + panel.tabH / 2,
          13, act ? '#ffffff' : 'rgba(255,255,255,0.6)', 'center', true);
  }

  // Contenido con recorte y scroll
  const items = itemsPanel();
  let total = 0;
  for (const it of items) total += it.tipo === 'cap' ? CAP_H : (it.tipo === 'nota' ? NOTA_H : CARD_H + 6);
  panel.maxScroll = Math.max(0, total - panel.contH);
  panel.scroll = clamp(panel.scroll, 0, panel.maxScroll);

  ctx.save();
  ctx.beginPath();
  ctx.rect(panel.x + 6, panel.contY, panel.w - 12, panel.contH);
  ctx.clip();
  let y = panel.contY - panel.scroll;
  const x = panel.x + 12, w = panel.w - 24;
  for (const it of items) {
    if (it.tipo === 'cap') {
      if (y + CAP_H > panel.contY - 20 && y < panel.contY + panel.contH + 20) {
        texto(it.txt, x + 2, y + CAP_H / 2 + 2, 13, '#8fe39a', 'left', true);
      }
      y += CAP_H;
    } else if (it.tipo === 'nota') {
      if (y + NOTA_H > panel.contY - 20 && y < panel.contY + panel.contH + 20) {
        texto(it.txt, x + 2, y + NOTA_H / 2, 12, 'rgba(255,255,255,0.55)', 'left', false);
      }
      y += NOTA_H;
    } else {
      if (y + CARD_H > panel.contY - 20 && y < panel.contY + panel.contH + 20) dibujarTarjeta(it, x, y, w);
      y += CARD_H + 6;
    }
  }
  ctx.restore();

  // Barra de scroll
  if (panel.maxScroll > 0) {
    const trackH = panel.contH;
    const h = Math.max(28, trackH * (panel.contH / (panel.contH + panel.maxScroll)));
    const yy = panel.contY + (trackH - h) * (panel.scroll / panel.maxScroll);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    rr(panel.x + panel.w - 9, yy, 4, h, 2); ctx.fill();
  }
  ctx.restore();
}

function dibujarTarjeta(it, x, y, w) {
  const r = it.r;
  const val = r.prog(state);
  const prog = it.hecho ? 1 : clamp(val / r.meta, 0, 1);
  ctx.fillStyle = it.hecho ? 'rgba(94,224,106,0.14)' : 'rgba(255,255,255,0.06)';
  rr(x, y, w, CARD_H, 12); ctx.fill();
  if (it.actual) {
    ctx.strokeStyle = 'rgba(255,226,122,0.75)'; ctx.lineWidth = 2;
    rr(x, y, w, CARD_H, 12); ctx.stroke();
  }
  const wPremio = anchoTexto('+$' + it.premio, 13, true) + 8;
  texto(textoCorto(textoReto(r), w - 30 - wPremio, 13, true), x + 12, y + 17, 13,
        it.hecho ? 'rgba(255,255,255,0.65)' : '#ffffff', 'left', true);
  texto('+$' + it.premio, x + w - 12, y + 17, 13, '#ffe27a', 'right', true);
  const bx = x + 12, bw = w - 24, by = y + 38, bh = 8;
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  rr(bx, by, bw, bh, 4); ctx.fill();
  ctx.fillStyle = it.hecho ? '#5ee06a' : '#4bb7e0';
  rr(bx, by, Math.max(5, bw * prog), bh, 4); ctx.fill();
  const etq = it.hecho ? '✓ ' + t('completado') : Math.min(Math.floor(val), r.meta) + ' / ' + r.meta;
  texto(etq, x + w - 12, y + 50, 11, it.hecho ? '#8fe39a' : 'rgba(255,255,255,0.75)', 'right', true);
}

function botonModal(b, etiqueta, primario, activo) {
  const base = primario
    ? (modal.peligro ? [224, 74, 74] : [58, 161, 74])
    : [70, 82, 72];
  const luz = activo ? 22 : 0;
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  rr(b.x, b.y + 3, b.w, b.h, 14); ctx.fill();
  ctx.fillStyle = 'rgb(' + (base[0] + luz) + ',' + (base[1] + luz) + ',' + (base[2] + luz) + ')';
  rr(b.x, b.y, b.w, b.h, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2;
  rr(b.x, b.y, b.w, b.h, 14); ctx.stroke();
  texto(textoCorto(etiqueta, b.w - 16, 15, true), b.x + b.w / 2, b.y + b.h / 2, 15,
        primario ? '#ffffff' : 'rgba(255,255,255,0.9)', 'center', true);
}

function dibujarModal() {
  const a = clamp(modal.t / 0.16, 0, 1);
  const e = 1 - Math.pow(1 - a, 3);          // salida suave
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,' + (0.66 * a).toFixed(3) + ')';
  ctx.fillRect(0, 0, cw, ch);

  ctx.translate(modal.x + modal.w / 2, modal.y + modal.h / 2);
  ctx.scale(0.9 + 0.1 * e, 0.9 + 0.1 * e);
  ctx.translate(-(modal.x + modal.w / 2), -(modal.y + modal.h / 2));
  ctx.globalAlpha = a;

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  rr(modal.x, modal.y + 6, modal.w, modal.h, 22); ctx.fill();
  ctx.fillStyle = 'rgba(24,38,26,0.99)';
  rr(modal.x, modal.y, modal.w, modal.h, 22); ctx.fill();
  ctx.strokeStyle = modal.festejo ? 'rgba(255,209,102,0.85)'
                  : (modal.peligro ? 'rgba(230,90,90,0.55)' : 'rgba(255,255,255,0.18)');
  ctx.lineWidth = modal.festejo ? 3 : 2;
  rr(modal.x, modal.y, modal.w, modal.h, 22); ctx.stroke();

  emoji(modal.festejo ? '🏆' : (modal.peligro ? '⚠️' : '💬'), modal.x + modal.w / 2, modal.y + 34,
        modal.festejo ? 30 : 26);
  texto(textoCorto(modal.tit, modal.w - 36, modal.festejo ? 22 : 19, true), modal.x + modal.w / 2,
        modal.y + 66, modal.festejo ? 22 : 19,
        modal.festejo ? '#ffe27a' : (modal.peligro ? '#ffb4b4' : '#ffe27a'), 'center', true);
  let yy = modal.y + 96;
  for (let i = 0; i < modal.lineas.length; i++) {
    texto(modal.lineas[i], modal.x + modal.w / 2, yy + i * 21, 14, 'rgba(255,255,255,0.82)', 'center', false);
  }
  yy += modal.lineas.length * 21 + 10;
  if (modal.stats) {
    for (let i = 0; i < modal.stats.length; i++) {
      const fy = yy + i * 26;
      if (i % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        rr(modal.x + 16, fy - 11, modal.w - 32, 24, 8); ctx.fill();
      }
      texto(modal.stats[i][0], modal.x + 26, fy, 13, 'rgba(255,255,255,0.7)', 'left', false);
      texto(modal.stats[i][1], modal.x + modal.w - 26, fy, 14, '#ffe27a', 'right', true);
    }
    yy += modal.stats.length * 26 + 4;
  }
  // Hueco reservado para el <input> real de HTML del nombre del récord;
  // se posiciona con estas mismas coordenadas justo después de dibujar.
  if (modal.festejo && mostrarCajaRecord) { modal.recordY = yy + 22; yy += 54; }
  else modal.recordY = null;
  if (modal.no) botonModal(modal.btnNo, modal.no, false, modal.hover === 'no');
  botonModal(modal.btnSi, modal.si, true, modal.hover === 'si');
  ctx.restore();
  sincronizarRecordBox();
}

  ctx.fillStyle = 'rgba(0,0,0,0.18)';

  ctx.fillStyle = c.copa;
  circulo(-14, -8, 27); ctx.fill();
  circulo(16, -10, 25); ctx.fill();
  circulo(0, -28, 28); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.14)';

function botonGrande(b, etiqueta, tam, c1, c2, colTxt, pulso) {

}

// Fondo propio de la portada: no se ve el mundo detrás, es una portada de verdad
function fondoIntro() {
  const g = ctx.createLinearGradient(0, 0, 0, ch);
  g.addColorStop(0, '#0a2413');
  g.addColorStop(0.42, '#17431f');
  g.addColorStop(1, '#08180d');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, cw, ch);

  // Rayos de luz suaves
  ctx.save();
  ctx.globalAlpha = 0.05;
  ctx.translate(cw / 2, -ch * 0.12);
  ctx.rotate(Math.sin(intro.t * 0.25) * 0.06);
  for (let i = 0; i < 7; i++) {
    ctx.rotate(0.23);
    ctx.fillStyle = '#ffe27a';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(-34, ch * 1.5); ctx.lineTo(34, ch * 1.5);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // Frutas flotando
  for (let i = 0; i < 11; i++) {
    const f = FRUITS[i % FRUITS.length];
    const px = ((i * 137) % 100) / 100 * cw;
    const py = (((i * 61) % 100) / 100 * ch + intro.t * (11 + i * 2.5)) % (ch + 80) - 40;
    ctx.save();
    ctx.globalAlpha = 0.13;
    ctx.fillStyle = f.colores.fruta;
    circulo(px, py, 11 + (i % 3) * 6); ctx.fill();
    ctx.restore();
  }

  const u = Math.min(1.9, cw / 330);          // escala general de la escena

  // Copas grandes enmarcando el título, cortadas por los bordes
  arbolIntro(cw * 0.02, ch * 0.315, u * 1.5, FRUIT_BY_ID.mango, true);
  arbolIntro(cw * 0.98, ch * 0.345, u * 1.4, FRUIT_BY_ID.naranja, true);
  arbolIntro(cw * 0.17, ch * 0.185, u * 1.1, FRUIT_BY_ID.papaya, true);
  arbolIntro(cw * 0.84, ch * 0.170, u * 1.0, FRUIT_BY_ID.mango, true);
  arbolIntro(cw * 0.40, ch * 0.070, u * 0.8, FRUIT_BY_ID.pina, true);
  arbolIntro(cw * 0.66, ch * 0.055, u * 0.7, FRUIT_BY_ID.sandia, true);

  // Loma del fondo, más lejos
  ctx.fillStyle = '#17441e';
  ctx.beginPath();
  ctx.ellipse(cw * 0.33, ch * 0.505 + ch * 0.28, cw * 0.78, ch * 0.24, 0, 0, 6.2832);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cw * 0.84, ch * 0.520 + ch * 0.28, cw * 0.62, ch * 0.22, 0, 0, 6.2832);
  ctx.fill();
  const lej = [[0.09, 0.520, 0.44, 'naranja'], [0.27, 0.500, 0.34, 'mango'],
               [0.55, 0.495, 0.30, 'papaya'], [0.78, 0.508, 0.38, 'mango'],
               [0.95, 0.527, 0.42, 'pina']];
  for (const a of lej) arbolIntro(cw * a[0], ch * a[1], u * a[2], FRUIT_BY_ID[a[3]], true);

  // Loma lejana
  ctx.fillStyle = '#1e5527';
  ctx.beginPath();
  ctx.ellipse(cw * 0.3, ch * 0.60 + ch * 0.30, cw * 0.8, ch * 0.26, 0, 0, 6.2832);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cw * 0.78, ch * 0.615 + ch * 0.30, cw * 0.7, ch * 0.25, 0, 0, 6.2832);
  ctx.fill();

  // Loma principal
  const gy = ch * 0.58;
  ctx.fillStyle = '#2c6f36';
  ctx.beginPath();
  ctx.ellipse(cw / 2, gy + ch * 0.30, cw * 0.95, ch * 0.30, 0, 0, 6.2832);
  ctx.fill();
  ctx.fillStyle = '#358040';
  ctx.beginPath();
  ctx.ellipse(cw / 2, gy + ch * 0.32, cw * 0.88, ch * 0.29, 0, 0, 6.2832);
  ctx.fill();

  // Huerta de la loma: árboles de las cinco frutas
  const arb = [[0.04, 0.715, 0.58, 'mango'], [0.97, 0.700, 0.52, 'naranja'],
               [0.28, 0.660, 0.38, 'papaya'], [0.44, 0.600, 0.28, 'sandia'],
               [0.63, 0.592, 0.26, 'pina'], [0.90, 0.610, 0.30, 'mango']];
  for (const a of arb) arbolIntro(cw * a[0], ch * a[1], u * a[2], FRUIT_BY_ID[a[3]]);

  // Viñeta
  const v = ctx.createRadialGradient(cw / 2, ch * 0.44, ch * 0.18, cw / 2, ch * 0.44, ch * 0.78);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, cw, ch);
}

// Puesto en miniatura para la portada: toldo, mostrador y fruta
function puestoIntro(x, y, s) {
  ctx.save();
