/* Todos los personajes del juego, haciendo lo suyo en bucle */
function escenaIntro() {
  const u = Math.min(1.9, cw / 330);
  const T = intro.t;

  // Ecosistema: rastreras, puesto, bache y fruta caída
  rastreraIntro(cw * 0.27, ch * 0.700, u * 0.62, FRUIT_BY_ID.sandia);
  rastreraIntro(cw * 0.735, ch * 0.712, u * 0.58, FRUIT_BY_ID.pina);
  puestoIntro(cw * 0.845, ch * 0.628, u * 0.62);
  ctx.save();
  ctx.fillStyle = '#6b4b23';
  elipse(cw * 0.45, ch * 0.735, 20 * u * 0.7, 12 * u * 0.7); ctx.fill();
  ctx.fillStyle = '#4a3216';
  elipse(cw * 0.45, ch * 0.736, 15 * u * 0.7, 8 * u * 0.7); ctx.fill();
  ctx.restore();
  for (let i = 0; i < 3; i++) {
    const f = FRUITS[i];
    const fx = cw * 0.45 + (i - 1) * 22 * u * 0.6, fy = ch * 0.752 + (i % 2) * 6;
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; elipse(fx, fy + 6, 8, 3); ctx.fill();
    ctx.fillStyle = f.colores.frutaSombra; circulo(fx, fy, 7 * u * 0.7); ctx.fill();
    ctx.fillStyle = f.colores.fruta; circulo(fx, fy - 1, 6.2 * u * 0.7); ctx.fill();
  }

  // Plaga: cruza el cielo en arco, por detrás del título
  const pa = (T % 9) / 9;
  const pl = ACTORES.plaga;
  pl.x = -40 + pa * (cw + 80);
  pl.y = ch * 0.465 + Math.sin(pa * Math.PI * 2) * ch * 0.05;
  pl.ala = T * 16;
  pl.facing = 1;
  ctx.save();
  ctx.translate(pl.x, pl.y);
  ctx.scale(u * 0.8, u * 0.8);
  ctx.translate(-pl.x, -pl.y);
  dibujarPlaga(pl);
  ctx.restore();

  // Ayudante: va y viene cargando fruta al puesto
  const aa = (T % 11) / 11;
  const ay = ACTORES.ayudante;
  const ida = aa < 0.5;
  ay.x = ida ? cw * (0.08 + (aa / 0.5) * 0.30) : cw * (0.38 - ((aa - 0.5) / 0.5) * 0.30);
  ay.y = ch * 0.556;
  ay.facing = ida ? 1 : -1;
  ay.phase = T * 9;
  ay.swayT = T * 6;
  ay.moving = true;
  ay.carga = ida ? ['mango', 'naranja', 'mango'] : [];
  ctx.save();
  ctx.translate(ay.x, ay.y); ctx.scale(u * 0.72, u * 0.72); ctx.translate(-ay.x, -ay.y);
  dibujarPersonaje(ay, { camisa: CONFIG.HELPER_COLOR, gorra: CONFIG.HELPER_GORRA });
  ctx.restore();

  // Espantapájaros plantado en la loma
  const es = ACTORES.espanta;
  es.x = cw * 0.165; es.y = ch * 0.605; es.phase = 0;
  ctx.save();
  ctx.translate(es.x, es.y); ctx.scale(u * 0.85, u * 0.85); ctx.translate(-es.x, -es.y);
  dibujarEspantapajaros(es);
  ctx.restore();

  // Cliente: llega, espera un rato y se va contento
  const ca = (T % 13) / 13;
  const cl = ACTORES.cliente;
  const xFin = cw * 0.80;
  if (ca < 0.25) { cl.x = cw * 1.08 - (ca / 0.25) * (cw * 1.08 - xFin); cl.moving = true; cl.facing = -1; }
  else if (ca < 0.7) { cl.x = xFin; cl.moving = false; }
  else { cl.x = xFin + ((ca - 0.7) / 0.3) * (cw * 1.1 - xFin); cl.moving = true; cl.facing = 1; }
  cl.y = ch * 0.672;
  cl.phase = T * 9;
  cl.swayT = T * 6;
  cl.carga = ca > 0.7 ? ['naranja', 'mango'] : [];
  ctx.save();
  ctx.translate(cl.x, cl.y); ctx.scale(u * 1.0, u * 1.0); ctx.translate(-cl.x, -cl.y);
  dibujarPersonaje(cl, { camisa: '#c07de0', gorra: '#6b5236' });
  ctx.restore();
  if (ca >= 0.25 && ca < 0.7) {
    ctx.save();
    ctx.globalAlpha = 0.9;
    emoji('🛒', cl.x, cl.y - 78 * u, 20 * u);
    ctx.restore();
  }

  // Segundo cliente, esperando junto al puesto
  const cl2 = ACTORES.cliente2;
  cl2.x = cw * 0.735; cl2.y = ch * 0.648;
  cl2.moving = false; cl2.facing = 1;
  cl2.phase = 0; cl2.swayT = T * 2;
  ctx.save();
  ctx.translate(cl2.x, cl2.y); ctx.scale(u * 0.82, u * 0.82); ctx.translate(-cl2.x, -cl2.y);
  dibujarPersonaje(cl2, { camisa: '#4fb39a', gorra: '#8a6a3a' });
  ctx.restore();

  // Un ladrón de cada tipo, cada uno en su carril y a su ritmo
  const ladrones = [
    { tipo: LADRONES[0], y: 0.716, dur: 8,  der: false, esc: 0.92 },
    { tipo: LADRONES[1], y: 0.688, dur: 5.5, der: true,  esc: 0.80 },
    { tipo: LADRONES[2], y: 0.740, dur: 13, der: false, esc: 0.96 }
  ];
  for (let i = 0; i < ladrones.length; i++) {
    const L = ladrones[i];
    const a = ((T + i * 2.3) % L.dur) / L.dur;
    const mp = ACTORES.mapache;
    mp.tipo = L.tipo;
    mp.x = L.der ? -cw * 0.12 + a * (cw * 1.24) : cw * 1.12 - a * (cw * 1.24);
    mp.y = ch * L.y;
    mp.facing = L.der ? 1 : -1;
    mp.phase = T * (12 + i * 4);
    mp.carga = i === 0 ? ['papaya'] : (i === 2 ? ['naranja'] : []);
    ctx.save();
    ctx.translate(mp.x, mp.y);
    ctx.scale(u * L.esc, u * L.esc);
    ctx.translate(-mp.x, -mp.y);
    dibujarMapache(mp);
    ctx.restore();
  }
}

function dibujarIntroPortada(e) {
  escenaIntro();

  const bob = Math.sin(intro.t * 1.9) * 5;
  const tam = Math.min(70, cw * 0.185);
  const ty = ch * 0.265 - (1 - e) * 50 + bob * 0.35;

  // Guirnalda de rama, hojas y frutas colgando sobre el título
  const u = Math.min(1.9, cw / 330);
  const gx0 = cw * 0.10, gx1 = cw * 0.90, gyy = ty - tam * 0.46;
  const bez = tt => {
    const m = 1 - tt;
    return { x: m * m * gx0 + 2 * m * tt * (cw / 2) + tt * tt * gx1,
             y: m * m * (gyy + 12 * u) + 2 * m * tt * (gyy - 30 * u) + tt * tt * (gyy + 12 * u) };
  };
  ctx.save();
  ctx.strokeStyle = '#2f6f34'; ctx.lineWidth = 5 * u; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(gx0, gyy + 12 * u);
  ctx.quadraticCurveTo(cw / 2, gyy - 30 * u, gx1, gyy + 12 * u);
  ctx.stroke();
  for (let i = 0; i <= 12; i++) {
    const pt = bez(i / 12);
    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.rotate((i % 2 ? 0.7 : -0.7) + Math.sin(intro.t * 1.3 + i) * 0.08);
    ctx.fillStyle = i % 2 ? '#3fa34d' : '#4fb85c';
    elipse(0, 0, 11 * u, 5 * u); ctx.fill();
    ctx.restore();
  }
  for (let i = 0; i < 5; i++) {
    const pt = bez(0.08 + i * 0.21);
    const f = FRUITS[i];
    const cae = 16 * u + Math.sin(intro.t * 1.6 + i * 1.1) * 3 * u;
    ctx.strokeStyle = 'rgba(60,110,60,0.9)'; ctx.lineWidth = 2 * u;
    ctx.beginPath(); ctx.moveTo(pt.x, pt.y); ctx.lineTo(pt.x, pt.y + cae); ctx.stroke();
    ctx.fillStyle = f.colores.frutaSombra; circulo(pt.x, pt.y + cae + 9 * u, 9 * u); ctx.fill();
    ctx.fillStyle = f.colores.fruta; circulo(pt.x, pt.y + cae + 8 * u, 8 * u); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; circulo(pt.x - 2.6 * u, pt.y + cae + 5.6 * u, 2.6 * u); ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.font = fuente(tam, true);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 11; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.strokeText('KIOSA', cw / 2, ty);
  const gt = ctx.createLinearGradient(0, ty - tam * 0.5, 0, ty + tam * 0.45);
  gt.addColorStop(0, '#fff6c9'); gt.addColorStop(0.5, '#ffd166'); gt.addColorStop(1, '#eda222');
  ctx.fillStyle = gt;
  ctx.fillText('KIOSA', cw / 2, ty);
  ctx.restore();

  const sub = 'el imperio de las huertas';
  const ws = Math.min(cw - 30, anchoTexto(sub, 16, true) + 36);
  const sy = ty + tam * 0.52;
  ctx.save();
  ctx.fillStyle = 'rgba(198,52,52,0.95)';
  rr(cw / 2 - ws / 2, sy - 15, ws, 30, 8); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  rr(cw / 2 - ws / 2, sy + 5, ws, 10, 5); ctx.fill();
  texto(textoCorto(sub, ws - 18, 16, true), cw / 2, sy, 16, '#ffffff', 'center', true);
  ctx.restore();

  texto(textoCorto(t('introSub'), cw - 44, 13, false), cw / 2, sy + 30, 13,
        'rgba(255,255,255,0.72)', 'center', false);

  ctx.save();
  ctx.translate(cw / 2, ch * 0.672 + bob);
  const esc = Math.min(2.2, cw / 180) * (0.85 + 0.15 * e);
  ctx.scale(esc, esc);
  maniqui.phase = intro.t * 6;
  maniqui.swayT = intro.t * 6;
  dibujarPersonaje(maniqui, { camisa: '#3fb0e8', gorra: '#e63946', atras: true });
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = e;
  botonGrande(intro.btn, '▶  ' + t('btnJugar'), 25, '#6bea78', '#2f9d42', '#0c2a11', true);
  botonGrande(intro.btn2, t('comoJugar'), 17, 'rgba(255,255,255,0.22)', 'rgba(255,255,255,0.10)', '#ffffff', false);
  texto(textoCorto(t('introTip'), cw - 40, 12, false), cw / 2, intro.btn2.y + intro.btn2.h + 18, 12,
        'rgba(255,255,255,0.55)', 'center', false);
  ctx.restore();
}

function dibujarIntroReglas(e) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, cw, ch);

  const v = intro.volver;
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  rr(v.x, v.y, v.w, v.h, 12); ctx.fill();
  texto('‹ ' + t('volver'), v.x + v.w / 2, v.y + v.h / 2, 13, '#ffffff', 'center', true);

  texto(t('comoJugar'), cw / 2, ch * 0.105, 24, '#ffd166', 'center', true, 6, 'rgba(0,0,0,0.5)');

  const y0 = ch * 0.175, alto = (ch * 0.71 - y0) / REGLAS.length;
  for (let i = 0; i < REGLAS.length; i++) {
    const r = REGLAS[i];
    const ap = clamp((intro.tp - i * 0.07) / 0.3, 0, 1);
    const ease = 1 - Math.pow(1 - ap, 3);
    const y = y0 + i * alto + alto / 2;
    ctx.save();
    ctx.globalAlpha = ease;
    ctx.translate((1 - ease) * 26, 0);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    rr(16, y - alto / 2 + 4, cw - 32, alto - 8, 14); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    circulo(48, y, 22); ctx.fill();
    ctx.strokeStyle = r.col; ctx.lineWidth = 2;
    circulo(48, y, 22); ctx.stroke();
    emoji(r.ico, 48, y + 1, 22, 'center', r.col);
    const tx = 80, anchoTx = cw - 32 - 80 + 16 - 14;
    texto(textoCorto(t(r.k + 't'), anchoTx, 15, true), tx, y - 12, 15, r.col, 'left', true);
    const lineas = envolver(t(r.k + 'd'), anchoTx, 12, false);
    for (let j = 0; j < Math.min(2, lineas.length); j++) {
      texto(lineas[j], tx, y + 6 + j * 15, 12, 'rgba(255,255,255,0.78)', 'left', false);
    }
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha = e;
  botonGrande(intro.btn, t('btnAJugar'), 23, '#6bea78', '#2f9d42', '#0c2a11', true);
  ctx.restore();
  ctx.restore();
}

function dibujarIntro() {
  const a = clamp(intro.t / 0.5, 0, 1);
  const e = 1 - Math.pow(1 - a, 3);
  fondoIntro();
  if (intro.pagina === 0) dibujarIntroPortada(e);
  else dibujarIntroReglas(clamp(intro.tp / 0.35, 0, 1));
}

/* ---------------------------- Render completo ---------------------------- */
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#16241a';
  ctx.fillRect(0, 0, cw, ch);
  SIGNOS.length = 0;

  ctx.save();
  ctx.scale(view.scale, view.scale);
  let sx = 0, sy = 0;
  if (cam.shake > 0) { const m = cam.shake * 14; sx = rand(-m, m); sy = rand(-m, m); }
  ctx.translate(-cam.x + sx, -cam.y + sy);

  if (fondo) ctx.drawImage(fondo, 0, 0);
  dibujarZonaSegura();
  dibujarBaches();
  for (const f of FRUITS) dibujarZona(f);
  dibujarVenta();
  for (const c of circles) dibujarCirculo(c);
  for (const e of espantas) dibujarEspantapajaros(e);

  const drawables = [];
  for (const p of plants) drawables.push({ y: p.y, d: 0, o: p });
  for (const id of state.desbloqueadas) {
    const f = FRUIT_BY_ID[id];
    const vivos = state.arboles[id];
    if (!f || !vivos) continue;
    for (let i = 0; i < f.todasPos.length; i++) {
      if (!vivos[i]) drawables.push({ y: f.todasPos[i][1], d: 5, o: { x: f.todasPos[i][0], y: f.todasPos[i][1] } });
    }
  }
  for (const h of helpers) drawables.push({ y: h.y, d: 1, o: h });
  for (const c of clientes) drawables.push({ y: c.y, d: 3, o: c });
  drawables.push({ y: player.y, d: 2, o: player });
  drawables.sort((a, b) => a.y - b.y);
  dibujarCura();
  dibujarSuelo();
  for (const m of mapaches) drawables.push({ y: m.y, d: 4, o: m });
  drawables.sort((a, b) => a.y - b.y);
  for (const it of drawables) {
    if (it.d === 0) dibujarPlanta(it.o);
    else if (it.d === 1) {
      dibujarPersonaje(it.o, { camisa: it.o.color, gorra: CONFIG.HELPER_GORRA });
      if (helpersImpagos) {                       // sin sueldo: parados y marcados
        ctx.save();
        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(tiempo * 4);
        emoji('💸', it.o.x, it.o.y - 78, 20);
        ctx.restore();
      }
    } else if (it.d === 3) dibujarCliente(it.o);
    else if (it.d === 4) dibujarMapache(it.o);
    else if (it.d === 5) dibujarTocon(it.o);
    else dibujarJugador();
  }
  for (const p of plagas) dibujarPlaga(p);

  dibujarParticulas();
  dibujarHint();
  ctx.restore();

  if (intro.activo) { dibujarIntro(); return; }
  dibujarHUD();
  if (panel.abierto) dibujarPanel();
  if (modal.abierto) dibujarModal();
}

/* =============================== 17. LOOP =============================== */
let tiempo = 0;
let last = 0;

function paso(ts) {
  if (!last) last = ts;
  const msFrame = ts - last;
  let dt = msFrame / 1000;
  last = ts;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, CONFIG.MAX_DT);
  tiempo += dt;
  medirPerf(isFinite(msFrame) && msFrame > 0 ? Math.min(msFrame, 200) : 16);

  // En la intro el mundo se congela: nada de plagas comiendo antes de empezar
  if (intro.activo) {
    intro.t += dt;
    intro.tp += dt;
    actualizarParticulas(dt);
    actualizarCamara(dt);
    render();
    window.requestAnimationFrame(paso);
    return;
  }

  revisarDia();
  if (!state.terminado) state.tiempoJuego += dt;   // el reloj para al terminar, no sigue en modo libre
  const inp = inputVector();
  player.update(dt, inp.x, inp.y);
  for (let i = plants.length - 1; i >= 0; i--) {
    const p = plants[i];
    p.update(dt);
    if (p.muerta) {
      plants.splice(i, 1);
      floats.push({ x: p.x, y: p.y - 44, t: 0, txt: t('arbolMuerto'), color: '#ff8a6a' });
      plumas(p.x, p.y - 10);
      SFX.perdida();
    }
  }
  for (const h of helpers) h.update(dt);
  actualizarBaches(dt);
  actualizarSuelo(dt);
  actualizarMapaches(dt);
  actualizarClientes(dt);
  actualizarOleada(dt);
  actualizarPlagas(dt);
  actualizarCirculos(dt);
  cobrarSueldos(dt);

  if (combo.n > 0) {
    combo.t += dt;
    if (combo.t >= CONFIG.COMBO_GRACIA) romperCombo();
  }

  state.sinMarchita += dt;
  state.hoy.sinMarchita += dt;
  if (state.dinero > state.op.saldoMax) state.op.saldoMax = state.dinero;

  actualizarRetos(true);
  revisarMitad();
  actualizarParticulas(dt);
  actualizarCamara(dt);
  if (modal.abierto) modal.t += dt;
  if (festejoFinal > 0) {                       // lluvia de confeti del final
    festejoFinal -= dt;
    for (let i = 0; i < 3; i++) {
      lanzarConfeti(rand(20, WORLD_W - 20), cam.y + rand(-20, 60), 1);
    }
  }

  for (const f of FRUITS) {
    if (desbloqueada(f.id) && f._fade > 0) f._fade = Math.max(0, f._fade - dt * 1.4);
  }

  saveTimer += dt;
  if (saveTimer >= CONFIG.SAVE_INTERVAL) { saveTimer = 0; Save.guardar(); }

  render();
  window.requestAnimationFrame(paso);
}

/* ============================= 18. ARRANQUE ============================= */
function registrarSW() {
  try {
    if (location.protocol === 'https:' && navigator.serviceWorker) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (e) {}
}

function iniciar() {
  Save.cargar();
  LANG = state.idioma;
  pintarCredito();
  pintarUI();
  const bs = document.getElementById('btnShare');
  if (bs) bs.addEventListener('click', compartir);
  const rb = document.getElementById('recordBtn');
  if (rb) rb.addEventListener('click', guardarRecordDesdeInput);
  const ri = document.getElementById('recordInput');
  if (ri) ri.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); guardarRecordDesdeInput(); }
    e.stopPropagation();   // que "r" o flechas no muevan a Kiosa mientras escribe
  });
  construirFondo();
  reconstruirMundo();
  rebarajarBaches(true);
  actualizarRetos(false);          // reconcilia saves viejos sin fiesta
  for (const f of FRUITS) f._fade = desbloqueada(f.id) ? 0 : 1;
  resize();
  const o = objetivoCamara();
  cam.x = o.x; cam.y = o.y;
  registrarSW();
  window.requestAnimationFrame(paso);
}

/* ============================ 19. API DE CONSOLA ======================== */
const game = {
  get state() { return state; },
  get player() { return player; },
  get plants() { return plants; },
  get helpers() { return helpers; },
  get plagas() { return plagas; },
  get clientes() { return clientes; },
  get mapaches() { return mapaches; },
  get suelo() { return sueloFrutas; },
  get baches() { return baches; },
  get estanteTrays() { return state.estanteTrays; },
  frutaMasNecesitada() { return frutaMasNecesitada(); },
  get oleadaCola() { return oleadaCola; },
  rebarajarBaches() { rebarajarBaches(false); return baches.length; },
  spawnMapache() { mapaches.push(new Mapache()); return true; },
  tropezar() { tropezar(player); return sueloFrutas.length; },
  get intro() { return intro.activo; },
  get introBtn() { return intro.btn; },
  comenzar() { comenzarJuego(); return true; },
  spawnCliente() {
    if (clientes.length >= CONFIG.CLIENTE_MAX) return false;
    const usados = clientes.map(c => c.slot);
    for (let s = 0; s < SLOTS_CLIENTE.length; s++) {
      if (usados.indexOf(s) < 0) { clientes.push(new Cliente(s)); return true; }
    }
    return false;
  },
  surtir(n) {
    let k = 0;
    while (k < (n || 1) && !estanteLleno()) {
      const id = frutaMasNecesitada() || FRUITS[0].id;
      if (!depositar(id)) break;
      k++;
    }
    return estanteTotal();
  },
  trayCap(id) { return trayCap(id); },
  trayCount(id) { return trayCount(id); },
  terminar() { abrirFinal(); return true; },
  get combo() { return { n: combo.n, t: combo.t, mult: comboMult() }; },
  get oleada() { return oleada; },
  get impagos() { return helpersImpagos; },
  sueldo() { return sueldoPorMinuto(); },
  lanzarOleada(cap) { iniciarOleada(cap === undefined ? capituloActual() : cap, 1); return oleada; },
  marchitar(i) { const p = plants[i || 0]; if (p) marchitar(p, true); return !!p; },
  reconstruirMundo() { reconstruirMundo(); return true; },
  cargarGuardado() { return Save.cargar(); },
  CONFIG, FRUITS, CAMPANA, OPCIONALES, DIARIOS, circles, I18N, t,
  dinero(n) {
    const v = Number(n) || 0;
    state.dinero += v;
    if (v > 0) { state.dineroTotal += v; state.hoy.dinero += v; }
    Save.guardar();
    return Math.floor(state.dinero);
  },
  desbloquear(id) { desbloquearZona(id, true); Save.guardar(); },
  spawnPlaga() {
    const o = elegirObjetivoPlaga();
    if (o) { plagas.push(new Plaga(o)); return true; }
    return false;
  },
  completarReto(id) {
    const r = RETO_BY_ID[id];
    if (!r) return false;
    const i = CAMPANA.indexOf(r);
    if (i >= 0) { state.retoIdx = Math.max(state.retoIdx, i); }
    if (!cumplido(id)) state.cumplidos.push(id);
    Save.guardar();
    return true;
  },
  idioma(l) { if (IDIOMAS.indexOf(l) >= 0) { LANG = l; state.idioma = l; anchosCache = Object.create(null); pintarCredito(); Save.guardar(); } return LANG; },
  get modal() {
    return modal.abierto
      ? { tit: modal.tit, txt: modal.txt, si: modal.si, no: modal.no, btnSi: modal.btnSi, btnNo: modal.btnNo,
          stats: modal.stats, recordY: modal.recordY }
      : null;
  },
  dialogo(cfg) { abrirModal(cfg || { tit: 'Kiosa', txt: '...', si: 'OK' }); return true; },
  get tiempoJuego() { return state.tiempoJuego; },
  formatoTiempo(s) { return formatoTiempo(s); },
  get records() { return cargarRecords(); },
  get cajaRecordVisible() { return mostrarCajaRecord; },
  agregarRecord(nombre, segundos) { return agregarRecord(nombre, segundos); },
  guardarRecordActual() { guardarRecordDesdeInput(); return true; },
  terminarConTiempo(seg) { state.tiempoJuego = seg; abrirFinal(); return true; },
  calidad(c) { if (['auto', 'bajo', 'alto'].indexOf(c) >= 0) { state.calidad = c; resize(); Save.guardar(); } return state.calidad; },
  fps() { return Math.round(1000 / Math.max(1, perf.ms)); },
  guardar() { Save.guardar(); },
  reiniciar() { reiniciando = true; Save.borrar(); window.location.reload(); }
};
window.game = game;

iniciar();
</script>
</body>
</html>
