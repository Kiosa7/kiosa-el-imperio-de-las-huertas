function tocarPanel(p) {
  if (puntoEnRect(panel.cerrar, p.x, p.y)) { panel.abierto = false; return true; }
  const tw = panel.w / 3;
  if (p.y >= panel.tabsY && p.y <= panel.tabsY + panel.tabH && p.x >= panel.x && p.x <= panel.x + panel.w) {
    panel.tab = clamp(Math.floor((p.x - panel.x) / tw), 0, 2);
    panel.scroll = 0;
    return true;
  }
  if (p.x < panel.x || p.x > panel.x + panel.w || p.y < panel.y || p.y > panel.y + panel.h) {
    panel.abierto = false;                   // toque fuera de la tarjeta
    return true;
  }
  return false;
}

canvas.addEventListener('pointerdown', e => {
  SFX.resume();
  const p = posCanvas(e);

  if (modal.abierto) {
    if (puntoEnRect(modal.btnSi, p.x, p.y)) { SFX.pop(); confirmarModal(); }
    else if (modal.no && puntoEnRect(modal.btnNo, p.x, p.y)) { SFX.pop(); cerrarModal(); }
    else if (p.x < modal.x || p.x > modal.x + modal.w || p.y < modal.y || p.y > modal.y + modal.h) cerrarModal();
    e.preventDefault();
    return;
  }
  if (panel.abierto) {
    if (!tocarPanel(p)) { panel.dragId = e.pointerId; panel.dragY = p.y; panel.movido = false; }
    e.preventDefault();
    return;
  }
  if (puntoEnRect(HUD.btn.mute, p.x, p.y)) {
    state.mute = !state.mute;
    if (!state.mute) SFX.pop();
    Save.guardar(); e.preventDefault(); return;
  }
  if (puntoEnRect(HUD.btn.idioma, p.x, p.y)) { ciclarIdioma(); e.preventDefault(); return; }
  if (puntoEnRect(HUD.btn.share, p.x, p.y)) { compartir(); e.preventDefault(); return; }
  if (puntoEnRect(HUD.btn.reset, p.x, p.y)) {
    abrirModal({
      tit: t('reiniciarTit'), txt: t('reiniciar'),
      si: t('btnSi'), no: t('btnNo'), peligro: true,
      onSi: function () { reiniciando = true; Save.borrar(); window.location.reload(); }
    });
    e.preventDefault(); return;
  }
  if (puntoEnRect(HUD.lista, p.x, p.y)) {
    panel.abierto = true; panel.scroll = 0; e.preventDefault(); return;
  }

  if (joy.activo) return;
  joy.activo = true; joy.id = e.pointerId;
  joy.bx = p.x; joy.by = p.y; joy.kx = p.x; joy.ky = p.y;
  joy.dx = 0; joy.dy = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  const p = posCanvas(e);
  if (modal.abierto) {
    modal.hover = puntoEnRect(modal.btnSi, p.x, p.y) ? 'si'
                : (modal.no && puntoEnRect(modal.btnNo, p.x, p.y) ? 'no' : null);
    e.preventDefault();
    return;
  }
  if (panel.abierto) {
    if (panel.dragId === e.pointerId) {
      panel.scroll = clamp(panel.scroll - (p.y - panel.dragY), 0, panel.maxScroll);
      if (Math.abs(p.y - panel.dragY) > 3) panel.movido = true;
      panel.dragY = p.y;
    }
    e.preventDefault();
    return;
  }
  if (!joy.activo || e.pointerId !== joy.id) return;
  let dx = p.x - joy.bx, dy = p.y - joy.by;
  const d = Math.hypot(dx, dy);
  const R = 52;
  if (d > R) { dx = dx / d * R; dy = dy / d * R; }
  joy.kx = joy.bx + dx; joy.ky = joy.by + dy;
  const m = Math.min(1, d / R);
  if (d > 0.001) { joy.dx = (dx / (d > R ? R : Math.max(d, 0.001))) * m; joy.dy = (dy / (d > R ? R : Math.max(d, 0.001))) * m; }
  else { joy.dx = 0; joy.dy = 0; }
  e.preventDefault();
}, { passive: false });

function soltarJoystick(e) {
  if (panel.dragId !== null && (!e || e.pointerId === panel.dragId)) panel.dragId = null;
  if (!joy.activo || (e && e.pointerId !== joy.id)) return;
  joy.activo = false; joy.id = null; joy.dx = 0; joy.dy = 0;
}
canvas.addEventListener('pointerup', soltarJoystick);
canvas.addEventListener('pointercancel', soltarJoystick);
canvas.addEventListener('lostpointercapture', soltarJoystick);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  if (!panel.abierto) return;
  panel.scroll = clamp(panel.scroll + e.deltaY, 0, panel.maxScroll);
  e.preventDefault();
}, { passive: false });

window.addEventListener('keydown', e => {
  if (!e.key) return;
  const k = e.key.toLowerCase();
  keys[k] = true;
  SFX.resume();
  if (modal.abierto) {
    if (k === 'escape') cerrarModal();
    if (k === 'enter') confirmarModal();
    e.preventDefault();
    return;
  }
  if (k === 'escape' && panel.abierto) panel.abierto = false;
  if (k === 'tab') { panel.abierto = !panel.abierto; e.preventDefault(); }
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(k) >= 0) e.preventDefault();
}, { passive: false });
window.addEventListener('keyup', e => { if (e.key) keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; soltarJoystick(null); });

function inputVector() {
  if (panel.abierto || modal.abierto) return { x: 0, y: 0 };
  let ix = 0, iy = 0;
  if (keys['a'] || keys['arrowleft']) ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;
  if (keys['w'] || keys['arrowup']) iy -= 1;
  if (keys['s'] || keys['arrowdown']) iy += 1;
  if (ix !== 0 || iy !== 0) {
    const m = Math.hypot(ix, iy);
    return { x: ix / m, y: iy / m };
  }
  if (joy.activo) return { x: joy.dx, y: joy.dy };
  return { x: 0, y: 0 };
}

/* ============================== 15. RENDER ============================== */
function rr(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function circulo(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.closePath(); }
function elipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 6.2832); ctx.closePath(); }

function fuente(size, bold) {
  return (bold ? '700 ' : '600 ') + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
}
function anchoTexto(txt, size, bold) {
  const f = fuente(size, bold);
  const key = f + '|' + txt;
  let w = anchosCache[key];
  if (w === undefined) { ctx.font = f; w = ctx.measureText(txt).width; anchosCache[key] = w; }
  return w;
}
function texto(txt, x, y, size, color, align, bold, outline, outlineColor) {
  ctx.font = fuente(size, bold);
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (outline) {
    ctx.lineWidth = outline; ctx.lineJoin = 'round';
    ctx.strokeStyle = outlineColor || '#ffffff';
    ctx.strokeText(txt, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(txt, x, y);
}
// Recorta con "…" si no cabe
function textoCorto(txt, max, size, bold) {
  if (anchoTexto(txt, size, bold) <= max) return txt;
  let s = txt;
  while (s.length > 2 && anchoTexto(s + '…', size, bold) > max) s = s.slice(0, -1);
  return s + '…';
}
function emoji(e, x, y, size, align) {
  ctx.font = size + 'px system-ui, "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(e, x, y);
}
function mezclaGris(hex, t) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const m = c => Math.round(lerp(c, 130, t));
  return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')';
}

/* ------------------------------ Zonas ----------------------------------- */
function dibujarCerca(x, y, w, h, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineWidth = 5;
  rr(x, y, w, h, 18); ctx.stroke();
  ctx.lineWidth = 4;
  rr(x + 7, y + 7, w - 14, h - 14, 14); ctx.stroke();
  ctx.fillStyle = color;
  for (let px = x; px <= x + w + 1; px += 62) {
    const cx2 = Math.min(px, x + w);
    ctx.fillRect(cx2 - 4, y - 9, 8, 24);
    ctx.fillRect(cx2 - 4, y + h - 15, 8, 24);
  }
  for (let py = y + 62; py < y + h - 10; py += 62) {
    ctx.fillRect(x - 4, py - 10, 8, 24);
    ctx.fillRect(x + w - 4, py - 10, 8, 24);
  }
  ctx.restore();
}

// Solo la zona que abre el reto en curso lleva candado y letrero; las demás
// se quedan en gris para no convertir la pantalla en un muro de candados.
function zonaProximaDesbloquear() {
  for (let i = state.retoIdx; i < CAMPANA.length; i++) {
    const d = CAMPANA[i].desbloquea;
    if (d && !desbloqueada(d)) return d;
  }
  return null;
}

function dibujarZona(f) {
  const z = f.zona;
  const bloqueada = f._fade > 0.001;
  if (bloqueada) {
    ctx.save();
    ctx.globalAlpha = f._fade * 0.86;
    ctx.fillStyle = '#9aa89a';
    rr(z.x, z.y, z.w, z.h, 18); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    for (let y = z.y + 10; y < z.y + z.h; y += 40) ctx.fillRect(z.x + 8, y, z.w - 16, 14);
    ctx.restore();
  }
  dibujarCerca(z.x, z.y, z.w, z.h, bloqueada ? mezclaGris('#8a5a2b', f._fade) : '#8a5a2b');
  ctx.save();
  ctx.globalAlpha = 0.55;
  texto(t(z.key), z.x + z.w / 2, z.y + 16, 15, '#2f5b28', 'center', true);
  ctx.restore();
  if (bloqueada && f.id === zonaProximaDesbloquear()) {
    ctx.save();
    ctx.globalAlpha = f._fade;
    const cx2 = z.x + z.w / 2, cy2 = z.y + z.h / 2;
    emoji('🔒', cx2, cy2 - 16, 58);
    const txt = t('cumpleReto');
    const w = anchoTexto(txt, 16, true) + 34;
    ctx.fillStyle = 'rgba(20,24,20,0.72)';
    rr(cx2 - w / 2, cy2 + 26, w, 34, 17); ctx.fill();
    texto(txt, cx2, cy2 + 43, 16, '#ffffff', 'center', true);
    ctx.restore();
  }
}

/* ------------------------------- Plantas -------------------------------- */
const FRUIT_OFFSETS = [[-16, -8], [14, -14], [0, 10]];
const VINE_OFFSETS = [[-20, 4], [18, -2], [-2, 16]];

function dibujarPlanta(p) {
  if (p.fruit.tipoPlanta === 'rastrera') dibujarRastrera(p);
  else dibujarArbol(p);
  if (p.marchita > 0) {
    ctx.save();
    ctx.globalAlpha = 0.62;
    emoji('🥀', p.x + 26, p.y - (p.fruit.tipoPlanta === 'rastrera' ? 26 : 60), 20);
    ctx.restore();
  }
}

// Anillo de progreso mientras curas una planta marchita
function dibujarCura() {
  const p = player.curando;
  if (!p || player.curaT <= 0) return;
  const pr = clamp(player.curaT / CONFIG.CURA_TIEMPO, 0, 1);
  ctx.save();
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.30)';
  ctx.beginPath(); ctx.arc(p.x, p.y - 18, 34, 0, 6.2832); ctx.stroke();
  ctx.strokeStyle = '#7dffa0';
  ctx.beginPath(); ctx.arc(p.x, p.y - 18, 34, -Math.PI / 2, -Math.PI / 2 + pr * 6.2832); ctx.stroke();
  ctx.restore();
}

function dibujarArbol(p) {
  const c = p.fruit.colores;
  const marchita = p.marchita > 0;
  const g = marchita ? clamp(p.marchita / CONFIG.PLAGA_MARCHITA, 0, 1) * 0.75 : 0;
  const copa = marchita ? mezclaGris(c.copa, g) : c.copa;
  const copaO = marchita ? mezclaGris(c.copaOscura, g) : c.copaOscura;
  const s = 1 + p.pop * 0.20;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  elipse(p.x, p.y + 4, 28, 10); ctx.fill();
  ctx.fillStyle = marchita ? mezclaGris(c.tronco, g) : c.tronco;
  rr(p.x - 7, p.y - 40, 14, 44, 5); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  rr(p.x + 1, p.y - 40, 6, 44, 3); ctx.fill();
  ctx.translate(p.x, p.y - 58);
  if (marchita) ctx.rotate(Math.sin(tiempo * 1.4 + p.seed) * 0.05 - 0.06);
  ctx.scale(s, marchita ? s * 0.86 : s);
  ctx.fillStyle = copaO;
  circulo(-16, 2, 28); ctx.fill();
  circulo(18, 4, 26); ctx.fill();
  circulo(0, -16, 30); ctx.fill();
  ctx.fillStyle = copa;
  circulo(-12, -4, 24); ctx.fill();
  circulo(14, -6, 22); ctx.fill();
  circulo(0, -22, 24); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  circulo(-10, -24, 12); ctx.fill();
  for (let i = 0; i < p.frutas; i++) {
    const o = FRUIT_OFFSETS[i];
    ctx.fillStyle = c.frutaSombra;
    circulo(o[0], o[1] + 2, 8.5); ctx.fill();
    ctx.fillStyle = c.fruta;
    circulo(o[0], o[1], 8); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    circulo(o[0] - 2.6, o[1] - 2.6, 2.4); ctx.fill();
  }
  ctx.restore();
}

function dibujarRastrera(p) {
  const c = p.fruit.colores;
  const marchita = p.marchita > 0;
  const g = marchita ? clamp(p.marchita / CONFIG.PLAGA_MARCHITA, 0, 1) * 0.75 : 0;
  const s = 1 + p.pop * 0.14;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  elipse(0, 6, 42, 18); ctx.fill();
  ctx.fillStyle = marchita ? mezclaGris('#2f8b3a', g) : '#2f8b3a';
  elipse(0, 0, 40, 20); ctx.fill();
  ctx.fillStyle = marchita ? mezclaGris('#3fa34d', g) : '#3fa34d';
  for (let i = 0; i < 6; i++) {
    const a = i * 1.047 + p.seed;
    elipse(Math.cos(a) * 24, Math.sin(a) * 12, 13, 9); ctx.fill();
  }
  ctx.strokeStyle = '#2a7a33'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-26, 2); ctx.quadraticCurveTo(0, -10, 26, 3); ctx.stroke();
  for (let i = 0; i < p.frutas; i++) {
    const o = VINE_OFFSETS[i];
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    elipse(o[0], o[1] + 7, 12, 6); ctx.fill();
    ctx.fillStyle = c.frutaSombra;
    circulo(o[0], o[1], 12); ctx.fill();
    ctx.fillStyle = c.fruta;
    circulo(o[0], o[1] - 1, 11); ctx.fill();
    if (p.fruit.id === 'pina') {
      ctx.strokeStyle = 'rgba(120,80,10,0.55)'; ctx.lineWidth = 1.4;
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath(); ctx.moveTo(o[0] - 8, o[1] - 1 + k * 4); ctx.lineTo(o[0] + 8, o[1] - 5 + k * 4); ctx.stroke();
      }
      ctx.fillStyle = '#3fa34d';
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(o[0] + k * 4, o[1] - 10);
        ctx.lineTo(o[0] + k * 6, o[1] - 22);
        ctx.lineTo(o[0] + k * 4 + 4, o[1] - 10);
        ctx.closePath(); ctx.fill();
      }
    } else {
      ctx.strokeStyle = 'rgba(20,80,20,0.75)'; ctx.lineWidth = 2;
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(o[0] + k * 5, o[1] - 11);
        ctx.quadraticCurveTo(o[0] + k * 7.5, o[1] - 1, o[0] + k * 5, o[1] + 9);
        ctx.stroke();
      }
    }
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    elipse(o[0] - 4, o[1] - 6, 3.4, 2.2); ctx.fill();
  }
  ctx.restore();
}

/* ------------------------- Mostrador y mejoras --------------------------- */
function dibujarVenta() {
  const activo = enVenta(player.x, player.y);
  const pulso = 0.5 + 0.5 * Math.sin(tiempo * 3.2);
  ctx.save();
  ctx.fillStyle = activo ? 'rgba(255,236,140,0.55)' : 'rgba(255,255,255,0.20)';
  rr(SELL.x, SELL.y, SELL.w, SELL.h, 22); ctx.fill();
  ctx.setLineDash([12, 9]); ctx.lineWidth = 4;
  ctx.strokeStyle = activo ? '#ffd54a' : 'rgba(255,255,255,0.75)';
  rr(SELL.x, SELL.y, SELL.w, SELL.h, 22); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 0.85;
  texto('$', SELL.cx, SELL.cy + 10, 40, activo ? '#3aa14a' : 'rgba(255,255,255,0.9)', 'center', true);
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  rr(COUNTER.x + 6, COUNTER.y + COUNTER.h - 6, COUNTER.w, 16, 8); ctx.fill();
  ctx.fillStyle = '#a9702f';
  rr(COUNTER.x, COUNTER.y, COUNTER.w, COUNTER.h, 10); ctx.fill();
  ctx.fillStyle = '#c78a41';
  rr(COUNTER.x + 6, COUNTER.y + 6, COUNTER.w - 12, COUNTER.h - 20, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(90,55,20,0.45)'; ctx.lineWidth = 2;
  for (let i = 1; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(COUNTER.x + i * (COUNTER.w / 5), COUNTER.y + 8);
    ctx.lineTo(COUNTER.x + i * (COUNTER.w / 5), COUNTER.y + COUNTER.h - 14);
    ctx.stroke();
  }
  const sx = COUNTER.x + COUNTER.w / 2, sy = COUNTER.y - 46;
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(sx - 5, sy + 8, 10, 42);
  const etq = t('vender');
  const w = Math.max(156, anchoTexto(etq, 26, true) + 40);
  ctx.fillStyle = '#ffd166';
  rr(sx - w / 2, sy - 26, w, 44, 10); ctx.fill();
  ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 4;
  rr(sx - w / 2, sy - 26, w, 44, 10); ctx.stroke();
  texto(etq, sx, sy - 3, 26, '#7a4a10', 'center', true);
  SIGNOS.push({ x: sx - w / 2, y: sy - 26, w: w, h: 44 });
  if (activo) {
    ctx.globalAlpha = 0.25 + 0.25 * pulso;
    ctx.fillStyle = '#fff7c2';
    rr(SELL.x - 4, SELL.y - 4, SELL.w + 8, SELL.h + 8, 24); ctx.fill();
  }
  ctx.restore();
}

function dibujarCirculo(c) {
  const max = c.max();
  const precio = c.precio();
  const prog = max ? 0 : clamp(state.pagos[c.id] / precio, 0, 1);
  const alcanza = state.dinero >= 1;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  elipse(c.x, c.y + 6, c.r * 0.95, c.r * 0.42); ctx.fill();
  ctx.fillStyle = max ? 'rgba(160,168,160,0.75)' : (c._hover ? 'rgba(255,247,190,0.92)' : 'rgba(255,255,255,0.78)');
  circulo(c.x, c.y, c.r); ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = max ? '#7d857d' : '#3aa14a';
  circulo(c.x, c.y, c.r); ctx.stroke();
  if (!max && prog > 0) {
    ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.strokeStyle = '#ffb01f';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r + 7, -Math.PI / 2, -Math.PI / 2 + prog * 6.2832);
    ctx.stroke();
  }
  emoji(c.icono, c.x, c.y - 18, 30);
  texto(textoCorto(t(c.k), c.r * 2 - 6, 12, true), c.x, c.y + 12, 12, '#264a22', 'center', true);
  if (max) texto(t('max'), c.x, c.y + 32, 16, '#5a625a', 'center', true);
  else {
    ctx.fillStyle = 'rgba(20,30,20,0.82)';
    rr(c.x - 40, c.y + 22, 80, 23, 11); ctx.fill();
    texto('$' + precio, c.x, c.y + 34, 15, alcanza ? '#ffe27a' : '#ff9a9a', 'center', true);
  }
  ctx.restore();
  SIGNOS.push({ x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 + 26 });
}

function dibujarEspantapajaros(e) {
  const sw = Math.sin(tiempo * 1.6 + e.phase) * 0.06;
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  elipse(0, 2, 14, 5); ctx.fill();
  ctx.rotate(sw);
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(-3, -46, 6, 46);
  ctx.fillRect(-20, -34, 40, 5);
  ctx.fillStyle = '#e2683f';
  rr(-13, -40, 26, 22, 6); ctx.fill();
  ctx.fillStyle = '#f2d7a0';
  circulo(0, -50, 10); ctx.fill();
  ctx.fillStyle = '#2b2b2b';
  circulo(-3.5, -51, 1.6); ctx.fill();
  circulo(3.5, -51, 1.6); ctx.fill();
  ctx.fillStyle = '#c9a227';
  ctx.beginPath();
  ctx.moveTo(-15, -57); ctx.lineTo(15, -57); ctx.lineTo(9, -63); ctx.lineTo(-9, -63);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(-16, -58, 32, 4);
  ctx.restore();
}

/* -------------------------------- Plagas --------------------------------- */
function dibujarPlaga(p) {
  const flap = Math.sin(p.ala) * (p.estado === 'comiendo' ? 0.25 : 1);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  elipse(p.x, p.y + 34, 12, 5); ctx.fill();
  ctx.translate(p.x, p.y);
  ctx.scale(p.facing, 1);
  ctx.fillStyle = '#4a4a55';
  elipse(0, 0, 14, 10); ctx.fill();
  ctx.fillStyle = '#3a3a44';
  ctx.save();
  ctx.rotate(flap * 0.6);
  elipse(-2, -6, 11, 5); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#5b5b68';
  ctx.beginPath();
  ctx.moveTo(-12, 0); ctx.lineTo(-24, -6 + flap * 3); ctx.lineTo(-13, 5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#4a4a55';
  circulo(11, -6, 7); ctx.fill();
  ctx.fillStyle = '#ffb01f';
  ctx.beginPath();
  ctx.moveTo(17, -6); ctx.lineTo(25, -4); ctx.lineTo(17, -2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffffff';
  circulo(13, -8, 2.4); ctx.fill();
  ctx.fillStyle = '#1b1b1b';
  circulo(13.6, -8, 1.3); ctx.fill();
  ctx.restore();
  if (p.estado === 'comiendo') {
    const bob = Math.abs(Math.sin(tiempo * 5)) * 4;
    ctx.save();
    ctx.fillStyle = 'rgba(220,50,50,0.92)';
    circulo(p.x + 20, p.y - 26 - bob, 12); ctx.fill();
    texto('!', p.x + 20, p.y - 26 - bob, 20, '#ffffff', 'center', true);
    ctx.restore();
  }
}

/* -------------------------------- Kiosa ---------------------------------- */
function dibujarPersonaje(e, opts) {
  const camisa = opts.camisa, gorra = opts.gorra;
  const paso = Math.sin(e.phase) * (e.moving ? 1 : 0);
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.fillStyle = 'rgba(0,0,0,0.20)';
  elipse(0, 3, 17, 7); ctx.fill();
  const bob = e.moving ? Math.abs(Math.sin(e.phase)) * 2 : 0;
  ctx.translate(0, -bob);
  ctx.fillStyle = '#3a5fa8';
  rr(-9, -16, 8, 17 + paso * 3, 4); ctx.fill();
  rr(1, -16, 8, 17 - paso * 3, 4); ctx.fill();
  ctx.fillStyle = '#5a3d1e';
  rr(-10, -1 + Math.max(0, paso * 3), 10, 5, 2.5); ctx.fill();
  rr(0, -1 + Math.max(0, -paso * 3), 10, 5, 2.5); ctx.fill();
  ctx.fillStyle = camisa;
  rr(-13, -40, 26, 26, 9); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  rr(3, -40, 10, 26, 8); ctx.fill();
  // Nombre en la playera (solo el protagonista)
  if (opts.playera) texto('Kiosa', -1, -28, 7.5, '#ffffff', 'center', true, 1.8, 'rgba(10,60,90,0.65)');
  ctx.fillStyle = camisa;
  rr(-19, -38 + paso * 2.5, 7, 18, 3.5); ctx.fill();
  rr(12, -38 - paso * 2.5, 7, 18, 3.5); ctx.fill();
  ctx.fillStyle = '#f2c08a';
  circulo(-15.5, -21 + paso * 2.5, 4); ctx.fill();
  circulo(15.5, -21 - paso * 2.5, 4); ctx.fill();
  ctx.fillStyle = '#f2c08a';
  circulo(0, -50, 12.5); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  circulo(3, -50, 11); ctx.fill();
  ctx.fillStyle = '#2b2b2b';
  circulo(e.facing * 4.2 - 2.4, -50.5, 1.8); ctx.fill();
  circulo(e.facing * 4.2 + 2.6, -50.5, 1.8); ctx.fill();
  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(e.facing * 3.4, -45.5, 3.6, 0.25, Math.PI - 0.25);
  ctx.stroke();
  ctx.fillStyle = gorra;
  ctx.beginPath();
  ctx.arc(0, -58, 13, Math.PI, 0);
  ctx.lineTo(13, -56); ctx.lineTo(-13, -56);
  ctx.closePath(); ctx.fill();
  rr(e.facing > 0 ? 8 : -22, -59.5, 14, 5, 2.5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath();
  ctx.arc(0, -58, 13, Math.PI, Math.PI * 1.5);
  ctx.lineTo(0, -58); ctx.closePath(); ctx.fill();
  if (opts.logo) {
    ctx.save();
    ctx.translate(e.facing * 1.5, -63);
    ctx.fillStyle = '#ff9f1c';
    elipse(0, 1.5, 5.2, 4.1); ctx.fill();
    ctx.fillStyle = '#e07a00';
    elipse(1.4, 2.4, 2.4, 2.0); ctx.fill();
    ctx.fillStyle = '#3fa34d';
    ctx.save();
    ctx.translate(2.2, -2.4); ctx.rotate(-0.6);
    elipse(0, 0, 3.4, 1.7); ctx.fill();
    ctx.restore();
    ctx.restore();
  }
  // La pila se corta a PILA_VISIBLE: antes crecía sin tope y a mochila llena
  // atravesaba el HUD y se salía de la pantalla. El total sigue en la píldora 🎒.
  const n = Math.min(e.carga.length, CONFIG.PILA_VISIBLE);
  if (n > 0) {
    const desde = e.carga.length - n;
    const bx = -e.facing * 7;
    for (let i = 0; i < n; i++) {
      const f = FRUIT_BY_ID[e.carga[desde + i]];
      if (!f) continue;
      const alturaRel = (i + 1) / Math.max(4, n);
      const sway = Math.sin(e.swayT - i * 0.32) * 3.2 * alturaRel * (e.moving ? 1 : 0.35);
      const y = -44 - i * CONFIG.PILA_PASO;
      const r = f.tipoPlanta === 'rastrera' ? 7.5 : 7;
      ctx.fillStyle = f.colores.frutaSombra;
      circulo(bx + sway, y + 1.6, r); ctx.fill();
      ctx.fillStyle = f.colores.fruta;
      circulo(bx + sway, y, r * 0.92); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.42)';
      circulo(bx + sway - 2.2, y - 2.2, r * 0.28); ctx.fill();
    }
  }
  ctx.restore();
}

function alturaPila(n) { return Math.min(n, CONFIG.PILA_VISIBLE) * CONFIG.PILA_PASO; }

function dibujarJugador() {
  dibujarPersonaje(player, { camisa: '#3fb0e8', gorra: '#e63946', logo: true, playera: true });
  if (player.carga.length >= state.capacidad) {
    let yy = player.y - 66 - alturaPila(player.carga.length);
    // si quedaría bajo el HUD, se pone a los pies en vez de encimarse
    if ((yy - 15 - cam.y) * view.scale < HUD.lista.y + HUD.lista.h + 12) yy = player.y + 46;
    const bob = Math.sin(tiempo * 6) * 2;
    const txt = t('lleno');
    const w = anchoTexto(txt, 17, true) + 30;
    ctx.save();
    ctx.fillStyle = 'rgba(214,40,40,0.92)';
    rr(player.x - w / 2, yy + bob - 15, w, 28, 13); ctx.fill();
    texto(txt, player.x, yy + bob - 1, 17, '#fff', 'center', true);
    ctx.restore();
    SIGNOS.push({ x: player.x - w / 2, y: yy + bob - 15, w: w, h: 28 });
  }
}

/* ------------------------------ Partículas ------------------------------- */
function dibujarParticulas() {
  for (const p of confetti) {
    const a = clamp(1 - p.t / p.vida, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
  for (const f of floats) {
    const a = clamp(1 - (f.t - 0.55) / 0.45, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    const s = 1 + Math.max(0, 0.25 - f.t) * 1.2;
    ctx.translate(f.x, f.y);
    ctx.scale(s, s);
    texto(f.txt, 0, 0, 22, f.color || '#2ecc55', 'center', true, 5, '#ffffff');
    ctx.restore();
  }
}

/* --------------------------------- Hints --------------------------------- */
const SIGNOS = [];   // rectángulos de letreros del mundo, para no encimar globos

function dibujarHint() {
  if (bigMsg) return;              // en la celebración el globo estorba
  const h = hintActivo();
  if (!h) return;
  const obj = h.objetivo();
  if (obj) {
    const dx = obj.x - player.x, dy = obj.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d > 40) {
      const ux = dx / d, uy = dy / d;
      const pulso = (Math.sin(tiempo * 4) + 1) * 0.5;
      const dist = 52 + pulso * 12;
      ctx.save();
      ctx.translate(player.x + ux * dist, player.y - 34 + uy * dist);
      ctx.rotate(Math.atan2(uy, ux));
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = h.id === 'plaga' ? '#ff6b6b' : '#ffd166';
      ctx.strokeStyle = '#8a5a10';
      ctx.lineWidth = 3; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(16, 0); ctx.lineTo(-8, -11); ctx.lineTo(-3, 0); ctx.lineTo(-8, 11);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
  const txt = t(h.k);
  const w = anchoTexto(txt, 17, true) + 30;
  let y = player.y - 92 - alturaPila(player.carga.length);
  const x0 = player.x - w / 2;
  // 1) no encimar letreros del mundo
  for (let i = 0; i < 4; i++) {
    let choca = false;
    for (const s of SIGNOS) {
      if (x0 < s.x + s.w && x0 + w > s.x && y - 16 < s.y + s.h && y + 16 > s.y) { choca = true; break; }
    }
    if (!choca) break;
    y -= 40;
  }
  // 2) no quedar debajo del HUD: si sube demasiado, va bajo los pies
  const hudAbajo = HUD.lista.y + HUD.lista.h + 12;
  if ((y - 16 - cam.y) * view.scale < hudAbajo) y = player.y + 52;
  ctx.save();
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = 'rgba(20,28,20,0.82)';
  rr(x0, y - 16, w, 32, 15); ctx.fill();
  texto(txt, player.x, y + 1, 17, '#ffffff', 'center', true);
  ctx.restore();
}

/* ---------------------------------- HUD ---------------------------------- */
function pill(x, y, w, h, r, alpha) {
  ctx.fillStyle = 'rgba(16,26,18,' + (alpha === undefined ? 0.72 : alpha) + ')';
  rr(x, y, w, h, r); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 2;
  rr(x, y, w, h, r); ctx.stroke();
}

function botonHUD(b, icono) {
  pill(b.x, b.y, b.s, b.s, 12, 0.66);
  emoji(icono, b.x + b.s / 2, b.y + b.s / 2 + 1, Math.round(b.s * 0.5));
}

function dibujarFilaReto(fila, item) {
  const k = HUD.k, r = item.r;
  const val = r.prog(state);
  const prog = clamp(val / r.meta, 0, 1);
  const casi = prog >= 0.9 && prog < 1;
  pill(fila.x, fila.y, fila.w, fila.h, 10 * k, 0.7);
  const icono = item.tipo === 'c' ? '🎯' : (item.tipo === 'o' ? '⭐' : '📅');
  emoji(icono, fila.x + 15 * k, fila.y + fila.h / 2, 13 * k);
  const cnt = Math.min(Math.floor(val), r.meta) + '/' + r.meta;
  const wCnt = anchoTexto(cnt, 11 * k, true);
  const bx = fila.x + 27 * k;
  const bw = fila.w - 27 * k - wCnt - 16 * k;
  texto(textoCorto(textoReto(r), bw, 12 * k, true), bx, fila.y + fila.h * 0.33, 12 * k, '#ffffff', 'left', true);
  const by = fila.y + fila.h * 0.72, bh = 7 * k;
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  rr(bx, by - bh / 2, bw, bh, bh / 2); ctx.fill();
  ctx.fillStyle = (casi && Math.sin(tiempo * 8) > 0) ? '#c9ffc4' : '#5ee06a';
  rr(bx, by - bh / 2, Math.max(4, bw * prog), bh, bh / 2); ctx.fill();
  texto(cnt, fila.x + fila.w - 8 * k, fila.y + fila.h / 2, 11 * k, 'rgba(255,255,255,0.92)', 'right', true);
}

function dibujarHUD() {
  const k = HUD.k, top = HUD.top, H = HUD.h;

  // Dinero
  const txtDinero = '$' + Math.floor(state.dinero);
  const wD = Math.max(100 * k, anchoTexto(txtDinero, 20 * k, true) + 56 * k);
  pill(12, top, wD, H, 20 * k);
  emoji('💰', 22, top + H / 2 + 1, 20 * k, 'left');
  texto(txtDinero, 48 * k, top + H / 2, 20 * k, '#ffe27a', 'left', true);

  // Racha de venta: ficha naranja junto al dinero + barra de gracia
  const mult = comboMult();
  if (combo.n > 0 && mult > 1) {
    const tx = '×' + mult;
    const wc = anchoTexto(tx, 16 * k, true) + 20 * k;
    const cx2 = 12 + wD + 6;
    const late = 1 + Math.max(0, 0.14 - combo.t) * 1.1;
    ctx.save();
    ctx.translate(cx2 + wc / 2, top + H / 2);
    ctx.scale(late, late);
    ctx.fillStyle = 'rgba(255,176,31,0.96)';
    rr(-wc / 2, -(H - 8 * k) / 2, wc, H - 8 * k, 12 * k); ctx.fill();
    texto(tx, 0, -2 * k, 16 * k, '#3a2a05', 'center', true);
    const g = 1 - clamp(combo.t / CONFIG.COMBO_GRACIA, 0, 1);
    ctx.fillStyle = 'rgba(60,40,5,0.55)';
    rr(-wc / 2 + 5, (H - 8 * k) / 2 - 7 * k, wc - 10, 3.5 * k, 2); ctx.fill();
    ctx.fillStyle = '#fff6d8';
    rr(-wc / 2 + 5, (H - 8 * k) / 2 - 7 * k, (wc - 10) * g, 3.5 * k, 2); ctx.fill();
    ctx.restore();
  }

  // Carga
  const txtBag = player.carga.length + '/' + state.capacidad;
  const wB = Math.max(92 * k, anchoTexto(txtBag, 20 * k, true) + 54 * k);
  pill(cw - 12 - wB, top, wB, H, 20 * k);
  emoji('🎒', cw - 12 - wB + 12, top + H / 2 + 1, 20 * k, 'left');
  const lleno = player.carga.length >= state.capacidad;
  texto(txtBag, cw - 12 - wB + 38 * k, top + H / 2, 20 * k, lleno ? '#ff8a8a' : '#ffffff', 'left', true);

  // Banner: durante una oleada manda la oleada
  const b = HUD.banner;
  if (oleada) {
    const urg = 0.5 + 0.5 * Math.sin(tiempo * 6);
    ctx.fillStyle = 'rgba(126,22,22,0.9)';
    rr(b.x, b.y, b.w, b.h, 9 * k); ctx.fill();
    ctx.strokeStyle = 'rgba(255,120,120,' + (0.5 + 0.4 * urg).toFixed(2) + ')';
    ctx.lineWidth = 2;
    rr(b.x, b.y, b.w, b.h, 9 * k); ctx.stroke();
    const seg = Math.max(0, Math.ceil(CONFIG.OLEADA_DURACION - Math.max(0, oleada.t)));
    const izq = oleada.t < 0
      ? t('intento', { a: oleada.intento, b: CONFIG.OLEADA_INTENTOS })
      : t('oleadaHUD', { s: seg });
    const der = t('perdidas', { a: oleada.perdidas, b: CONFIG.OLEADA_MAX_PERDIDAS });
    const wDer2 = anchoTexto(der, 11 * k, true);
    texto(textoCorto(izq, b.w - wDer2 - 24 * k, 12 * k, true), b.x + 10 * k, b.y + b.h / 2,
          12 * k, '#ffd7d7', 'left', true);
    texto(der, b.x + b.w - 10 * k, b.y + b.h / 2, 11 * k,
          oleada.perdidas > CONFIG.OLEADA_MAX_PERDIDAS ? '#ff9a9a' : 'rgba(255,255,255,0.9)', 'right', true);
  } else {
    pill(b.x, b.y, b.w, b.h, 9 * k, 0.72);
    const r = retoActual();
    const cap = r ? t('capitulo', { n: r.cap + 1 }) + ' · ' + t(CAP_NOMBRES[r.cap]) : t('modoLibre');
    const der2 = r ? t('retoDeN', { a: state.retoIdx + 1, b: CAMPANA.length })
                   : t('frutasVendidas', { n: state.ventasTotales });
    const wDer = anchoTexto(der2, 11 * k, true);
    texto(textoCorto(cap, b.w - wDer - 34 * k, 12 * k, true), b.x + 10 * k, b.y + b.h / 2, 12 * k, '#ffe27a', 'left', true);
    texto(der2, b.x + b.w - 20 * k, b.y + b.h / 2, 11 * k, 'rgba(255,255,255,0.8)', 'right', true);
    texto('▾', b.x + b.w - 9 * k, b.y + b.h / 2, 12 * k, 'rgba(255,255,255,0.8)', 'center', true);
  }

  // Tres filas de retos
  const vis = retosVisibles();
  for (let i = 0; i < vis.length && i < HUD.filas.length; i++) dibujarFilaReto(HUD.filas[i], vis[i]);

  // Botones
  botonHUD(HUD.btn.mute, state.mute ? '🔇' : '🔊');
  botonHUD(HUD.btn.idioma, '🌐');
  botonHUD(HUD.btn.share, '📤');
  botonHUD(HUD.btn.reset, '↺');
  texto(LANG.toUpperCase(), HUD.btn.idioma.x + HUD.btn.idioma.s / 2, HUD.btn.idioma.y + HUD.btn.idioma.s - 4,
        9 * k, 'rgba(255,255,255,0.85)', 'center', true);

  // Marco rojo mientras una plaga esté comiendo
  if (hayPlagaComiendo()) {
    const a = 0.16 + 0.14 * (0.5 + 0.5 * Math.sin(tiempo * 5));
    ctx.save();
    ctx.strokeStyle = 'rgba(232,64,64,' + a.toFixed(3) + ')';
    ctx.lineWidth = 10;
    ctx.strokeRect(5, 5, cw - 10, ch - 10);
    ctx.restore();
  }

  dibujarMarcadoresPlaga();

  // Joystick
  if (joy.activo && !panel.abierto) {
    ctx.save();
    ctx.globalAlpha = 0.28; ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, 52, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 0.5; ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, 52, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(joy.kx, joy.ky, 24, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  // Toasts: justo debajo de la lista de retos, nunca sobre las mejoras
  const toastY0 = HUD.lista.y + HUD.lista.h + 6;
  for (let i = 0; i < toasts.length; i++) {
    const to = toasts[i];
    const a = to.t < 0.2 ? to.t / 0.2 : (to.t > 1.9 ? clamp((2.4 - to.t) / 0.5, 0, 1) : 1);
    const w = Math.min(cw - 40, Math.max(anchoTexto(to.txt, 14, true), anchoTexto(to.sub, 13, true)) + 44);
    const y = toastY0 + i * 50;
    ctx.save();
    ctx.globalAlpha = a;
    pill((cw - w) / 2, y, w, 44, 14, 0.86);
    texto(textoCorto(to.txt, w - 24, 14, true), cw / 2, y + (to.sub ? 15 : 22), 14, '#ffffff', 'center', true);
    if (to.sub) texto(to.sub, cw / 2, y + 32, 13, '#7dffa0', 'center', true);
    ctx.restore();
  }

  // Mensaje grande
  if (bigMsg) {
    const tt = bigMsg.t;
    const a = tt < 0.25 ? tt / 0.25 : (tt > 2.1 ? clamp((2.6 - tt) / 0.5, 0, 1) : 1);
    const s = tt < 0.35 ? 0.6 + (tt / 0.35) * 0.45 : 1 + Math.sin(Math.min(tt, 1.4) * 6) * 0.015;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(cw / 2, ch * 0.58);   // bajo los toasts, no encima de ellos
    ctx.scale(s, s);
    const w = Math.min(cw - 20, anchoTexto(bigMsg.txt, 32, true) + 56);
    ctx.fillStyle = 'rgba(16,26,18,0.82)';
    rr(-w / 2, -34, w, 68, 20); ctx.fill();
    texto(bigMsg.txt, 0, 0, 32, '#ffe27a', 'center', true, 6, 'rgba(0,0,0,0.35)');
    ctx.restore();
  }
}

// Flechas en el borde apuntando a plagas fuera de pantalla
function dibujarMarcadoresPlaga() {
  const m = 30;
  for (const p of plagas) {
    if (p.estado === 'huyendo') continue;
    const s = mundoAPantalla(p.x, p.y);
    if (s.x >= 0 && s.x <= cw && s.y >= 0 && s.y <= ch) continue;
    const cx2 = cw / 2, cy2 = ch / 2;
    let dx = s.x - cx2, dy = s.y - cy2;
    const d = Math.hypot(dx, dy) || 1;
    dx /= d; dy /= d;
    const tx = Math.abs(dx) < 1e-4 ? Infinity : Math.abs((cw / 2 - m) / dx);
    const ty = Math.abs(dy) < 1e-4 ? Infinity : Math.abs((ch / 2 - m) / dy);
    const tt = Math.min(tx, ty);
    const ax = cx2 + dx * tt, ay = cy2 + dy * tt;
    const pulso = 0.5 + 0.5 * Math.sin(tiempo * 6);
    ctx.save();
    ctx.translate(ax, ay);
    ctx.globalAlpha = 0.75 + 0.25 * pulso;
    ctx.fillStyle = 'rgba(20,20,24,0.7)';
    circulo(0, 0, 19); ctx.fill();
    ctx.save();
    ctx.rotate(Math.atan2(dy, dx));
    ctx.fillStyle = '#ff5a5a';
    ctx.beginPath();
    ctx.moveTo(24, 0); ctx.lineTo(12, -9); ctx.lineTo(12, 9);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    emoji('🐦', 0, 1, 20);
    ctx.restore();
  }
}

/* ============================== 16. PANEL =============================== */
const CARD_H = 58, CAP_H = 30, NOTA_H = 34;

function itemsPanel() {
  const out = [];
  if (panel.tab === 0) {
    let capAct = -1;
    for (let i = 0; i < CAMPANA.length; i++) {
      const r = CAMPANA[i];
      if (r.cap !== capAct) {
        capAct = r.cap;
        out.push({ tipo: 'cap', txt: t('capitulo', { n: r.cap + 1 }) + ' · ' + t(CAP_NOMBRES[r.cap]) });
      }
      out.push({ tipo: 'reto', r: r, hecho: i < state.retoIdx, actual: i === state.retoIdx, premio: r.premio });
    }
  } else if (panel.tab === 1) {
    for (const r of OPCIONALES) out.push({ tipo: 'reto', r: r, hecho: cumplido(r.id), premio: r.premio });
  } else {
    out.push({ tipo: 'cap', txt: state.diarios.fecha });
    for (let i = 0; i < state.diarios.ids.length; i++) {
      const r = RETO_BY_ID[state.diarios.ids[i]];
      if (r) out.push({ tipo: 'reto', r: r, hecho: diarioCobrado(r.id), premio: PREMIO_DIARIO[i] });
    }
    out.push({ tipo: 'nota', txt: t('sinDiarios') });
  }
  return out;
}

function dibujarPanel() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.fillRect(0, 0, cw, ch);

  ctx.fillStyle = 'rgba(22,34,24,0.98)';
  rr(panel.x, panel.y, panel.w, panel.h, 20); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 2;
  rr(panel.x, panel.y, panel.w, panel.h, 20); ctx.stroke();

  texto(t('retos'), panel.x + 18, panel.y + 26, 19, '#ffe27a', 'left', true);
  pill(panel.cerrar.x, panel.cerrar.y, panel.cerrar.s, panel.cerrar.s, 10, 0.5);
  texto('✕', panel.cerrar.x + panel.cerrar.s / 2, panel.cerrar.y + panel.cerrar.s / 2, 17, '#ffffff', 'center', true);

  // Pestañas
  const tw = panel.w / 3;
  const nombres = [t('campana'), t('opcionales'), t('diarios')];
  for (let i = 0; i < 3; i++) {
    const tx = panel.x + i * tw;
    const act = panel.tab === i;
    ctx.fillStyle = act ? 'rgba(94,224,106,0.22)' : 'rgba(255,255,255,0.05)';
    rr(tx + 3, panel.tabsY, tw - 6, panel.tabH, 10); ctx.fill();
    if (act) {
      ctx.strokeStyle = '#5ee06a'; ctx.lineWidth = 2;
      rr(tx + 3, panel.tabsY, tw - 6, panel.tabH, 10); ctx.stroke();
    }
    texto(textoCorto(nombres[i], tw - 14, 13, true), tx + tw / 2, panel.tabsY + panel.tabH / 2,
          13, act ? '#ffffff' : 'rgba(255,255,255,0.6)', 'center', true);
  }

  // Contenido con recorte y scroll
  const items = itemsPanel();
  let total = 0;
  for (const it of items) total += it.tipo === 'cap' ? CAP_H : (it.tipo === 'nota' ? NOTA_H : CARD_H + 6);
  panel.maxScroll = Math.max(0, total - panel.contH);
  panel.scroll = clamp(panel.scroll, 0, panel.maxScroll);

  ctx.save();
  ctx.beginPath();
  ctx.rect(panel.x + 6, panel.contY, panel.w - 12, panel.contH);
  ctx.clip();
  let y = panel.contY - panel.scroll;
  const x = panel.x + 12, w = panel.w - 24;
  for (const it of items) {
    if (it.tipo === 'cap') {
      if (y + CAP_H > panel.contY - 20 && y < panel.contY + panel.contH + 20) {
        texto(it.txt, x + 2, y + CAP_H / 2 + 2, 13, '#8fe39a', 'left', true);
      }
      y += CAP_H;
    } else if (it.tipo === 'nota') {
      if (y + NOTA_H > panel.contY - 20 && y < panel.contY + panel.contH + 20) {
        texto(it.txt, x + 2, y + NOTA_H / 2, 12, 'rgba(255,255,255,0.55)', 'left', false);
      }
      y += NOTA_H;
    } else {
      if (y + CARD_H > panel.contY - 20 && y < panel.contY + panel.contH + 20) dibujarTarjeta(it, x, y, w);
      y += CARD_H + 6;
    }
  }
  ctx.restore();

  // Barra de scroll
  if (panel.maxScroll > 0) {
    const trackH = panel.contH;
    const h = Math.max(28, trackH * (panel.contH / (panel.contH + panel.maxScroll)));
    const yy = panel.contY + (trackH - h) * (panel.scroll / panel.maxScroll);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    rr(panel.x + panel.w - 9, yy, 4, h, 2); ctx.fill();
  }
  ctx.restore();
}

function dibujarTarjeta(it, x, y, w) {
  const r = it.r;
  const val = r.prog(state);
  const prog = it.hecho ? 1 : clamp(val / r.meta, 0, 1);
  ctx.fillStyle = it.hecho ? 'rgba(94,224,106,0.14)' : 'rgba(255,255,255,0.06)';
  rr(x, y, w, CARD_H, 12); ctx.fill();
  if (it.actual) {
    ctx.strokeStyle = 'rgba(255,226,122,0.75)'; ctx.lineWidth = 2;
    rr(x, y, w, CARD_H, 12); ctx.stroke();
  }
  const wPremio = anchoTexto('+$' + it.premio, 13, true) + 8;
  texto(textoCorto(textoReto(r), w - 30 - wPremio, 13, true), x + 12, y + 17, 13,
        it.hecho ? 'rgba(255,255,255,0.65)' : '#ffffff', 'left', true);
  texto('+$' + it.premio, x + w - 12, y + 17, 13, '#ffe27a', 'right', true);
  const bx = x + 12, bw = w - 24, by = y + 38, bh = 8;
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  rr(bx, by, bw, bh, 4); ctx.fill();
  ctx.fillStyle = it.hecho ? '#5ee06a' : '#4bb7e0';
  rr(bx, by, Math.max(5, bw * prog), bh, 4); ctx.fill();
  const etq = it.hecho ? '✓ ' + t('completado') : Math.min(Math.floor(val), r.meta) + ' / ' + r.meta;
  texto(etq, x + w - 12, y + 50, 11, it.hecho ? '#8fe39a' : 'rgba(255,255,255,0.75)', 'right', true);
}

/* ------------------------------- Diálogo --------------------------------- */
function botonModal(b, etiqueta, primario, activo) {
  const base = primario
    ? (modal.peligro ? [224, 74, 74] : [58, 161, 74])
    : [70, 82, 72];
  const luz = activo ? 22 : 0;
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  rr(b.x, b.y + 3, b.w, b.h, 14); ctx.fill();
  ctx.fillStyle = 'rgb(' + (base[0] + luz) + ',' + (base[1] + luz) + ',' + (base[2] + luz) + ')';
  rr(b.x, b.y, b.w, b.h, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2;
  rr(b.x, b.y, b.w, b.h, 14); ctx.stroke();
  texto(textoCorto(etiqueta, b.w - 16, 15, true), b.x + b.w / 2, b.y + b.h / 2, 15,
        primario ? '#ffffff' : 'rgba(255,255,255,0.9)', 'center', true);
}

function dibujarModal() {
  const a = clamp(modal.t / 0.16, 0, 1);
  const e = 1 - Math.pow(1 - a, 3);          // salida suave
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,' + (0.66 * a).toFixed(3) + ')';
  ctx.fillRect(0, 0, cw, ch);

  ctx.translate(modal.x + modal.w / 2, modal.y + modal.h / 2);
  ctx.scale(0.9 + 0.1 * e, 0.9 + 0.1 * e);
  ctx.translate(-(modal.x + modal.w / 2), -(modal.y + modal.h / 2));
  ctx.globalAlpha = a;

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  rr(modal.x, modal.y + 6, modal.w, modal.h, 22); ctx.fill();
  ctx.fillStyle = 'rgba(24,38,26,0.99)';
  rr(modal.x, modal.y, modal.w, modal.h, 22); ctx.fill();
  ctx.strokeStyle = modal.peligro ? 'rgba(230,90,90,0.55)' : 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 2;
  rr(modal.x, modal.y, modal.w, modal.h, 22); ctx.stroke();

  emoji(modal.peligro ? '⚠️' : '💬', modal.x + modal.w / 2, modal.y + 34, 26);
  texto(textoCorto(modal.tit, modal.w - 36, 19, true), modal.x + modal.w / 2, modal.y + 66, 19,
        modal.peligro ? '#ffb4b4' : '#ffe27a', 'center', true);
  for (let i = 0; i < modal.lineas.length; i++) {
    texto(modal.lineas[i], modal.x + modal.w / 2, modal.y + 96 + i * 21, 14,
          'rgba(255,255,255,0.82)', 'center', false);
  }
  if (modal.no) botonModal(modal.btnNo, modal.no, false, modal.hover === 'no');
  botonModal(modal.btnSi, modal.si, true, modal.hover === 'si');
  ctx.restore();
}

/* ---------------------------- Render completo ---------------------------- */
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#16241a';
  ctx.fillRect(0, 0, cw, ch);
  SIGNOS.length = 0;

  ctx.save();
  ctx.scale(view.scale, view.scale);
  let sx = 0, sy = 0;
  if (cam.shake > 0) { const m = cam.shake * 14; sx = rand(-m, m); sy = rand(-m, m); }
  ctx.translate(-cam.x + sx, -cam.y + sy);

  if (fondo) ctx.drawImage(fondo, 0, 0);
  for (const f of FRUITS) dibujarZona(f);
  dibujarVenta();
  for (const c of circles) dibujarCirculo(c);
  for (const e of espantas) dibujarEspantapajaros(e);

  const drawables = [];
  for (const p of plants) drawables.push({ y: p.y, d: 0, o: p });
  for (const h of helpers) drawables.push({ y: h.y, d: 1, o: h });
  drawables.push({ y: player.y, d: 2, o: player });
  drawables.sort((a, b) => a.y - b.y);
  dibujarCura();
  for (const it of drawables) {
    if (it.d === 0) dibujarPlanta(it.o);
    else if (it.d === 1) {
      dibujarPersonaje(it.o, { camisa: it.o.color, gorra: '#e63946', logo: true });
      if (helpersImpagos) {                       // sin sueldo: parados y marcados
        ctx.save();
        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(tiempo * 4);
        emoji('💸', it.o.x, it.o.y - 78, 20);
        ctx.restore();
      }
    } else dibujarJugador();
  }
  for (const p of plagas) dibujarPlaga(p);

  dibujarParticulas();
  dibujarHint();
  ctx.restore();

  dibujarHUD();
  if (panel.abierto) dibujarPanel();
  if (modal.abierto) dibujarModal();
}

/* =============================== 17. LOOP =============================== */
let tiempo = 0;
let last = 0;

function paso(ts) {
  if (!last) last = ts;
  const msFrame = ts - last;
  let dt = msFrame / 1000;
  last = ts;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, CONFIG.MAX_DT);
  tiempo += dt;
  medirPerf(isFinite(msFrame) && msFrame > 0 ? Math.min(msFrame, 200) : 16);

  revisarDia();
  const inp = inputVector();
  player.update(dt, inp.x, inp.y);
  for (const p of plants) p.update(dt);
  for (const h of helpers) h.update(dt);
  actualizarOleada(dt);
  actualizarPlagas(dt);
  actualizarCirculos(dt);
  cobrarSueldos(dt);

  if (combo.n > 0) {
    combo.t += dt;
    if (combo.t >= CONFIG.COMBO_GRACIA) romperCombo();
  }

  state.sinMarchita += dt;
  state.hoy.sinMarchita += dt;
  if (state.dinero > state.op.saldoMax) state.op.saldoMax = state.dinero;

  actualizarRetos(true);
  revisarMitad();
  actualizarParticulas(dt);
  actualizarCamara(dt);
  if (modal.abierto) modal.t += dt;

  for (const f of FRUITS) {
    if (desbloqueada(f.id) && f._fade > 0) f._fade = Math.max(0, f._fade - dt * 1.4);
  }

  saveTimer += dt;
  if (saveTimer >= CONFIG.SAVE_INTERVAL) { saveTimer = 0; Save.guardar(); }

  render();
  window.requestAnimationFrame(paso);
}

/* ============================= 18. ARRANQUE ============================= */
function registrarSW() {
  try {
    if (location.protocol === 'https:' && navigator.serviceWorker) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (e) {}
}

function iniciar() {
  Save.cargar();
  LANG = state.idioma;
  pintarCredito();
  construirFondo();
  reconstruirMundo();
  actualizarRetos(false);          // reconcilia saves viejos sin fiesta
  for (const f of FRUITS) f._fade = desbloqueada(f.id) ? 0 : 1;
  resize();
  const o = objetivoCamara();
  cam.x = o.x; cam.y = o.y;
  registrarSW();
  window.requestAnimationFrame(paso);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') Save.guardar();
});
window.addEventListener('pagehide', () => Save.guardar());
window.addEventListener('pointerdown', () => SFX.resume(), { once: true });

/* ============================ 19. API DE CONSOLA ======================== */
const game = {
  get state() { return state; },
  get player() { return player; },
  get plants() { return plants; },
  get helpers() { return helpers; },
  get plagas() { return plagas; },
  get combo() { return { n: combo.n, t: combo.t, mult: comboMult() }; },
  get oleada() { return oleada; },
  get impagos() { return helpersImpagos; },
  sueldo() { return sueldoPorMinuto(); },
  lanzarOleada(cap) { iniciarOleada(cap === undefined ? capituloActual() : cap, 1); return oleada; },
  marchitar(i) { const p = plants[i || 0]; if (p) marchitar(p, true); return !!p; },
  CONFIG, FRUITS, CAMPANA, OPCIONALES, DIARIOS, circles, I18N, t,
  dinero(n) {
    const v = Number(n) || 0;
    state.dinero += v;
    if (v > 0) { state.dineroTotal += v; state.hoy.dinero += v; }
    Save.guardar();
    return Math.floor(state.dinero);
  },
  desbloquear(id) { desbloquearZona(id, true); Save.guardar(); },
  spawnPlaga() {
    const o = elegirObjetivoPlaga();
    if (o) { plagas.push(new Plaga(o)); return true; }
    return false;
  },
  completarReto(id) {
    const r = RETO_BY_ID[id];
    if (!r) return false;
    const i = CAMPANA.indexOf(r);
    if (i >= 0) { state.retoIdx = Math.max(state.retoIdx, i); }
    if (!cumplido(id)) state.cumplidos.push(id);
    Save.guardar();
    return true;
  },
  idioma(l) { if (IDIOMAS.indexOf(l) >= 0) { LANG = l; state.idioma = l; anchosCache = Object.create(null); pintarCredito(); Save.guardar(); } return LANG; },
  get modal() {
    return modal.abierto
      ? { tit: modal.tit, txt: modal.txt, si: modal.si, no: modal.no, btnSi: modal.btnSi, btnNo: modal.btnNo }
      : null;
  },
  dialogo(cfg) { abrirModal(cfg || { tit: 'Kiosa', txt: '...', si: 'OK' }); return true; },
  calidad(c) { if (['auto', 'bajo', 'alto'].indexOf(c) >= 0) { state.calidad = c; resize(); Save.guardar(); } return state.calidad; },
  fps() { return Math.round(1000 / Math.max(1, perf.ms)); },
  guardar() { Save.guardar(); },
  reiniciar() { reiniciando = true; Save.borrar(); window.location.reload(); }
};
window.game = game;

iniciar();
</script>
