  } catch (e) { return 'es'; }
}

function t(k, p) {

  if (s === undefined) return k;
  if (p) for (const key in p) s = s.split('{' + key + '}').join(p[key]);
  return s;
}

// Fecha local YYYY-MM-DD, semilla de los diarios
function fechaHoy() {
  const d = new Date();
  const m = ('0' + (d.getMonth() + 1)).slice(-2);
  const dd = ('0' + d.getDate()).slice(-2);
  return d.getFullYear() + '-' + m + '-' + dd;
}

// Tres diarios distintos, deterministas a partir de la fecha
function diariosDeHoy(fecha) {
  let h = 2166136261;
  for (let i = 0; i < fecha.length; i++) {
    h ^= fecha.charCodeAt(i);
    h = (h * 16777619) >>> 0;
  }
  const pool = DIARIOS.map(d => d.id);
  const out = [];
  for (let i = 0; i < 3 && pool.length; i++) {
    h = (h * 1103515245 + 12345) >>> 0;
    out.push(pool.splice(h % pool.length, 1)[0]);
  }
  return out;
}

  const h = (seg / 3600) | 0, m = ((seg % 3600) / 60) | 0, s = seg % 60;
  const dd = n => (n < 10 ? '0' : '') + n;
  return h > 0 ? h + ':' + dd(m) + ':' + dd(s) : m + ':' + dd(s);
}

/* -------------------------- Récords (tiempos) ----------------------------
   Viven en una clave APARTE del save principal a propósito: reiniciar la
   partida (Save.borrar) no debe borrar la tabla de mejores tiempos. */
const RECORDS_KEY = 'kiosaImperio.records';
const NOMBRE_KEY = 'kiosaImperio.nombre';
const RECORDS_MAX = 10;

function cargarRecords() {
  if (!Save.disponible) return [];
  try {
    const raw = window.localStorage.getItem(RECORDS_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    return arr
      .filter(r => r && typeof r.nombre === 'string' && num(r.segundos, 0) > 0)
      .map(r => ({ nombre: r.nombre.slice(0, 14) || '???', segundos: Math.floor(num(r.segundos, 0)) }))
      .sort((a, b) => a.segundos - b.segundos)
      .slice(0, RECORDS_MAX);
  } catch (e) { return []; }
}

function agregarRecord(nombre, segundos) {
  if (!Save.disponible) return { lista: [], puesto: -1 };
  const limpio = String(nombre || '').trim().slice(0, 14) || 'Jugador';
  try { window.localStorage.setItem(NOMBRE_KEY, limpio); } catch (e) {}
  const lista = cargarRecords();
  lista.push({ nombre: limpio, segundos: Math.max(1, Math.floor(segundos)) });
  lista.sort((a, b) => a.segundos - b.segundos);
  const recortada = lista.slice(0, RECORDS_MAX);
  try { window.localStorage.setItem(RECORDS_KEY, JSON.stringify(recortada)); } catch (e) {}
  const puesto = recortada.findIndex(r => r.nombre === limpio && r.segundos === Math.max(1, Math.floor(segundos)));
  return { lista: recortada, puesto: puesto };
}

function nombreGuardado() {
  if (!Save.disponible) return '';
  try { return window.localStorage.getItem(NOMBRE_KEY) || ''; } catch (e) { return ''; }
}
function hacia(v, obj, paso) { return v < obj ? Math.min(obj, v + paso) : Math.max(obj, v - paso); }

// El ciclo de piernas avanza con la DISTANCIA recorrida, no con el reloj:
// así el pie coincide con el suelo y el personaje deja de patinar.
function avanzarPaso(e, dist, largo) {
  e.phase += dist / (largo || CONFIG.PASO_LARGO) * Math.PI;
}

/* =============================== 6. SAVE ================================
   Clave versionada, saneo de cada campo al cargar y migración desde v1.
   ======================================================================== */
const Save = {
  disponible: (function () {
    try {
      const k = '__kiosa_test__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  })(),

  guardar() {
    if (!this.disponible || reiniciando) return;
    try {
      window.localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify({
        v: CONFIG.SAVE_VERSION,
        dinero: state.dinero, dineroTotal: state.dineroTotal,
        ventasTotales: state.ventasTotales, ventasPorFruta: state.ventasPorFruta,
        recolectadas: state.recolectadas, plagasEspantadas: state.plagasEspantadas,
        capacidad: state.capacidad, compras: state.compras, arboles: state.arboles,
        arbolesUsados: state.arbolesUsados,
        espantaZonas: state.espantaZonas, ayudantes: state.ayudantes,
        retoIdx: state.retoIdx, cumplidos: state.cumplidos,
        oleadasHechas: state.oleadasHechas, curadas: state.curadas,
        estanteTrays: state.estanteTrays, reputacion: state.reputacion,
        servidos: state.servidos, enojados: state.enojados, terminado: state.terminado,
        tiempoJuego: state.tiempoJuego,
        tropiezos: state.tropiezos, robadas: state.robadas, recogidas: state.recogidas,
        diarios: state.diarios, hoy: state.hoy, sinMarchita: state.sinMarchita,
        op: state.op, pagos: state.pagos, hints: state.hints,
        mute: state.mute, hudExp: state.hudExp, idioma: state.idioma, calidad: state.calidad,
        desbloqueadas: state.desbloqueadas
      }));
    } catch (e) {}
  },

  cargar() {
    if (!this.disponible) return false;
    let raw = null;
    try { raw = window.localStorage.getItem(CONFIG.SAVE_KEY); } catch (e) { return false; }
    if (!raw) return this.migrarV1();
    let d = null;
    try { d = JSON.parse(raw); } catch (e) { d = null; }
    if (!d || typeof d !== 'object' || d.v !== CONFIG.SAVE_VERSION) { this.borrar(); return false; }
    try {
      const s = estadoNuevo();
      s.dinero = Math.max(0, num(d.dinero, 0));
      s.dineroTotal = Math.max(0, num(d.dineroTotal, 0));
      s.ventasTotales = Math.max(0, num(d.ventasTotales, 0) | 0);
      s.recolectadas = Math.max(0, num(d.recolectadas, 0) | 0);
      s.plagasEspantadas = Math.max(0, num(d.plagasEspantadas, 0) | 0);
      s.capacidad = clamp(num(d.capacidad, CONFIG.CAP_START) | 0, CONFIG.CAP_START, CONFIG.CAP_MAX);
      s.ayudantes = clamp(num(d.ayudantes, 0) | 0, 0, CONFIG.AYUDANTE_MAX);
      s.retoIdx = clamp(num(d.retoIdx, 0) | 0, 0, CAMPANA.length);
      s.sinMarchita = Math.max(0, num(d.sinMarchita, 0));
      s.mute = !!d.mute;
      s.hudExp = !!d.hudExp;
      s.idioma = IDIOMAS.indexOf(d.idioma) >= 0 ? d.idioma : detectarIdioma();
      s.calidad = ['auto', 'bajo', 'alto'].indexOf(d.calidad) >= 0 ? d.calidad : 'auto';

      if (d.ventasPorFruta && typeof d.ventasPorFruta === 'object') {
        for (const f of FRUITS) s.ventasPorFruta[f.id] = Math.max(0, num(d.ventasPorFruta[f.id], 0) | 0);
      }
      if (d.compras && typeof d.compras === 'object') {
        s.compras.arbol = Math.max(0, num(d.compras.arbol, 0) | 0);
        s.compras.mochila = Math.max(0, num(d.compras.mochila, 0) | 0);
        s.compras.riego = clamp(num(d.compras.riego, 0) | 0, 0, CONFIG.RIEGO_MAX);
        s.compras.espanta = clamp(num(d.compras.espanta, 0) | 0, 0, CONFIG.ESPANTA_MAX);
        s.compras.puesto = clamp(num(d.compras.puesto, 0) | 0, 0, CONFIG.PUESTO_MAX);
      }
      if (d.arboles && typeof d.arboles === 'object') {
        // Formato nuevo: un booleano por cupo (base + extra), ya con posibles muertes
        for (const f of FRUITS) {
          const arr = d.arboles[f.id];
          if (Array.isArray(arr)) s.arboles[f.id] = f.todasPos.map((_, i) => !!arr[i]);
        }
        if (d.arbolesUsados && typeof d.arbolesUsados === 'object') {
          for (const f of FRUITS) {
            const arr = d.arbolesUsados[f.id];
            if (Array.isArray(arr)) s.arbolesUsados[f.id] = f.todasPos.map((_, i) => !!arr[i]);
          }
        }
      } else if (d.extras && typeof d.extras === 'object') {
        // Save viejo (antes de que los árboles costaran dinero): todos los cupos
        // base ya estaban plantados gratis; se conservan tal cual para no
        // quitarle árboles a nadie que ya los tenía. Al ser árboles que ya
        // existían, si más adelante mueren cuentan como "replantar" (barato).
        for (const f of FRUITS) {
          const nExtra = clamp(num(d.extras[f.id], 0) | 0, 0, f.posicionesExtra.length);
          s.arboles[f.id] = f.todasPos.map((_, i) => i < f.posiciones.length + nExtra);
          s.arbolesUsados[f.id] = s.arboles[f.id].slice();
        }
      }
      if (Array.isArray(d.espantaZonas)) {
        s.espantaZonas = d.espantaZonas.filter(id => !!FRUIT_BY_ID[id]).slice(0, CONFIG.ESPANTA_MAX);
      }
      if (Array.isArray(d.cumplidos)) s.cumplidos = d.cumplidos.filter(id => !!RETO_BY_ID[id]);
      if (Array.isArray(d.oleadasHechas)) {
        s.oleadasHechas = d.oleadasHechas
          .map(n => num(n, -1) | 0)
          .filter(n => n >= 0 && n < CAP_NOMBRES.length);
      }
      s.curadas = Math.max(0, num(d.curadas, 0) | 0);
      s.servidos = Math.max(0, num(d.servidos, 0) | 0);
      s.enojados = Math.max(0, num(d.enojados, 0) | 0);
      s.tropiezos = Math.max(0, num(d.tropiezos, 0) | 0);
      s.robadas = Math.max(0, num(d.robadas, 0) | 0);
      s.recogidas = Math.max(0, num(d.recogidas, 0) | 0);
      s.terminado = !!d.terminado;
      s.tiempoJuego = Math.max(0, num(d.tiempoJuego, 0));
      s.reputacion = clamp(num(d.reputacion, CONFIG.REP_INICIAL), 0, CONFIG.REP_MAX);
      if (d.pagos && typeof d.pagos === 'object') {
        for (const k in s.pagos) s.pagos[k] = Math.max(0, num(d.pagos[k], 0));
      }
      if (d.hints && typeof d.hints === 'object') {
        for (const k in s.hints) s.hints[k] = !!d.hints[k];
      }
      if (d.op && typeof d.op === 'object') {
        s.op.mochilaFull = num(d.op.mochilaFull, 0) ? 1 : 0;
        s.op.racha3 = num(d.op.racha3, 0) ? 1 : 0;
        s.op.saldoMax = Math.max(0, num(d.op.saldoMax, 0));
      }
      if (Array.isArray(d.desbloqueadas)) {
        const val = d.desbloqueadas.filter(id => !!FRUIT_BY_ID[id]);
        s.desbloqueadas = val.length ? val : estadoNuevo().desbloqueadas;
      }
      // Bandejas: si viene un save viejo (array plano), se reparte por fruta;
      // si no, se sanea contra el cupo real de cada bandeja en esta partida.
      state = s;                      // trayCap() lee de `state`, hace falta apuntar ya
      if (Array.isArray(d.estante)) {
        d.estante.forEach(id => { if (FRUIT_BY_ID[id]) s.estanteTrays[id] = Math.min(trayCap(id), (s.estanteTrays[id] || 0) + 1); });
      } else if (d.estanteTrays && typeof d.estanteTrays === 'object') {
        for (const f of FRUITS) s.estanteTrays[f.id] = clamp(num(d.estanteTrays[f.id], 0) | 0, 0, trayCap(f.id));
      }
      // Diarios y contadores de hoy: se reinician si cambió el día
      const hoy = fechaHoy();
      if (d.diarios && typeof d.diarios === 'object' && d.diarios.fecha === hoy && Array.isArray(d.diarios.ids)) {
        s.diarios = {
          fecha: hoy,
          ids: d.diarios.ids.filter(id => !!RETO_BY_ID[id]).slice(0, 3),
          cobrados: Array.isArray(d.diarios.cobrados) ? d.diarios.cobrados.filter(id => !!RETO_BY_ID[id]) : []
        };
        if (s.diarios.ids.length < 3) s.diarios.ids = diariosDeHoy(hoy);
      } else {
        s.diarios = { fecha: hoy, ids: diariosDeHoy(hoy), cobrados: [] };
      }
      if (d.hoy && typeof d.hoy === 'object' && d.hoy.fecha === hoy) {
        s.hoy = estadoHoyNuevo();
        s.hoy.ventas = Math.max(0, num(d.hoy.ventas, 0) | 0);
        s.hoy.plagas = Math.max(0, num(d.hoy.plagas, 0) | 0);
        s.hoy.dinero = Math.max(0, num(d.hoy.dinero, 0));
        s.hoy.cosechas = Math.max(0, num(d.hoy.cosechas, 0) | 0);
        s.hoy.compras = Math.max(0, num(d.hoy.compras, 0) | 0);
        s.hoy.llenadas = Math.max(0, num(d.hoy.llenadas, 0) | 0);
        s.hoy.sinMarchita = Math.max(0, num(d.hoy.sinMarchita, 0));
        if (d.hoy.porFruta && typeof d.hoy.porFruta === 'object') {
          for (const f of FRUITS) s.hoy.porFruta[f.id] = Math.max(0, num(d.hoy.porFruta[f.id], 0) | 0);
        }
      }
      state = s;
      LANG = s.idioma;
      return true;
    } catch (e) { this.borrar(); return false; }
  },

  // Rescata el progreso de quien ya jugó la v1
  migrarV1() {
    let raw = null;
    try { raw = window.localStorage.getItem(CONFIG.SAVE_KEY_V1); } catch (e) { return false; }
    if (!raw) return false;
    let d = null;
    try { d = JSON.parse(raw); } catch (e) { d = null; }
    if (!d || typeof d !== 'object') { try { window.localStorage.removeItem(CONFIG.SAVE_KEY_V1); } catch (e) {} return false; }
    try {
      const s = estadoNuevo();
      s.dinero = Math.max(0, num(d.dinero, 0));
      s.dineroTotal = Math.max(0, num(d.dineroTotal, 0));
      s.ventasTotales = Math.max(0, num(d.ventasTotales, 0) | 0);
      s.recolectadas = Math.max(0, num(d.recolectadas, 0) | 0);
      s.capacidad = clamp(num(d.capacidad, CONFIG.CAP_START) | 0, CONFIG.CAP_START, CONFIG.CAP_MAX);
      s.ayudantes = clamp(num(d.ayudantes, 0) | 0, 0, CONFIG.AYUDANTE_MAX);
      if (d.ventasPorFruta && typeof d.ventasPorFruta === 'object') {
        for (const f of FRUITS) s.ventasPorFruta[f.id] = Math.max(0, num(d.ventasPorFruta[f.id], 0) | 0);
      }
      if (d.compras && typeof d.compras === 'object') {
        s.compras.arbol = Math.max(0, num(d.compras.arbol, 0) | 0);
        s.compras.mochila = Math.max(0, num(d.compras.mochila, 0) | 0);
      }
      if (d.extras && typeof d.extras === 'object') {
        for (const f of FRUITS) {
          const nExtra = clamp(num(d.extras[f.id], 0) | 0, 0, f.posicionesExtra.length);
          s.arboles[f.id] = f.todasPos.map((_, i) => i < f.posiciones.length + nExtra);
          s.arbolesUsados[f.id] = s.arboles[f.id].slice();
        }
      }
      if (Array.isArray(d.desbloqueadas)) {
        const val = d.desbloqueadas.filter(id => !!FRUIT_BY_ID[id]);
        if (val.length) s.desbloqueadas = val;
      }
      state = s;
      LANG = s.idioma;
      try { window.localStorage.removeItem(CONFIG.SAVE_KEY_V1); } catch (e) {}
      this.guardar();
      return true;
    } catch (e) { return false; }
  },

  borrar() {
    if (!this.disponible) return;
    try { window.localStorage.removeItem(CONFIG.SAVE_KEY); } catch (e) {}
    try { window.localStorage.removeItem(CONFIG.SAVE_KEY_V1); } catch (e) {}
  }
};

/* =============================== 7. SFX ================================= */
const SFX = {
  ac: null,
  init() {
    if (this.ac) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ac = new AC();
    } catch (e) { this.ac = null; }
  },
  resume() {
    this.init();
    if (this.ac && this.ac.state === 'suspended') { try { this.ac.resume(); } catch (e) {} }
  },
  tono(freq, dur, tipo, vol, delay) {
    if (!this.ac || state.mute) return;
    try {
      const t0 = this.ac.currentTime + (delay || 0);
      const o = this.ac.createOscillator();
      const g = this.ac.createGain();
      o.type = tipo || 'triangle';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol || 0.16, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(this.ac.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e) {}
  },
  pop() { this.tono(500 + Math.random() * 280, 0.11, 'triangle', 0.15); },
  chaching() {
    this.tono(988, 0.09, 'square', 0.09);
    this.tono(1319, 0.22, 'square', 0.09, 0.07);
  },
  fanfarria() {
    [523, 659, 784, 1047].forEach((f, i) => this.tono(f, 0.24, 'triangle', 0.13, i * 0.095));
  },
  alerta() {                     // plaga aterrizando: dos notas descendentes
    this.tono(392, 0.10, 'sawtooth', 0.07);
    this.tono(294, 0.16, 'sawtooth', 0.07, 0.09);
  },
  aleteo() { this.tono(180 + Math.random() * 60, 0.13, 'sawtooth', 0.06); },
  perdida() {                    // se muere un árbol: dos notas graves y tristes
    this.tono(220, 0.20, 'sawtooth', 0.09);
    this.tono(165, 0.30, 'sawtooth', 0.09, 0.12);
  }
};

/* ============================ 8. ENTIDADES ============================== */
class Plant {
  constructor(fruit, x, y, popInicial, slotIdx) {
    this.fruit = fruit;
    this.x = x; this.y = y;
    this.slotIdx = slotIdx;
    this.frutas = CONFIG.PLANT_MAX_FRUIT;
    this.regen = 0;
    this.marchita = 0;
    this.contagio = 0;
    this.pop = popInicial ? 1 : 0;
    this.seed = Math.random() * Math.PI * 2;
    this.muerta = false;
  }
  get regenTiempo() {
    return CONFIG.REGEN_NIVELES[clamp(state.compras.riego, 0, CONFIG.REGEN_NIVELES.length - 1)];
  }
  update(dt) {
    if (this.marchita > 0) {
      this.marchita = Math.max(0, this.marchita - dt);
      this.regen = 0;
      // Si la plaga se queda hasta agotar el tiempo sin que la cures, el árbol muere
      if (this.marchita <= 0) { this.morir(); return; }
      // La marchitez se contagia a la vecina más cercana si no la curas
      if (contagioActivo()) {
        this.contagio += dt;
        if (this.contagio >= CONFIG.CONTAGIO_INTERVALO) { this.contagio = 0; contagiarDesde(this); }
      }
    } else if (this.frutas < CONFIG.PLANT_MAX_FRUIT) {
      this.regen += dt;
      if (this.regen >= this.regenTiempo) { this.regen = 0; this.frutas++; this.pop = 0.6; }
    } else this.regen = 0;
    if (this.pop > 0) this.pop = Math.max(0, this.pop - dt * 3.2);
  }
  morir() {
    this.muerta = true;
    const vivos = state.arboles[this.fruit.id];
    if (vivos) vivos[this.slotIdx] = false;
  }
  tomar() {
    if (this.frutas <= 0) return null;
    this.frutas--;
    this.pop = 1;
    return this.fruit.id;
  }
}

class Player {
  constructor() {
    this.x = 360; this.y = 360;
    this.carga = [];
    this.facing = 1;
    this.phase = 0;
    this.moving = false;
    this.harvestT = 0;
    this.sellT = 0;
    this.swayT = 0;
    this.fullRun = false;
    this.eraLleno = false;
    this.curaT = 0;
    this.curando = null;
    this.aturdido = 0;
    this.bacheActual = null;
    this.vx = 0; this.vy = 0; this.vel = 0; this.inclina = 0;
  }
  get factorVel() {
    return Math.max(CONFIG.SPEED_MIN_FACTOR, 1 - CONFIG.SPEED_PENALTY_PER_FRUIT * this.carga.length);
  }
  update(dt, ix, iy) {
    if (this.aturdido > 0) { this.aturdido = Math.max(0, this.aturdido - dt); ix = 0; iy = 0; }
    const mag = Math.hypot(ix, iy);
    const hayInput = mag > 0.06;
    const spMax = CONFIG.PLAYER_SPEED * this.factorVel;
    let tx = 0, ty = 0;
    if (hayInput) {
      const f = spMax * Math.min(1, mag);
      tx = ix / mag * f; ty = iy / mag * f;
    }
    // Arranca y frena con inercia; cargado pesa más y tarda más en responder
    const lastre = 0.55 + 0.45 * this.factorVel;
    const acel = (hayInput ? CONFIG.PLAYER_ACEL * lastre : CONFIG.PLAYER_FRENO) * dt;
    this.vx = hacia(this.vx, tx, acel);
    this.vy = hacia(this.vy, ty, acel);
    const dx = this.vx * dt, dy = this.vy * dt;
    this.x += dx;
    this.y += dy;
    this.vel = Math.hypot(this.vx, this.vy);
    this.moving = this.vel > 8;
    if (Math.abs(this.vx) > 14) this.facing = this.vx > 0 ? 1 : -1;
    if (this.moving) {
      avanzarPaso(this, Math.hypot(dx, dy));
      this.swayT += dt * (2 + this.vel * 0.035);
    } else {
      this.phase = lerp(this.phase, Math.round(this.phase / Math.PI) * Math.PI, Math.min(1, dt * 12));
      this.swayT += dt * 2;
    }
    // se inclina hacia donde corre
    this.inclina = lerp(this.inclina, clamp(this.vx / Math.max(1, spMax), -1, 1) * CONFIG.INCLINA_MAX,
                        Math.min(1, dt * 8));
    const px = this.x, py = this.y;
    this.x = clamp(this.x, 22, WORLD_W - 22);
    this.y = clamp(this.y, 30, WORLD_H - 24);
    if (this.x !== px) this.vx = 0;          // pegado al borde no se sigue "empujando"
    if (this.y !== py) this.vy = 0;

    // ---- Baches: cruzarlos cargado te tira la fruta ----
    const b = bacheEn(this.x, this.y);
    if (b) {
      if (b !== this.bacheActual) {
        this.bacheActual = b;
        if (this.carga.length > 0 && this.aturdido <= 0 && Math.random() < probTropiezo(this.carga.length)) {
          tropezar(this);
        }
      }
    } else this.bacheActual = null;

    // ---- Recoger la fruta que se cayó ----
    for (let i = sueloFrutas.length - 1; i >= 0 && this.carga.length < state.capacidad; i--) {
      const f = sueloFrutas[i];
      if (f.t < CONFIG.FRUTA_SUELO_ESPERA) continue;      // deja que asiente
      if (Math.hypot(f.x - this.x, f.y - this.y) <= CONFIG.FRUTA_SUELO_RADIO) {
        this.carga.push(f.id);
        sueloFrutas.splice(i, 1);
        state.recogidas++;
        SFX.pop();
      }
    }

    // ---- Cosecha por proximidad ----
    if (this.carga.length < state.capacidad) {
      this.harvestT += dt;
      if (this.harvestT >= CONFIG.HARVEST_INTERVAL) {
        const p = plantaCercanaConFruta(this.x, this.y, CONFIG.HARVEST_RADIUS);
        if (p) {
          this.harvestT = 0;
          const id = p.tomar();
          if (id) {
            this.carga.push(id);
            state.recolectadas++;
            state.hoy.cosechas++;
            state.hints.caminar = true;
            this.fullRun = false;
            SFX.pop();
          }
        } else this.harvestT = CONFIG.HARVEST_INTERVAL;
      }
    } else this.harvestT = 0;

    // ---- Curar una planta marchita quedándote cerca ----
    const enferma = plantaMarchitaCercana(this.x, this.y, CONFIG.CURA_RADIO);
    this.curando = enferma;
    if (enferma) {
      this.curaT += dt;
      if (this.curaT >= CONFIG.CURA_TIEMPO) {
        this.curaT = 0;
        enferma.marchita = 0;
        enferma.contagio = 0;
        enferma.pop = 1;
        state.curadas++;
        lanzarConfeti(enferma.x, enferma.y - 30, 12);
        floats.push({ x: enferma.x, y: enferma.y - 46, t: 0, txt: t('curado'), color: '#7dffa0' });
        SFX.pop();
      }
    } else this.curaT = 0;

    // Mochila llena: cuenta el llenado una sola vez por ciclo
    const lleno = this.carga.length >= state.capacidad;
    if (lleno && !this.eraLleno) { state.hoy.llenadas++; this.fullRun = true; }
    this.eraLleno = lleno;

    // ---- Surtir el puesto por proximidad (ya no vendes tú) ----
    // Cada fruta va a SU bandeja: si la tuya está llena, se busca en la pila
    // la siguiente que sí quepa en vez de bloquear todo el descargue.
    if (enVenta(this.x, this.y) && this.carga.length > 0 && !estanteLleno()) {
      this.sellT += dt;
      while (this.sellT >= CONFIG.SELL_INTERVAL && this.carga.length > 0) {
        let idx = -1;
        for (let i = this.carga.length - 1; i >= 0; i--) {
          if (!trayLleno(this.carga[i])) { idx = i; break; }
        }
        if (idx < 0) break;
        this.sellT -= CONFIG.SELL_INTERVAL;
        depositar(this.carga.splice(idx, 1)[0]);
        SFX.pop();
        if (this.carga.length === 0 && this.fullRun) { state.op.mochilaFull = 1; this.fullRun = false; }
      }
    } else this.sellT = 0;
  }
}

class Helper {
  constructor(idx) {
    this.idx = idx;
    this.color = CONFIG.HELPER_COLOR;
    this.x = SELL.cx + (idx - 1) * 56;
    this.y = SELL.cy + 30;
    this.carga = [];
    this.modo = 'cosechar';
    this.t = 0;
    this.phase = Math.random() * 6.28;
    this.facing = 1;
    this.moving = false;
    this.target = null;
    this.swayT = Math.random() * 6.28;
  }
  irHacia(tx, ty, dt) {
    const dx = tx - this.x, dy = ty - this.y;
    const d = Math.hypot(dx, dy);
    const sp = CONFIG.PLAYER_SPEED * CONFIG.HELPER_SPEED_FACTOR;
    if (d > 3) {
      const f = Math.min(1, sp * dt / d);
      const mx = dx * f, my = dy * f;
      this.x += mx; this.y += my;
      if (Math.abs(dx) > 0.6) this.facing = dx > 0 ? 1 : -1;
      avanzarPaso(this, Math.hypot(mx, my));
      this.inclina = lerp(this.inclina || 0, (dx > 0 ? 1 : -1) * CONFIG.INCLINA_MAX * 0.7, Math.min(1, dt * 6));
      this.moving = true;
    } else {
      this.moving = false;
      this.inclina = lerp(this.inclina || 0, 0, Math.min(1, dt * 8));
    }
    return d;
  }
  update(dt) {
    this.swayT += dt * (this.moving ? 6 : 2);
    if (helpersImpagos) { this.moving = false; return; }   // sin sueldo no trabajan
    if (this.modo === 'cosechar') {
      if (this.carga.length >= CONFIG.HELPER_CAP) { this.modo = 'vender'; this.t = 0; return; }
      if (!this.target || this.target.frutas <= 0 || plants.indexOf(this.target) < 0) {
        // Prioriza la fruta con la bandeja más vacía; si no hay ninguna lista
        // de esa (regenerando), va por cualquier otra en vez de quedarse quieto.
        const necesaria = frutaMasNecesitada();
        this.target = (necesaria && plantaCercanaDeFruta(this.x, this.y, necesaria))
                    || plantaCercanaConFruta(this.x, this.y, Infinity);
      }
      if (!this.target) {
        this.moving = false;
        if (this.carga.length > 0) { this.modo = 'vender'; this.t = 0; }
        return;
      }
      const d = this.irHacia(this.target.x, this.target.y + 6, dt);
      if (d < CONFIG.HARVEST_RADIUS * 0.75) {
        this.t += dt;
        if (this.t >= CONFIG.HELPER_HARVEST_INTERVAL) {
          this.t = 0;
          const id = this.target.tomar();
          if (id) { this.carga.push(id); state.recolectadas++; state.hoy.cosechas++; SFX.pop(); }
          else this.target = null;
        }
      }
    } else {
      this.irHacia(SELL.cx, SELL.cy, dt);
      if (enVenta(this.x, this.y)) {
        this.moving = false;
        this.t += dt;
        if (this.t >= CONFIG.HELPER_SELL_INTERVAL) {
          this.t = 0;
          let idx = -1;
          for (let i = this.carga.length - 1; i >= 0; i--) {
            if (!trayLleno(this.carga[i])) { idx = i; break; }
          }
          if (idx >= 0) depositar(this.carga.splice(idx, 1)[0]);
          if (this.carga.length === 0 || idx < 0) { this.modo = 'cosechar'; this.target = null; }
        }
      }
    }
  }
}

/* ------------------------------- Plagas ---------------------------------- */
class Plaga {
  constructor(target) {
    this.target = target;
    // entra desde el borde más cercano a su objetivo
    const lado = (Math.random() * 4) | 0;
    if (lado === 0)      { this.x = rand(40, WORLD_W - 40); this.y = -40; }
    else if (lado === 1) { this.x = WORLD_W + 40; this.y = rand(40, WORLD_H - 40); }
    else if (lado === 2) { this.x = rand(40, WORLD_W - 40); this.y = WORLD_H + 40; }
    else                 { this.x = -40; this.y = rand(40, WORLD_H - 40); }
    this.estado = 'volando';
    this.t = 0;
    this.enZona = 0;
    this.ala = Math.random() * 6.28;
    this.muerta = false;
    this.facing = 1;
  }
  mover(tx, ty, dt) {
    const dx = tx - this.x, dy = ty - this.y;
    const d = Math.hypot(dx, dy) || 1;
    const paso = Math.min(CONFIG.PLAGA_VEL * dt, d);
    this.x += dx / d * paso;
    this.y += dy / d * paso;
    if (Math.abs(dx) > 1) this.facing = dx > 0 ? 1 : -1;
    return d;
  }
  huir() {
    if (this.estado === 'huyendo') return;
    this.estado = 'huyendo';
    this.target = null;
  }
  espantada() {                  // solo cuenta si la espanta el jugador o un ayudante
    if (this.estado === 'huyendo') return;
    this.huir();
    state.plagasEspantadas++;
    state.hoy.plagas++;
    state.hints.plaga = true;
    floats.push({ x: this.x, y: this.y, t: 0, txt: t('fuera'), color: '#ffd166' });
    rachaEspanto.push(tiempo);
    rachaEspanto = rachaEspanto.filter(x => tiempo - x <= 10);
    if (rachaEspanto.length >= 3) state.op.racha3 = 1;
    plumas(this.x, this.y);
    SFX.aleteo();
  }
  update(dt) {
    this.ala += dt * (this.estado === 'comiendo' ? 4 : 16);

    // Espantar por proximidad del jugador o de un ayudante
    if (this.estado !== 'huyendo') {
      if (Math.hypot(player.x - this.x, player.y - this.y) <= CONFIG.PLAGA_RADIO_ESPANTO) {
        this.espantada(); return;
      }
      for (const h of helpers) {
        if (Math.hypot(h.x - this.x, h.y - this.y) <= CONFIG.PLAGA_RADIO_ESPANTO) {
          this.espantada(); return;
        }
      }
    }

    if (this.estado === 'volando') {
      if (!this.target || this.target.frutas <= 0 || plants.indexOf(this.target) < 0) {
        this.target = elegirObjetivoPlaga();
        if (!this.target) { this.huir(); return; }
      }
      const d = this.mover(this.target.x, this.target.y - 30, dt);
      if (d < 8) { this.estado = 'comiendo'; this.t = 0; this.enZona = 0; SFX.alerta(); }

    } else if (this.estado === 'comiendo') {
      const p = this.target;
      if (!p || plants.indexOf(p) < 0) { this.huir(); return; }
      this.x = p.x; this.y = p.y - 30;
      this.t += dt;
      this.enZona += dt;
      // el espantapájaros de la zona la echa sola (no cuenta como espantada)
      if (zonaProtegida(p.fruit.id) && this.enZona >= CONFIG.ESPANTA_AUTO) { this.huir(); return; }
      if (this.t >= CONFIG.PLAGA_GRACIA + CONFIG.PLAGA_MORDIDA) {
        this.t = CONFIG.PLAGA_GRACIA;
        if (p.frutas > 0) {
          p.frutas--;
          p.pop = 1;
          if (oleada && oleada.t >= 0) oleada.perdidas++;
          if (p.frutas === 0) { marchitar(p, true); this.huir(); return; }
        } else { this.huir(); return; }
      }

    } else {
      // huyendo: sale por el borde más cercano
      const bx = this.x < WORLD_W / 2 ? -80 : WORLD_W + 80;
      this.mover(bx, this.y - 160, dt);
      if (this.x < -60 || this.x > WORLD_W + 60 || this.y < -60) this.muerta = true;
    }
  }
}

/* ------------------------------ Compradores ------------------------------ */
const COLORES_CLIENTE = ['#d95f5f', '#5f8fd9', '#c07de0', '#4fb39a', '#e0a63d', '#7f9bd9'];

class Cliente {
  constructor(slot) {
    const izq = Math.random() < 0.5;
    this.slot = slot;
    this.x = izq ? -30 : WORLD_W + 30;
    this.y = SLOTS_CLIENTE[slot][1];
    const r = pedidoMaxPorRep() - CONFIG.CLIENTE_PIDE_MIN + 1;
    this.quiere = CONFIG.CLIENTE_PIDE_MIN + ((Math.random() * r) | 0);
    this.compradas = 0;
    // Cada cliente pide UNA fruta concreta de las desbloqueadas
    this.fruta = state.desbloqueadas[(Math.random() * state.desbloqueadas.length) | 0] || FRUITS[0].id;
    this.paciencia = CONFIG.CLIENTE_PACIENCIA;
    this.estado = 'llegando';
    this.t = 0;
    this.phase = Math.random() * 6.28;
    this.swayT = 0;
    this.facing = izq ? 1 : -1;
    this.moving = true;
    this.carga = [];
    this.color = COLORES_CLIENTE[(Math.random() * COLORES_CLIENTE.length) | 0];
    this.fuera = false;
    this.emo = null;
    this.emoT = 0;
  }
  irHacia(tx, ty, dt) {
    const dx = tx - this.x, dy = ty - this.y;
    const d = Math.hypot(dx, dy);
    if (d > 3) {
      const f = Math.min(1, CONFIG.CLIENTE_VEL * dt / d);
      const mx = dx * f, my = dy * f;
      this.x += mx; this.y += my;
      if (Math.abs(dx) > 0.6) this.facing = dx > 0 ? 1 : -1;
      avanzarPaso(this, Math.hypot(mx, my));
      this.inclina = lerp(this.inclina || 0, (dx > 0 ? 1 : -1) * CONFIG.INCLINA_MAX * 0.6, Math.min(1, dt * 6));
      this.moving = true;
    } else {
      this.moving = false;
      this.inclina = lerp(this.inclina || 0, 0, Math.min(1, dt * 8));
    }
    return d;
  }
  salir(completo) {
    if (this.estado === 'yendo') return;
    this.estado = 'yendo';
    this.moving = true;
    this.emoT = 2;
    if (completo) {
      state.servidos++;
      ajustarRep(CONFIG.REP_SERVIDO);
      combo.n++; combo.t = 0;                     // la racha son clientes servidos
      this.emo = '😄';
      floats.push({ x: this.x, y: this.y - 52, t: 0, txt: t('gracias'), color: '#7dffa0' });
    } else if (this.compradas === 0) {
      state.enojados++;
      ajustarRep(-CONFIG.REP_ENOJO);
      romperCombo();
      this.emo = '😠';
      floats.push({ x: this.x, y: this.y - 52, t: 0, txt: t('enojado'), color: '#ff8a8a' });
      cam.shake = Math.max(cam.shake, 0.28);
      SFX.alerta();
    } else {
      this.emo = '😐';                            // se llevó algo: ni premio ni castigo
    }
  }
  update(dt) {
    this.swayT += dt * (this.moving ? 6 : 2);
    if (this.emoT > 0) this.emoT -= dt;
    if (this.estado === 'llegando') {
      const d = this.irHacia(SLOTS_CLIENTE[this.slot][0], SLOTS_CLIENTE[this.slot][1], dt);
      if (d < 4) { this.estado = 'esperando'; this.t = 0; this.moving = false; }
    } else if (this.estado === 'esperando') {
      this.paciencia -= dt;
      this.t += dt;
      if (this.t >= CONFIG.CLIENTE_COMPRA && hayEnEstante(this.fruta)) {
        this.t = 0;
        const id = comprarDelEstante(this.x, this.y, this.fruta);
        if (id) { this.compradas++; this.carga.push(id); }
        if (this.compradas >= this.quiere) { this.salir(true); return; }
      }
      if (this.paciencia <= 0) this.salir(false);
    } else {
      this.irHacia(this.x < WORLD_W / 2 ? -60 : WORLD_W + 60, this.y, dt);
      if (this.x < -50 || this.x > WORLD_W + 50) this.fuera = true;
    }
  }
}

/* -------------------------------- Ladrones ------------------------------- */
// Tres animales con maña distinta: uno rápido que se cansa, uno equilibrado
// y uno lento que no se rinde nunca.
const LADRONES = [
  { id: 'mapache',   vel: 150, persigue: 14,  tam: 1.00, cuerpo: '#6d6d79', osc: '#2a2a33', cara: '#7c7c88', cola: 'anillada' },
  { id: 'ardilla',   vel: 196, persigue: 6.5, tam: 0.82, cuerpo: '#c1743a', osc: '#8a4e22', cara: '#d18a52', cola: 'esponjada' },
  { id: 'tlacuache', vel: 118, persigue: 99,  tam: 1.06, cuerpo: '#b9b2a4', osc: '#6d675c', cara: '#d8d2c6', cola: 'pelada' }
];
// Van apareciendo variedades conforme avanzas
function tipoLadron() {
  const n = clamp(1 + capituloActual(), 1, LADRONES.length);
  return LADRONES[(Math.random() * n) | 0];
}
function enZonaSegura(x, y) {
  return Math.hypot(x - SELL.cx, y - SELL.cy) <= CONFIG.ZONA_SEGURA_R;
}

class Mapache {
  constructor(tipo) {
    const izq = Math.random() < 0.5;
    this.tipo = tipo || tipoLadron();
    this.x = izq ? -30 : WORLD_W + 30;
    this.y = clamp(player.y + rand(-180, 180), 60, WORLD_H - 60);
    this.estado = 'buscando';
    this.carga = [];
    this.facing = izq ? 1 : -1;
    this.phase = 0;
    this.fuera = false;
    this.emoT = 0;
    this.persiguiendo = 0;
  }
  mover(tx, ty, dt) {
    const dx = tx - this.x, dy = ty - this.y;
    const d = Math.hypot(dx, dy) || 1;
    const paso = Math.min(this.tipo.vel * dt, d);
    this.x += dx / d * paso;
    this.y += dy / d * paso;
    if (Math.abs(dx) > 1) this.facing = dx > 0 ? 1 : -1;
    avanzarPaso(this, paso, CONFIG.PASO_LARGO * 0.45);   // patas cortas, paso corto
    return d;
  }
  huir() { if (this.estado !== 'huyendo') this.estado = 'huyendo'; }
  // Va primero por la fruta del suelo; solo si no hay, persigue tu pila
  objetivo() {
    let best = null, bd = Infinity;
    for (const f of sueloFrutas) {
      if (enZonaSegura(f.x, f.y)) continue;            // lo del puesto no se toca
      const d = Math.hypot(f.x - this.x, f.y - this.y);
      if (d < bd) { bd = d; best = f; }
    }
    if (best) return { x: best.x, y: best.y, suelo: best };
    if (player.carga.length >= CONFIG.MAPACHE_MIN_CARGA && !enZonaSegura(player.x, player.y)) {
      return { x: player.x, y: player.y, suelo: null };
    }
    return null;
  }
  update(dt) {
    if (this.emoT > 0) this.emoT -= dt;
    if (this.estado !== 'huyendo') {
      for (const h of helpers) {              // los ayudantes lo ahuyentan
        if (Math.hypot(h.x - this.x, h.y - this.y) <= CONFIG.MAPACHE_RADIO_ESPANTO) {
          this.huir(); this.emo = '💨'; this.emoT = 1.2; return;
        }
      }
      const o = this.objetivo();
      if (!o) { this.huir(); this.emo = '💨'; this.emoT = 1; return; }
      this.persiguiendo += dt;
      if (this.persiguiendo > this.tipo.persigue) { this.huir(); this.emo = '💨'; this.emoT = 1; return; }
      const d = this.mover(o.x, o.y, dt);
      if (d < CONFIG.MAPACHE_RADIO_ROBO) {
        if (o.suelo) {
          const i = sueloFrutas.indexOf(o.suelo);
          if (i >= 0) { this.carga.push(sueloFrutas[i].id); sueloFrutas.splice(i, 1); }
        } else if (!enZonaSegura(player.x, player.y)) {
          const n = player.carga.length;
          while (player.carga.length > 0) this.carga.push(player.carga.pop());   // se lleva TODO
          if (n > 0) {
            state.robadas += n;
            floats.push({ x: player.x, y: player.y - 46, t: 0, txt: t('robo') + ' ×' + n, color: '#ff8a8a' });
            cam.shake = Math.max(cam.shake, 0.55);
            SFX.alerta();
          }
        }
        this.huir();
      }
    } else {
      this.mover(this.x < WORLD_W / 2 ? -70 : WORLD_W + 70, this.y + 40, dt);
      if (this.x < -60 || this.x > WORLD_W + 60) this.fuera = true;
    }
  }
}

class Espantapajaros {

const player = new Player();

/* ====================== 9. ZONAS, PLANTAS Y MEJORAS ===================== */
function desbloqueada(id) { return state.desbloqueadas.indexOf(id) >= 0; }
function zonaProtegida(fruitId) { return state.espantaZonas.indexOf(fruitId) >= 0; }

// Solo el primer cupo de cada huerta nace gratis; el resto hay que comprarlo
// (y si una plaga mata un árbol, su cupo vuelve a quedar vacío para replantar).
function arbolesDeZona(f) {
  if (!state.arboles[f.id]) state.arboles[f.id] = f.todasPos.map((_, i) => i === 0);
  return state.arboles[f.id];
}

// Cupos que alguna vez tuvieron árbol (para cobrar "replantar" en vez de
// "cupo nuevo" si una plaga se lo llevó)
function arbolesUsadosDeZona(f) {
  if (!state.arbolesUsados[f.id]) state.arbolesUsados[f.id] = f.todasPos.map((_, i) => i === 0);
  return state.arbolesUsados[f.id];
}

function agregarPlantasZona(f, conPop) {
  const vivos = arbolesDeZona(f);
  f.todasPos.forEach((p, i) => { if (vivos[i]) plants.push(new Plant(f, p[0], p[1], conPop, i)); });
}

function reconstruirMundo() {
  plants.length = 0;
  for (const f of FRUITS) {
    f._fade = desbloqueada(f.id) ? 0 : 1;
    if (desbloqueada(f.id)) agregarPlantasZona(f, false);
  }
  helpers.length = 0;
  for (let i = 0; i < state.ayudantes; i++) helpers.push(new Helper(i));
  clientes.length = 0;
  espantas.length = 0;
  for (const id of state.espantaZonas) if (FRUIT_BY_ID[id]) espantas.push(new Espantapajaros(id));
  plagas.length = 0;
  mapaches.length = 0;
  sueloFrutas.length = 0;
  oleadaCola.length = 0;
}

function plantaCercanaConFruta(x, y, radio) {
  let best = null, bd = radio * radio;
  for (const p of plants) {
    if (p.frutas <= 0) continue;
    const dx = p.x - x, dy = p.y - y;
    const d = dx * dx + dy * dy;
    if (d <= bd) { bd = d; best = p; }
  }
  return best;
}
// Como la anterior, pero solo entre plantas de UNA fruta: así el ayudante
// puede ir a buscar específicamente lo que le falta al puesto.
function plantaCercanaDeFruta(x, y, fruitId) {
  let best = null, bd = Infinity;
  for (const p of plants) {
    if (p.fruit.id !== fruitId || p.frutas <= 0) continue;
    const dx = p.x - x, dy = p.y - y, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}
function plantaCercana(x, y) {
  let best = null, bd = Infinity;
  for (const p of plants) {
    const dx = p.x - x, dy = p.y - y, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

// Objetivo de una plaga: evita las zonas con espantapájaros el 70% de las veces
function elegirObjetivoPlaga() {
  const cand = [];
  for (const p of plants) if (p.frutas > 0 && p.marchita <= 0) cand.push(p);
  if (!cand.length) return null;
  const libres = cand.filter(p => !zonaProtegida(p.fruit.id) || Math.random() > CONFIG.ESPANTA_EVITA);
  const lista = libres.length ? libres : cand;
  return lista[(Math.random() * lista.length) | 0];
}

// La racha ya no se rompe aquí: el daño llega solo, porque menos fruta
// acaba en estante vacío y en un cliente enojado.
function marchitar(p, porPlaga) {
  if (p.marchita > 0) return;
  p.marchita = CONFIG.PLAGA_MARCHITA;
  p.contagio = 0;
  state.sinMarchita = 0;
  state.hoy.sinMarchita = 0;
  cam.shake = Math.max(cam.shake, 0.22);
}

function contagioActivo() { return capituloActual() >= CONFIG.CONTAGIO_DESDE_CAP; }

function contagiarDesde(p) {
  let best = null, bd = CONFIG.CONTAGIO_RADIO * CONFIG.CONTAGIO_RADIO;
  for (const o of plants) {
    if (o === p || o.marchita > 0) continue;
    const dx = o.x - p.x, dy = o.y - p.y, d = dx * dx + dy * dy;
    if (d <= bd) { bd = d; best = o; }
  }
  if (!best) return;
  marchitar(best, false);
  floats.push({ x: best.x, y: best.y - 40, t: 0, txt: t('contagio'), color: '#ff8a5c' });
}

function plantaMarchitaCercana(x, y, radio) {
  let best = null, bd = radio * radio;
  for (const p of plants) {
    if (p.marchita <= 0) continue;
    const dx = p.x - x, dy = p.y - y, d = dx * dx + dy * dy;
    if (d <= bd) { bd = d; best = p; }
  }
  return best;
}

function enVenta(x, y) {
  return x > SELL.x && x < SELL.x + SELL.w && y > SELL.y && y < SELL.y + SELL.h;
}

/* --------------------- Puesto, clientes y reputación --------------------- */
function puestoCap() { return CONFIG.PUESTO_CAP_BASE + CONFIG.PUESTO_PASO * state.compras.puesto; }
function nivelPuesto() { return clamp(state.compras.puesto, 0, CONFIG.PUESTO_MAX); }

/* Bandejas por fruta: el estante ya no es un montón mezclado. El total del
   puesto se reparte entre las frutas desbloqueadas, y cada bandeja SOLO
   admite la suya — surtir de más de una no le quita cupo a las demás. */
function trayCap(id) {
  const n = state.desbloqueadas.length;
  if (!n || state.desbloqueadas.indexOf(id) < 0) return 0;
  const total = puestoCap();
  const base = Math.floor(total / n), resto = total % n;
  return base + (state.desbloqueadas.indexOf(id) < resto ? 1 : 0);
}
function trayCount(id) { return state.estanteTrays[id] || 0; }
function trayLleno(id) { return trayCount(id) >= trayCap(id); }
// Todo lleno = ninguna bandeja desbloqueada tiene sitio; solo entonces
// deja de tener sentido que el jugador o el ayudante sigan intentando surtir.
function estanteLleno() { return state.desbloqueadas.every(id => trayLleno(id)); }
function estanteTotal() { return state.desbloqueadas.reduce((n, id) => n + trayCount(id), 0); }
// La fruta con la bandeja más vacía en proporción: lo que hace falta reponer.
function frutaMasNecesitada() {
  let mejor = null, peor = Infinity;
  for (const id of state.desbloqueadas) {
    const cap = trayCap(id);
    if (cap <= 0) continue;
    const frac = trayCount(id) / cap;
    if (frac < peor) { peor = frac; mejor = id; }
  }
  return mejor;
}

// Surtir: la fruta pasa de tu espalda a SU bandeja. Aquí NO entra dinero.
function depositar(id) {
  if (!FRUIT_BY_ID[id] || trayLleno(id)) return false;
  state.estanteTrays[id] = trayCount(id) + 1;
  state.hints.vender = true;
  return true;
}

function rangoRep() {
  const r = state.reputacion;
  return r >= 90 ? 3 : (r >= 70 ? 2 : (r >= 40 ? 1 : 0));
}
function repFactorPrecio() {
  return CONFIG.REP_PRECIO_MIN + CONFIG.REP_PRECIO_RANGO * (state.reputacion / CONFIG.REP_MAX);
}
// Con buena reputación los clientes se animan a pedir más: el techo del
// pedido sube de 3 a 7 conforme la reputación va de 0 a 100.
function pedidoMaxPorRep() {
  return CONFIG.CLIENTE_PIDE_MAX + Math.floor(CONFIG.CLIENTE_PIDE_EXTRA * (state.reputacion / CONFIG.REP_MAX));
}
// Buena fama = más clientes. El éxito trae más presión, y eso se equilibra solo.
function intervaloCliente() {
  const base = Math.max(CONFIG.CLIENTE_INTERVALO_MIN,
    CONFIG.CLIENTE_INTERVALO_BASE - CONFIG.CLIENTE_POR_CAP * capituloActual());
  return base * (1.35 - 0.5 * (state.reputacion / CONFIG.REP_MAX));
}
function ajustarRep(d) { state.reputacion = clamp(state.reputacion + d, 0, CONFIG.REP_MAX); }

function hayEnEstante(fruitId) { return trayCount(fruitId) > 0; }

// El dinero entra AQUÍ: cuando un cliente se lleva una fruta de SU bandeja.
function comprarDelEstante(x, y, fruitId) {
  const f = FRUIT_BY_ID[fruitId];
  if (!f || trayCount(fruitId) <= 0) return null;
  state.estanteTrays[fruitId] = trayCount(fruitId) - 1;
  const id = fruitId;
  const mult = comboMult();
  const ganado = Math.max(1, Math.round(f.precio * repFactorPrecio() * mult));
  state.dinero += ganado;
  state.dineroTotal += ganado;
  state.hoy.dinero += ganado;
  state.ventasTotales++;
  state.hoy.ventas++;
  state.ventasPorFruta[id] = (state.ventasPorFruta[id] || 0) + 1;
  state.hoy.porFruta[id] = (state.hoy.porFruta[id] || 0) + 1;
  floats.push({
    x: x + rand(-14, 14), y: y - 20, t: 0,
    txt: '+$' + ganado + (mult > 1 ? ' ×' + mult : ''),
    color: mult > 1 ? '#ffd166' : '#2ecc55'
  });
  SFX.chaching();
  return id;
}

/* ------------------ Baches, fruta caída y mapaches ----------------------- */
// El camino se rehace cada tanto para que no te aprendas la ruta segura.
function nBaches() { return Math.min(CONFIG.BACHE_N_MAX, CONFIG.BACHE_N_BASE + capituloActual()); }

function puntosBacheNuevos(n) {
  const lejos = POS_BACHE.filter(p => Math.hypot(p[0] - player.x, p[1] - player.y) > CONFIG.BACHE_LEJOS);
  const pool = (lejos.length >= n ? lejos : POS_BACHE).slice();
  const out = [];
  while (out.length < n && pool.length) out.push(pool.splice((Math.random() * pool.length) | 0, 1)[0]);
  return out;
}

function aplicarBaches(instantaneo) {
  baches.length = 0;
  for (const p of bachePend) baches.push({ x: p[0], y: p[1], a: instantaneo ? 1 : 0, fase: 'entrando' });
  bachePend = null;
}

function rebarajarBaches(instantaneo) {
  bachePend = puntosBacheNuevos(nBaches());
  if (instantaneo || !baches.length) { aplicarBaches(true); return; }
  for (const b of baches) b.fase = 'saliendo';
  toast(t('caminoCambio'), '');
}

function actualizarBaches(dt) {
  bacheTimer += dt;
  if (!bachePend && bacheTimer >= CONFIG.BACHE_CAMBIO) { bacheTimer = 0; rebarajarBaches(false); }
  let todosFuera = bachePend !== null;
  for (const b of baches) {
    if (b.fase === 'saliendo') {
      b.a = Math.max(0, b.a - dt * CONFIG.BACHE_FUNDIDO);
      if (b.a > 0) todosFuera = false;
    } else b.a = Math.min(1, b.a + dt * CONFIG.BACHE_FUNDIDO);
  }
  if (bachePend && todosFuera) aplicarBaches(false);
}

// Solo tropiezas con un bache ya asentado, nunca con uno a medio aparecer
function bacheEn(x, y) {
  for (const b of baches) {
    if (b.a < 0.85 || b.fase === 'saliendo') continue;
    const dx = b.x - x, dy = (b.y - y) * 1.5;      // los baches son elípticos
    if (dx * dx + dy * dy <= CONFIG.BACHE_RADIO * CONFIG.BACHE_RADIO) return b;
  }
  return null;
}

function probTropiezo(n) {
  return Math.min(CONFIG.BACHE_PROB_MAX, CONFIG.BACHE_PROB_BASE + CONFIG.BACHE_PROB_POR_FRUTA * n);
}

function soltarAlSuelo(id, x, y) {
  sueloFrutas.push({ id: id, x: clamp(x, 20, WORLD_W - 20), y: clamp(y, 40, WORLD_H - 20), t: 0, pop: 1 });
}

function tropezar(p) {
  const r = CONFIG.BACHE_CAIDA_MAX - CONFIG.BACHE_CAIDA_MIN + 1;
  const n = Math.min(p.carga.length, CONFIG.BACHE_CAIDA_MIN + ((Math.random() * r) | 0));
  for (let i = 0; i < n; i++) {
    const id = p.carga.pop();
    if (!id) break;
    soltarAlSuelo(id, p.x + rand(-54, 54), p.y + rand(-34, 46));
  }
  p.aturdido = CONFIG.BACHE_ATURDIDO;
  p.vx = 0; p.vy = 0;
  cam.shake = Math.max(cam.shake, 0.32);
  floats.push({ x: p.x, y: p.y - 42, t: 0, txt: t('tropiezo'), color: '#ffa96b' });
  state.tropiezos++;
  SFX.alerta();
}

function actualizarSuelo(dt) {
  for (let i = sueloFrutas.length - 1; i >= 0; i--) {
    const f = sueloFrutas[i];
    f.t += dt;
    if (f.pop > 0) f.pop = Math.max(0, f.pop - dt * 3);
    if (f.t >= CONFIG.FRUTA_SUELO_VIDA) sueloFrutas.splice(i, 1);
  }
}

function actualizarMapaches(dt) {
  for (let i = mapaches.length - 1; i >= 0; i--) {
    mapaches[i].update(dt);
    if (mapaches[i].fuera) mapaches.splice(i, 1);
  }
  if (!plagasActivas()) { mapacheTimer = 0; return; }
  const hayBotin = sueloFrutas.length > 0 || player.carga.length >= CONFIG.MAPACHE_MIN_CARGA;
  if (!hayBotin) { mapacheTimer = 0; return; }
  mapacheTimer += dt;
  if (mapacheTimer >= CONFIG.MAPACHE_INTERVALO) {
    mapacheTimer = 0;
    if (mapaches.length < CONFIG.MAPACHE_MAX) mapaches.push(new Mapache());
  }
}

// Los clientes solo empiezan a llegar cuando ya surtiste una vez: así el
// primero nunca se encuentra el puesto vacío durante el tutorial.
function clientesActivos() { return !!state.hints.vender; }

function actualizarClientes(dt) {
  for (let i = clientes.length - 1; i >= 0; i--) {
    clientes[i].update(dt);
    if (clientes[i].fuera) clientes.splice(i, 1);
  }
  if (!clientesActivos()) { clienteTimer = 0; return; }
  clienteTimer += dt;
  if (clienteTimer < intervaloCliente()) return;
  clienteTimer = 0;
  if (clientes.length >= CONFIG.CLIENTE_MAX) return;
  const libres = [];
  for (let s = 0; s < SLOTS_CLIENTE.length; s++) {
    let ocupado = false;
    for (const c of clientes) if (c.slot === s && c.estado !== 'yendo') { ocupado = true; break; }
    if (!ocupado) libres.push(s);
  }
  if (libres.length) clientes.push(new Cliente(libres[(Math.random() * libres.length) | 0]));
}

// Huerta donde plantar: la desbloqueada con cupos libres que tenga menos plantas.
// Así ningún cupo se pierde al desbloquear una zona nueva.
function zonaParaNuevaPlanta() {
  let best = null, bn = Infinity;
  for (const id of state.desbloqueadas) {
    const f = FRUIT_BY_ID[id];
    if (!f) continue;
    const vivos = arbolesDeZona(f);
    if (vivos.indexOf(false) < 0) continue;
    const n = vivos.reduce((a, v) => a + (v ? 1 : 0), 0);
    if (n < bn) { bn = n; best = f; }
  }
  return best;
}

function zonaParaEspantapajaros() {
  for (let i = state.desbloqueadas.length - 1; i >= 0; i--) {
    const id = state.desbloqueadas[i];
    if (FRUIT_BY_ID[id] && !zonaProtegida(id)) return id;
  }
  return null;
}

        }

    max() { return state.capacidad >= CONFIG.CAP_MAX; },
    comprar() {

    max() { return state.compras.puesto >= CONFIG.PUESTO_MAX; },
    comprar() {

];

function actualizarCirculos(dt) {
  for (const c of circles) {
    const dentro = Math.hypot(player.x - c.x, player.y - c.y) <= c.r;
    c._hover = dentro;
    if (c.max()) { state.pagos[c.id] = 0; continue; }
    if (!dentro) continue;
    const precio = c.precio();
    const falta = precio - state.pagos[c.id];
    if (falta <= 0) continue;
    const cobro = Math.min(precio / CONFIG.PAY_TIME * dt, falta, state.dinero);
    if (cobro > 0) { state.dinero -= cobro; state.pagos[c.id] += cobro; }
    if (state.pagos[c.id] >= precio - 0.001) {
      state.pagos[c.id] = 0;
      c.comprar();
      state.hoy.compras++;
      state.hints.mejorar = true;
      lanzarConfeti(c.x, c.y - 20, 34);
      SFX.fanfarria();
      Save.guardar();
    }
  }
}

/* --------------------------------- Plagas -------------------------------- */
function capituloActual() {
  const r = state.retoIdx < CAMPANA.length ? CAMPANA[state.retoIdx] : null;
  return r ? r.cap : CAP_NOMBRES.length - 1;
}
function intervaloPlaga() {
  return Math.max(CONFIG.PLAGA_INTERVALO_MIN,
    CONFIG.PLAGA_INTERVALO_BASE - CONFIG.PLAGA_INTERVALO_POR_CAP * capituloActual());
}
function maxPlagas() { return Math.min(CONFIG.PLAGA_MAX_TOPE, 1 + capituloActual()); }
// No hay plagas hasta completar el primer reto: el tutorial no se pisa.
function plagasActivas() { return state.retoIdx >= 1; }

/* ------------------------- Oleadas de fin de capítulo -------------------- */
function oleadaHecha(cap) { return state.oleadasHechas.indexOf(cap) >= 0; }

function iniciarOleada(cap, intento) {
  oleada = { cap: cap, t: intento > 1 ? -CONFIG.OLEADA_RESPIRO : 0,
             spawnT: CONFIG.OLEADA_SPAWN, spawned: 0, perdidas: 0, intento: intento || 1 };
  bigMsg = { txt: t('oleada'), t: 0 };
  cam.shake = 0.6;
  SFX.fanfarria();
}

function terminarOleada() {
  const cap = oleada.cap, intento = oleada.intento;
  const gano = oleada.perdidas <= CONFIG.OLEADA_MAX_PERDIDAS;
  for (const p of plagas) p.huir();
  if (gano) {
    const premio = CONFIG.OLEADA_PREMIO * (cap + 1);
    pagarPremio(premio);
    bigMsg = { txt: t('oleadaSuperada'), t: 0 };
    toast(t('oleadaSuperada'), '+$' + premio);
    for (let i = 0; i < 120; i++) lanzarConfeti(rand(40, WORLD_W - 40), rand(cam.y + 60, cam.y + view.h - 120), 1);
    state.oleadasHechas.push(cap);
    oleada = null;
    siguienteOleadaEnCola();
  } else if (intento >= CONFIG.OLEADA_INTENTOS) {
    // No se bloquea el avance para siempre: al tercer intento pasa sin premio
    bigMsg = { txt: t('oleadaFin'), t: 0 };
    state.oleadasHechas.push(cap);
    oleada = null;
    siguienteOleadaEnCola();
  } else {
    bigMsg = { txt: t('oleadaFallida'), t: 0 };
    iniciarOleada(cap, intento + 1);
  }
  Save.guardar();
}

function siguienteOleadaEnCola() {
  while (oleadaCola.length) {
    const cap = oleadaCola.shift();
    if (!oleadaHecha(cap)) { iniciarOleada(cap, 1); return; }
  }
}

function actualizarOleada(dt) {
  if (!oleada) return;
  oleada.t += dt;
  if (oleada.t < 0) return;
  oleada.spawnT += dt;
  if (oleada.spawned < CONFIG.OLEADA_PLAGAS && oleada.spawnT >= CONFIG.OLEADA_SPAWN) {
    oleada.spawnT = 0;
    const o = elegirObjetivoPlaga();
    if (o) { plagas.push(new Plaga(o)); oleada.spawned++; }
  }
  if (oleada.t >= CONFIG.OLEADA_DURACION) terminarOleada();
}

/* ------------------------------- Sueldos --------------------------------- */
function sueldoPorMinuto() {
  let s = 0;
  const cap = capituloActual();
  for (let i = 0; i < state.ayudantes; i++) {
    s += CONFIG.SUELDO_BASE * (1 + cap) * (1 + CONFIG.SUELDO_POR_AYUDANTE * i);
  }
  return s;
}

function cobrarSueldos(dt) {
  if (state.ayudantes <= 0) { helpersImpagos = false; return; }
  const debe = sueldoPorMinuto() / 60 * dt;
  const cobro = Math.min(state.dinero, debe);
  state.dinero -= cobro;
  helpersImpagos = cobro < debe - 1e-9;
  if (helpersImpagos) {
    avisoSueldo -= dt;
    if (avisoSueldo <= 0) { avisoSueldo = 12; toast(t('sueldoAlto'), ''); }
  } else avisoSueldo = 0;
}

function actualizarPlagas(dt) {
  for (let i = plagas.length - 1; i >= 0; i--) {
    plagas[i].update(dt);
    if (plagas[i].muerta) plagas.splice(i, 1);
  }
  if (oleada) { plagaTimer = 0; return; }   // durante la oleada manda la oleada
  if (!plagasActivas()) { plagaTimer = 0; return; }
  plagaTimer += dt;
  if (plagaTimer >= intervaloPlaga()) {
    plagaTimer = 0;
    let vivas = 0;
    for (const p of plagas) if (p.estado !== 'huyendo') vivas++;
    if (vivas < maxPlagas()) {
      const obj = elegirObjetivoPlaga();
      if (obj) plagas.push(new Plaga(obj));
    }
  }
}
function hayPlagaComiendo() {
  for (const p of plagas) if (p.estado === 'comiendo') return true;
  return false;
}

/* =========================== 10. MOTOR DE RETOS ========================== */
function retoActual() { return state.retoIdx < CAMPANA.length ? CAMPANA[state.retoIdx] : null; }
function cumplido(id) { return state.cumplidos.indexOf(id) >= 0; }
function diarioCobrado(id) { return state.diarios.cobrados.indexOf(id) >= 0; }

function pagarPremio(n) {
  state.dinero += n;
  state.dineroTotal += n;
  state.hoy.dinero += n;
}

function desbloquearZona(fruitId, conFiesta) {
  const f = FRUIT_BY_ID[fruitId];
  if (!f || desbloqueada(fruitId)) return;
  state.desbloqueadas.push(fruitId);
  agregarPlantasZona(f, true);
  if (conFiesta) {
    const z = f.zona;
    for (let i = 0; i < 46; i++) lanzarConfeti(z.x + rand(30, z.w - 30), z.y + rand(30, z.h - 30), 1);
  } else f._fade = 0;
}

function festejarReto(r, premio) {
  SFX.fanfarria();
  cam.shake = 0.45;
  toast(textoReto(r), '+$' + (premio === undefined ? r.premio : premio));
  if (r.final) {
    abrirFinal();
    for (let i = 0; i < 160; i++) lanzarConfeti(rand(40, WORLD_W - 40), rand(cam.y + 60, cam.y + view.h - 120), 1);
  } else {
    bigMsg = { txt: t('retoCompletado'), t: 0 };
    for (let i = 0; i < 50; i++) lanzarConfeti(player.x + rand(-90, 90), player.y + rand(-90, 30), 1);
  }
}

function actualizarRetos(conFiesta) {
  // --- Campaña: secuencial, encadena varios si un solo evento cumple más de uno
  let guard = 0;
  while (state.retoIdx < CAMPANA.length && guard++ < 12) {
    const r = CAMPANA[state.retoIdx];
    if (r.prog(state) < r.meta) break;
    state.retoIdx++;
    if (!cumplido(r.id)) state.cumplidos.push(r.id);
    pagarPremio(r.premio);
    if (r.desbloquea) desbloquearZona(r.desbloquea, conFiesta);
    if (conFiesta) festejarReto(r);
    // Cerrar capítulo dispara la oleada (el último reto ya es el final del juego)
    const sig = state.retoIdx < CAMPANA.length ? CAMPANA[state.retoIdx] : null;
    if (conFiesta && !r.final && (!sig || sig.cap !== r.cap) && !oleadaHecha(r.cap)) {
      // Si ya hay una corriendo se encola: antes se perdía sin más
      if (oleada) { if (oleadaCola.indexOf(r.cap) < 0) oleadaCola.push(r.cap); }
      else iniciarOleada(r.cap, 1);
    }
    Save.guardar();
  }
  // --- Opcionales: sin orden, se pagan una sola vez
  for (const r of OPCIONALES) {
    if (cumplido(r.id) || r.prog(state) < r.meta) continue;
    state.cumplidos.push(r.id);
    pagarPremio(r.premio);
    if (conFiesta) festejarReto(r);
    Save.guardar();
  }
  // --- Diarios: premio según la ranura
  for (let i = 0; i < state.diarios.ids.length; i++) {
    const r = RETO_BY_ID[state.diarios.ids[i]];
    if (!r || diarioCobrado(r.id) || r.prog(state) < r.meta) continue;
    const premio = PREMIO_DIARIO[i] || PREMIO_DIARIO[0];
    state.diarios.cobrados.push(r.id);
    pagarPremio(premio);
    if (conFiesta) festejarReto(r, premio);
    Save.guardar();
  }
}

// Cambio de día en caliente (la pestaña quedó abierta pasada la medianoche)
function revisarDia() {
  const hoy = fechaHoy();
  if (state.diarios.fecha === hoy && state.hoy.fecha === hoy) return;
  state.diarios = { fecha: hoy, ids: diariosDeHoy(hoy), cobrados: [] };
  state.hoy = estadoHoyNuevo();
  Save.guardar();
}

// Aviso a mitad de camino, una vez por reto y por sesión
const mitadAvisada = Object.create(null);
function revisarMitad() {
  const lista = [];
  const rc = retoActual();
  if (rc) lista.push(rc);
  for (const id of state.diarios.ids) { const r = RETO_BY_ID[id]; if (r && !diarioCobrado(id)) lista.push(r); }
  for (const r of lista) {
    if (mitadAvisada[r.id]) continue;
    const p = r.prog(state) / r.meta;
    if (p >= 0.5 && p < 1) { mitadAvisada[r.id] = true; toast(textoReto(r), t('mitad')); }
  }
}

// Las tres filas que se ven siempre en pantalla
function retosVisibles() {
  const out = [];
  const rc = retoActual();
  if (rc) out.push({ r: rc, tipo: 'c' });
  let mejorOp = null, mejorP = -1;
  for (const r of OPCIONALES) {
    if (cumplido(r.id)) continue;
    const p = clamp(r.prog(state) / r.meta, 0, 1);
    if (p > mejorP) { mejorP = p; mejorOp = r; }
  }
  if (mejorOp) out.push({ r: mejorOp, tipo: 'o' });
  let mejorD = null, mejorDP = -1, mejorDI = 0;
  for (let i = 0; i < state.diarios.ids.length; i++) {
    const r = RETO_BY_ID[state.diarios.ids[i]];
    if (!r || diarioCobrado(r.id)) continue;
    const p = clamp(r.prog(state) / r.meta, 0, 1);
    if (p > mejorDP) { mejorDP = p; mejorD = r; mejorDI = i; }
  }
  if (mejorD) out.push({ r: mejorD, tipo: 'd', premio: PREMIO_DIARIO[mejorDI] });
  return out.slice(0, 3);
}

function toast(txt, sub) { toasts.push({ txt: txt, sub: sub || '', t: 0 }); if (toasts.length > 2) toasts.shift(); }

function actualizarParticulas(dt) {
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i];
    p.t += dt;
    p.vy += 620 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vr * dt;
    if (p.t >= p.vida || p.y > cam.y + view.h + 80) confetti.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.t += dt;
    f.y -= 46 * dt;
    if (f.t >= 1.0) floats.splice(i, 1);
  }
  for (let i = toasts.length - 1; i >= 0; i--) {
    toasts[i].t += dt;
    if (toasts[i].t >= 2.4) toasts.splice(i, 1);
  }
  if (bigMsg) { bigMsg.t += dt; if (bigMsg.t > 2.6) bigMsg = null; }
}

// --- Calidad adaptativa -------------------------------------------------
const perf = { acc: 0, n: 0, ms: 16, bajo: false, cooldown: 0, buenas: 0 };
function calidadBaja() {
  if (state.calidad === 'bajo') return true;
  if (state.calidad === 'alto') return false;
  return perf.bajo;
}
function medirPerf(ms) {
  perf.acc += ms; perf.n++;
  if (perf.cooldown > 0) perf.cooldown -= ms / 1000;
  if (perf.n < 90) return;
  perf.ms = perf.acc / perf.n;
  perf.acc = 0; perf.n = 0;
  if (state.calidad !== 'auto' || perf.cooldown > 0) return;
  if (!perf.bajo && perf.ms > CONFIG.MS_MALO) {
    perf.bajo = true; perf.cooldown = 5; perf.buenas = 0; resize();
  } else if (perf.bajo && perf.ms < CONFIG.MS_BUENO) {
    perf.buenas++;
    if (perf.buenas >= 2) { perf.bajo = false; perf.buenas = 0; perf.cooldown = 5; resize(); }
  } else perf.buenas = 0;
}

// --- Fondo pre-renderizado ----------------------------------------------
// Pasto, caminos y bases de zona se dibujan UNA vez a un canvas del tamaño
// del mundo; en cada frame solo se hace drawImage. Los rótulos, cercas y
// candados van dinámicos porque cambian con el idioma y el desbloqueo.
let fondo = null;
function construirFondo() {
  fondo = document.createElement('canvas');
  fondo.width = WORLD_W; fondo.height = WORLD_H;
  const g = fondo.getContext('2d');

  g.fillStyle = '#7cc95a';
  g.fillRect(0, 0, WORLD_W, WORLD_H);
  g.fillStyle = 'rgba(255,255,255,0.045)';
  for (let y = 0; y < WORLD_H; y += 76) g.fillRect(0, y, WORLD_W, 38);
  g.fillStyle = 'rgba(0,0,0,0.05)';
  for (let y = 24; y < WORLD_H; y += 152) {
    for (let x = 18; x < WORLD_W; x += 96) g.fillRect(x + ((y / 152 | 0) % 2) * 40, y, 12, 4);
  }

  const rrg = (x, y, w, h, r) => {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y); g.arcTo(x + w, y, x + w, y + r, r);
    g.lineTo(x + w, y + h - r); g.arcTo(x + w, y + h, x + w - r, y + h, r);
    g.lineTo(x + r, y + h); g.arcTo(x, y + h, x, y + h - r, r);
    g.lineTo(x, y + r); g.arcTo(x, y, x + r, y, r);
    g.closePath();
  };

  // Bases de zona ANTES que los caminos: si van después, tapan la brecha y
  // el corredor entre huertas queda tan angosto que los baches no se pueden
  // esquivar. Con el camino encima, la ruta se ve entera y ancha.
  for (const f of FRUITS) {
    const z = f.zona;
    g.fillStyle = '#8ad168';
    rrg(z.x, z.y, z.w, z.h, 18); g.fill();
    g.fillStyle = 'rgba(0,0,0,0.04)';
    for (let y = z.y + 10; y < z.y + z.h; y += 40) g.fillRect(z.x + 8, y, z.w - 16, 14);
  }

  // Caminos: espina vertical + tres travesaños
  g.fillStyle = '#d7ac72';
  rrg(316, 372, 88, 1080, 30); g.fill();
  rrg(96, 568, 528, 62, 26); g.fill();
  rrg(96, 886, 528, 62, 26); g.fill();
  rrg(120, 1336, 480, 236, 44); g.fill();
  g.fillStyle = '#e2bc86';
  rrg(328, 384, 64, 1056, 24); g.fill();
  rrg(108, 578, 504, 42, 18); g.fill();
  rrg(108, 896, 504, 42, 18); g.fill();
  rrg(132, 1348, 456, 212, 38); g.fill();
  g.fillStyle = 'rgba(150,110,60,0.25)';
  for (let i = 0; i < 90; i++) {
    const a = (i * 977) % 1000 / 1000, b = (i * 613) % 1000 / 1000;
    g.fillRect(330 + a * 60, 390 + b * 1040, 5, 3);
  }

  // Bases de zona (el mismo verde claro para todas, bloqueadas o no)
  for (const f of FRUITS) {
    const z = f.zona;
    g.fillStyle = '#8ad168';
    rrg(z.x, z.y, z.w, z.h, 18); g.fill();
    g.fillStyle = 'rgba(0,0,0,0.04)';
    for (let y = z.y + 10; y < z.y + z.h; y += 40) g.fillRect(z.x + 8, y, z.w - 16, 14);
  }
}

function resize() {
  dpr = calidadBaja() ? 1 : Math.min(2, window.devicePixelRatio || 1);
  const winW = Math.max(240, window.innerWidth);
  const winH = Math.max(320, window.innerHeight);
  ch = winH;
  cw = Math.min(winW, Math.round(winH * 0.62));
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Cover, pero nunca tanto que la banda segura de 440 px deje de caber
  const banda = CONFIG.BANDA_X1 - CONFIG.BANDA_X0;
  view.scale = Math.min(Math.max(cw / CONFIG.VIEW_W, ch / CONFIG.VIEW_H), cw / banda);
  view.w = cw / view.scale;
  view.h = ch / view.scale;
  anchosCache = Object.create(null);
  layoutHUD();
  layoutPanel();
  layoutIntro();
  if (modal.abierto) layoutModal();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

function objetivoCamara() {
  let tx, ty;
  if (view.w >= WORLD_W) tx = (WORLD_W - view.w) / 2;
  else if (player.y > CONFIG.ZONA_MEJORAS_Y) tx = clamp(WORLD_W / 2 - view.w / 2, 0, WORLD_W - view.w);
  else tx = clamp(player.x - view.w / 2, 0, WORLD_W - view.w);
  if (view.h >= WORLD_H) ty = (WORLD_H - view.h) / 2;
  else ty = clamp(player.y - view.h * CONFIG.CAM_BIAS, 0, WORLD_H - view.h);
  return { x: tx, y: ty };
}

function actualizarCamara(dt) {
  const o = objetivoCamara();
  const k = Math.min(1, dt * CONFIG.CAM_LERP);
  cam.x = lerp(cam.x, o.x, k);
  cam.y = lerp(cam.y, o.y, k);
  if (cam.shake > 0) cam.shake = Math.max(0, cam.shake - dt);
}

function mundoAPantalla(x, y) {
  return { x: (x - cam.x) * view.scale, y: (y - cam.y) * view.scale };
}

function envolver(txt, max, size, bold) {
  const palabras = String(txt).split(' ');
  const out = [];
  let linea = '';

    const prueba = linea ? linea + ' ' + p : p;
    if (linea && anchoTexto(prueba, size, bold) > max) { out.push(linea); linea = p; }
    else linea = prueba;
  }
  if (linea) out.push(linea);
  return out;
}

}

function ciclarIdioma() {

function compartir() {
  const txt = t('compartirTxt', { d: Math.floor(state.dineroTotal), n: state.ventasTotales });
  const url = location.href.split('#')[0];
  try {
    if (navigator.share) { navigator.share({ title: 'Kiosa', text: txt, url: url }).catch(() => {}); return; }
  } catch (e) {}
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt + ' ' + url)
        .then(() => toast(t('enlaceCopiado'), ''))
        .catch(() => toast(url, ''));

    }
