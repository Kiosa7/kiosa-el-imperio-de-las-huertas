name: Desplegar a GitHub Pages

# El constructor antiguo de Pages empezó a fallar con "Page build failed" y
# duración 0, así que se publica desde Actions. Se sube solo lo que forma el
# sitio: ni .git, ni .github, ni los documentos de diseño.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Reunir los archivos del sitio
        run: |
          mkdir -p sitio
          cp index.html iconos.html manifest.webmanifest sw.js sitio/
          cp icon-192.png icon-512.png og.png sitio/
          touch sitio/.nojekyll
          ls -la sitio
          du -sh sitio

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
